<title>Piaffe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* =====================================================================
   PIAFFE · Design system
   Concept : un instrument de précision clair. Marine profond pour l'encre,
   saphir pour l'action, un seul éclat de strass pour ce qui compte.
   ===================================================================== */
:root{
  --bg:#f5f6fa; --bg-2:#eef0f7; --surface:#ffffff; --surface-2:#f7f8fc; --raise:#ffffff;
  --line:#e3e6ef; --line-2:#d3d8e6;
  --ink:#0a1636; --ink-2:#2c3757; --mut:#69728f; --mut-2:#9aa1b8;
  --acc:#3d63f2; --acc-2:#2f50d6; --acc-pale:#e8edff; --acc-ink:#ffffff; --acc-line:#c4d0ff;
  --navy:#0a1636; --navy-ink:#ffffff; --strass:#a9bcff;
  --ok:#0f9d6b; --ok-pale:#e2f6ee; --warn:#c77c02; --warn-pale:#fdf1db; --bad:#d93a42; --bad-pale:#fde7e8; --info:#3d63f2; --info-pale:#e8edff;
  --c1:#3d63f2; --c2:#0a1636; --c3:#18b4c9; --c4:#f2a33d; --c5:#9a6bff; --c6:#ef5d8c; --c7:#13a36e;
  --shadow-1:0 1px 2px rgba(10,22,54,.06),0 1px 1px rgba(10,22,54,.04);
  --shadow-2:0 1px 2px rgba(10,22,54,.05),0 8px 24px -8px rgba(10,22,54,.14);
  --shadow-3:0 2px 6px rgba(10,22,54,.06),0 24px 60px -12px rgba(10,22,54,.28);
  --ring:0 0 0 3px rgba(61,99,242,.28);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-text:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  --e-out:cubic-bezier(.22,1,.36,1); --e-in-out:cubic-bezier(.65,0,.35,1); --e-spring:cubic-bezier(.34,1.56,.64,1);
  --t-1:120ms; --t-2:200ms; --t-3:320ms; --t-4:520ms;
  --sidebar:248px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070c1f; --bg-2:#0b1229; --surface:#0e1631; --surface-2:#121b3a; --raise:#152045;
  --line:#1f2a4d; --line-2:#2a3760;
  --ink:#eef1fb; --ink-2:#c3cae0; --mut:#8a93b2; --mut-2:#5d6789;
  --acc:#6f8cff; --acc-2:#8aa1ff; --acc-pale:#18234d; --acc-ink:#ffffff; --acc-line:#2c3d84;
  --navy:#eef1fb; --navy-ink:#0a1636; --strass:#c9d5ff;
  --ok:#3ccf95; --ok-pale:#0f2e27; --warn:#f0b549; --warn-pale:#33270f; --bad:#ff6b72; --bad-pale:#3a1720; --info:#6f8cff; --info-pale:#18234d;
  --c2:#c9d5ff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 10px 30px -10px rgba(0,0,0,.6); --shadow-3:0 30px 80px -20px rgba(0,0,0,.75);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c1f; --bg-2:#0b1229; --surface:#0e1631; --surface-2:#121b3a; --raise:#152045;
  --line:#1f2a4d; --line-2:#2a3760;
  --ink:#eef1fb; --ink-2:#c3cae0; --mut:#8a93b2; --mut-2:#5d6789;
  --acc:#6f8cff; --acc-2:#8aa1ff; --acc-pale:#18234d; --acc-ink:#ffffff; --acc-line:#2c3d84;
  --navy:#eef1fb; --navy-ink:#0a1636; --strass:#c9d5ff;
  --ok:#3ccf95; --ok-pale:#0f2e27; --warn:#f0b549; --warn-pale:#33270f; --bad:#ff6b72; --bad-pale:#3a1720; --info:#6f8cff; --info-pale:#18234d;
  --c2:#c9d5ff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 10px 30px -10px rgba(0,0,0,.6); --shadow-3:0 30px 80px -20px rgba(0,0,0,.75);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-text);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
::selection{background:var(--acc-pale);color:var(--ink)}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance;font-weight:700;color:var(--ink)}
p{margin:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i .f{fill:currentColor;stroke:none}
svg.i .a{stroke:var(--acc)} svg.i .af{fill:var(--acc);stroke:none}
.sm svg.i,svg.i.sm{width:16px;height:16px}
svg.i.lg{width:22px;height:22px}

/* ---------- Mise en page ---------- */
.stack{display:flex;flex-direction:column;gap:var(--g,12px);min-width:0}
.hrow{display:flex;align-items:center;gap:var(--g,10px);min-width:0}
.hrow.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.g2,.g3,.g4,.g5{display:grid;gap:var(--g,14px);min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
@container main (max-width:1080px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (max-width:760px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}.hide-s{display:none!important}}
@container main (max-width:520px){.g3,.g4{grid-template-columns:minmax(0,1fr)}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (min-width:761px){.only-s{display:none!important}}
.mut{color:var(--mut)} .mut2{color:var(--mut-2)} .acc{color:var(--acc)} .okc{color:var(--ok)} .badc{color:var(--bad)} .warnc{color:var(--warn)}
.xs{font-size:11.5px}.s{font-size:12.5px}.m{font-size:14px}.l{font-size:16px}
.b{font-weight:600}.bb{font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.disp{font-family:var(--f-display);letter-spacing:-.03em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

/* ---------- En-tête de page ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
.ph .sub{color:var(--mut);margin-top:6px;font-size:14px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
@container main (max-width:520px){.ph h1{font-size:25px}.ph{margin-bottom:14px}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-1);transition:transform var(--t-1) var(--e-out),background var(--t-2),box-shadow var(--t-2);white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(10,22,54,.2),0 6px 16px -6px rgba(61,99,242,.6)}
.btn.pri:hover{background:var(--acc-2)}
.btn.dark{background:var(--navy);color:var(--navy-ink);box-shadow:var(--shadow-2)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;gap:6px}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:var(--r-md)}
.btn.icon{width:36px;padding:0}.btn.icon.sm{width:30px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.kbd{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;background:var(--bg-2);color:var(--mut);box-shadow:inset 0 -1px 0 var(--line-2)}

/* ---------- Pastilles ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;background:var(--bg-2);color:var(--ink-2);white-space:nowrap;line-height:1}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;display:var(--dot,none)}
.chip.dot{--dot:block}
.chip.ok{background:var(--ok-pale);color:var(--ok)} .chip.warn{background:var(--warn-pale);color:var(--warn)} .chip.bad{background:var(--bad-pale);color:var(--bad)}
.chip.acc{background:var(--acc-pale);color:var(--acc)} .chip.navy{background:var(--navy);color:var(--navy-ink)} .chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--mut)}
.chip.lg{height:28px;padding:0 11px;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);cursor:pointer;transition:all var(--t-2)}
.tag[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);box-shadow:none}

/* ---------- Cartes ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-1);min-width:0;position:relative}
.card.pad{padding:18px}
.card.flat{box-shadow:inset 0 0 0 1px var(--line)}
.card.soft{background:var(--surface-2);box-shadow:none}
.card.navy{background:var(--navy);color:var(--navy-ink);box-shadow:var(--shadow-2)}
.card.navy .mut{color:color-mix(in srgb,var(--navy-ink) 62%,transparent)}
.card.hover{transition:transform var(--t-2) var(--e-out),box-shadow var(--t-2);cursor:pointer}
.card.hover:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-2)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.ch h3{font-size:15px;letter-spacing:-.015em;font-weight:650}
.ch .mut{font-size:12.5px}
.cb{padding:14px 16px 16px}
.cf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}

/* ---------- Indicateurs ---------- */
.kpi{padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lab{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .val{font:700 27px/1 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;color:var(--mut);font-weight:600;letter-spacing:-.01em;margin-left:2px}
.kpi .del{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .del.up{color:var(--ok)} .kpi .del.down{color:var(--bad)}
.kpi svg.spark{width:100%;height:34px;margin-top:2px}
.delta{font-size:12px;font-weight:600}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;min-width:0;transition:background var(--t-1);position:relative}
.li+.li::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface-2)}
.li .t{font-weight:600;font-size:13.5px}.li .s{font-size:12.5px;color:var(--mut)}
.li .r{margin-left:auto;text-align:right;flex:none;display:flex;align-items:center;gap:8px}

/* ---------- Avatars ---------- */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;flex:none;color:#fff;background:var(--c,var(--acc));overflow:hidden;position:relative}
.av.sm{width:24px;height:24px;font-size:9.5px}.av.lg{width:44px;height:44px;font-size:14px}.av.xl{width:64px;height:64px;font-size:20px}
.av.sq{border-radius:10px}
.av.horse{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--c,var(--ink))}
.av.horse svg{width:62%;height:62%}
.avs{display:flex}.avs .av{box-shadow:0 0 0 2px var(--surface)}.avs .av+.av{margin-left:-8px}

/* ---------- Tableaux ---------- */
.tw{overflow:auto;min-width:0;border-radius:var(--r-lg)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--t-1)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Formulaires ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.in{height:38px;padding:0 12px;border-radius:var(--r-sm);background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line-2);outline:none;transition:box-shadow var(--t-2);width:100%;min-width:0}
textarea.in{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--acc),var(--ring)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.search{position:relative;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .in{padding-left:36px}
.tog{width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background var(--t-2) var(--e-out);cursor:pointer}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(10,22,54,.3);transition:transform var(--t-3) var(--e-spring)}
.tog[aria-checked="true"]{background:var(--acc)}
.tog[aria-checked="true"]::after{transform:translateX(16px)}
.chk{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.6px var(--line-2);display:inline-grid;place-items:center;flex:none;cursor:pointer;transition:all var(--t-2) var(--e-out);background:var(--surface)}
.chk svg{width:13px;height:13px;stroke:#fff;stroke-width:2.6;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset var(--t-3) var(--e-out)}
.chk[aria-checked="true"]{background:var(--acc);box-shadow:none}
.chk[aria-checked="true"] svg{stroke-dashoffset:0}

/* ---------- Segments et onglets ---------- */
.seg{display:inline-flex;padding:3px;border-radius:var(--r-sm);background:var(--bg-2);gap:2px;position:relative;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mut);transition:color var(--t-2),background var(--t-2),box-shadow var(--t-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 12px;font-weight:600;color:var(--mut);position:relative;white-space:nowrap;font-size:13.5px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--acc)}

/* ---------- Progression ---------- */
.bar{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--acc));width:var(--v,0%);transition:width var(--t-4) var(--e-out)}
.ring{--v:0;--s:44px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--c,var(--acc)) calc(var(--v)*1%),var(--bg-2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-l);width:calc(var(--s) - 10px);height:calc(var(--s) - 10px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 11.5px var(--f-text);font-variant-numeric:tabular-nums}

/* ---------- Divers ---------- */
.empty{padding:36px 20px;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg.i{width:28px;height:28px;color:var(--mut-2)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--acc-pale);color:var(--ink-2);font-size:13px;align-items:flex-start}
.note svg.i{color:var(--acc);margin-top:1px}
.note.warn{background:var(--warn-pale)}.note.warn svg.i{color:var(--warn)}
.note.bad{background:var(--bad-pale)}.note.bad svg.i{color:var(--bad)}
.note.ok{background:var(--ok-pale)}.note.ok svg.i{color:var(--ok)}
.tl{display:flex;flex-direction:column;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--c,var(--acc))}
.strass{display:inline-block;width:10px;height:10px;background:var(--acc);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:scint 3.2s var(--e-in-out) infinite;flex:none}
@keyframes scint{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.7) rotate(45deg)}}
.skel{background:linear-gradient(90deg,var(--bg-2),var(--surface-2),var(--bg-2));background-size:200% 100%;animation:skel 1.2s linear infinite;border-radius:6px}
@keyframes skel{to{background-position:-200% 0}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:rgba(217,58,66,.92);padding:3px 7px;border-radius:5px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.scroll-x{overflow-x:auto;scrollbar-width:none;min-width:0}
.scroll-x::-webkit-scrollbar{display:none}

/* ---------- Mouvement d'entrée ---------- */
.rise>*{animation:rise var(--t-4) var(--e-out) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.pop{animation:pop var(--t-3) var(--e-spring) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.fade{animation:fade var(--t-3) var(--e-out) both}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}

/* ---------- Graphiques ---------- */
svg.chart{display:block;width:100%;overflow:visible}
svg.chart text{font:500 10.5px var(--f-text);fill:var(--mut)}
svg.chart .grid{stroke:var(--line);stroke-width:1}

  var disk=new T.Mesh(new T.CircleGeometry(.55,64),new T.MeshBasicMaterial({color:0x3d63f2,transparent:true,opacity:.06}));disk.rotation.x=-Math.PI/2;disk.position.y=.001;sc.add(disk);
