<title>Piaffe Lumière</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Direction A · Lumière
   Mise en page : une app posée sur une aurore claire ; barre latérale en verre flottante à gauche, contenu en cartes de verre superposées,
   planning en timeline par pistes ; en téléphone, la même app dans un iPhone avec barre d'onglets flottante au pouce. */
:root{
  --bg:#edf1f8; --bg-2:#e3e9f4;
  --aur-1:#c9d8ff; --aur-2:#e6dcff; --aur-3:#cdeff4; --aur-4:#ffffff;
  --ink:#0a1636; --ink-2:#2c3a5c; --mut:#56627e; --mut-2:#8590a8;
  --line:rgba(10,22,54,.08); --line-2:rgba(10,22,54,.14);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.80); --glass-3:rgba(255,255,255,.94);
  --glass-edge:rgba(255,255,255,.95); --glass-shade:rgba(255,255,255,.35);
  --sap:#2a55e6; --sap-2:#5c80ff; --sap-deep:#132d8f; --sap-pale:rgba(42,85,230,.10); --sap-line:rgba(42,85,230,.26); --on-sap:#ffffff;
  --strass:#8fd0ff; --strass-2:#ffffff; --strass-core:#2a55e6;
  --ok:#11905f; --ok-pale:rgba(17,144,95,.12); --warn:#b86e00; --warn-pale:rgba(214,140,10,.14); --bad:#d93a2f; --bad-pale:rgba(217,58,47,.11);
  --d-obst:#2f5fee; --d-plat:#7b55ea; --d-ens:#0b97c2; --d-poney:#0f9d8a; --d-adul:#d9860b; --d-part:#d6457a; --d-trav:#2a9a53; --d-ent:#7d879c; --d-loc:#5c6782;
  --scrim:rgba(14,26,60,.16);
  --sh-1:0 1px 1px rgba(10,22,54,.04),0 4px 14px -6px rgba(25,45,110,.16);
  --sh-2:0 1px 1px rgba(10,22,54,.04),0 10px 30px -10px rgba(25,45,110,.22),0 30px 70px -30px rgba(25,45,110,.26);
  --sh-3:0 2px 4px rgba(10,22,54,.05),0 24px 60px -16px rgba(25,45,110,.32),0 60px 120px -40px rgba(25,45,110,.30);
  --device:#1d2233; --device-2:#3a4157;
  --f-display:"Funnel Display","Geist",ui-sans-serif,system-ui,sans-serif;
  --f-text:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --spring:cubic-bezier(.22,1.2,.36,1);
  --out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070c1c; --bg-2:#0c1328;
  --aur-1:#142a6e; --aur-2:#2a1b5e; --aur-3:#0b3a4a; --aur-4:#0a1230;
  --ink:#eef2ff; --ink-2:#c9d2ee; --mut:#98a3c2; --mut-2:#6f7a99;
  --line:rgba(200,215,255,.09); --line-2:rgba(200,215,255,.16);
  --glass:rgba(22,32,66,.52); --glass-2:rgba(28,40,80,.72); --glass-3:rgba(30,42,84,.94);
  --glass-edge:rgba(170,195,255,.16); --glass-shade:rgba(160,190,255,.05);
  --sap:#6b8cff; --sap-2:#93abff; --sap-deep:#c8d5ff; --sap-pale:rgba(107,140,255,.16); --sap-line:rgba(107,140,255,.36); --on-sap:#081233;
  --strass:#a9dcff; --strass-2:#ffffff; --strass-core:#7fa2ff;
  --ok:#3fcf8e; --ok-pale:rgba(63,207,142,.14); --warn:#f2b04a; --warn-pale:rgba(242,176,74,.15); --bad:#ff6b5f; --bad-pale:rgba(255,107,95,.15);
  --d-obst:#6b8cff; --d-plat:#a58bff; --d-ens:#3cc3ea; --d-poney:#34cdb6; --d-adul:#f5b041; --d-part:#ff7aa8; --d-trav:#4fd17f; --d-ent:#a3acc0; --d-loc:#8f9bb8;
  --scrim:rgba(2,6,20,.5);
  --sh-1:0 1px 1px rgba(0,0,0,.3),0 4px 14px -6px rgba(0,0,0,.5);
  --sh-2:0 1px 1px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.55),0 30px 70px -30px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.35),0 24px 60px -16px rgba(0,0,0,.6),0 60px 120px -40px rgba(0,0,0,.6);
  --device:#05070e; --device-2:#2a3146;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c1c; --bg-2:#0c1328;
  --aur-1:#142a6e; --aur-2:#2a1b5e; --aur-3:#0b3a4a; --aur-4:#0a1230;
  --ink:#eef2ff; --ink-2:#c9d2ee; --mut:#98a3c2; --mut-2:#6f7a99;
  --line:rgba(200,215,255,.09); --line-2:rgba(200,215,255,.16);
  --glass:rgba(22,32,66,.52); --glass-2:rgba(28,40,80,.72); --glass-3:rgba(30,42,84,.94);
  --glass-edge:rgba(170,195,255,.16); --glass-shade:rgba(160,190,255,.05);
  --sap:#6b8cff; --sap-2:#93abff; --sap-deep:#c8d5ff; --sap-pale:rgba(107,140,255,.16); --sap-line:rgba(107,140,255,.36); --on-sap:#081233;
  --strass:#a9dcff; --strass-2:#ffffff; --strass-core:#7fa2ff;
  --ok:#3fcf8e; --ok-pale:rgba(63,207,142,.14); --warn:#f2b04a; --warn-pale:rgba(242,176,74,.15); --bad:#ff6b5f; --bad-pale:rgba(255,107,95,.15);
  --d-obst:#6b8cff; --d-plat:#a58bff; --d-ens:#3cc3ea; --d-poney:#34cdb6; --d-adul:#f5b041; --d-part:#ff7aa8; --d-trav:#4fd17f; --d-ent:#a3acc0; --d-loc:#8f9bb8;
  --scrim:rgba(2,6,20,.5);
  --sh-1:0 1px 1px rgba(0,0,0,.3),0 4px 14px -6px rgba(0,0,0,.5);
  --sh-2:0 1px 1px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.55),0 30px 70px -30px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.35),0 24px 60px -16px rgba(0,0,0,.6),0 60px 120px -40px rgba(0,0,0,.6);
  --device:#05070e; --device-2:#2a3146;
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-text);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:20px;height:20px}
svg.i.xs{width:16px;height:16px;stroke-width:2}
:focus-visible{outline:2.5px solid var(--sap);outline-offset:2px;border-radius:12px}

/* ---------- Aurore de fond ---------- */
#root{position:fixed;inset:0;overflow:hidden}
.aurora{position:absolute;inset:-10%;pointer-events:none;
  background:
   radial-gradient(42% 38% at 18% 12%,var(--aur-1),transparent 70%),
   radial-gradient(36% 40% at 82% 8%,var(--aur-2),transparent 70%),
   radial-gradient(40% 36% at 70% 88%,var(--aur-3),transparent 70%),
   radial-gradient(30% 30% at 30% 80%,var(--aur-4),transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(2%,-2%,0) scale(1.06)}}

/* ---------- Scène et appareil ---------- */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage.desk .device{width:100%;height:100%}
.stage.desk .screen{width:100%;height:100%}
.stage.tel{gap:64px}
.stage.tel .device{width:414px;height:868px;flex:none;border-radius:68px;padding:12px;transform:scale(var(--fit,1));transform-origin:center;
  background:linear-gradient(145deg,var(--device-2),var(--device) 30%,var(--device) 70%,var(--device-2));
  box-shadow:0 0 0 1.5px var(--device-2),var(--sh-3);position:relative}
.stage.tel .device::before{content:"";position:absolute;left:-3px;top:180px;width:3px;height:64px;border-radius:2px;background:var(--device-2);box-shadow:0 84px 0 var(--device-2)}
.stage.tel .device::after{content:"";position:absolute;right:-3px;top:220px;width:3px;height:100px;border-radius:2px;background:var(--device-2)}
.stage.tel .screen{width:390px;height:844px;border-radius:56px;overflow:hidden;position:relative;background:var(--bg);isolation:isolate}
.stage.tel .screen::after{content:"";position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
.stage.native .device,.stage.native .screen{width:100%;height:100%}
.tel-cap{max-width:300px;display:flex;flex-direction:column;gap:14px}
.tel-cap h2{font-size:40px;line-height:1.02;letter-spacing:-.035em}
.tel-cap p{color:var(--mut);font-size:16px}
.stage:not(.tel) .tel-cap{display:none}
@media (max-width:1100px){.tel-cap{display:none!important}}

/* ---------- App ---------- */
.pf{position:relative;width:100%;height:100%;display:grid;grid-template-columns:304px minmax(0,1fr);gap:14px;padding:14px;overflow:hidden}
.pf .aurora{z-index:0}
.pf>*{position:relative;z-index:1}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  border:1px solid var(--glass-edge);box-shadow:var(--sh-2),inset 0 1px 0 var(--glass-shade)}

/* Barre latérale */
.side{border-radius:var(--r-xl);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px}
.club{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:22px;text-align:left;transition:background .25s var(--out)}
.club:hover{background:var(--glass-2)}
.club .lg{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;
  background:radial-gradient(120% 120% at 20% 10%,var(--sap-2),var(--sap) 45%,#0a1636);box-shadow:0 8px 20px -8px var(--sap),inset 0 1px 0 rgba(255,255,255,.35)}
.club b{display:block;font:600 17px/1.2 var(--f-display);letter-spacing:-.01em}
.club small{display:block;color:var(--mut);font-size:14px;line-height:1.3}
.club .ud{margin-left:auto;color:var(--mut-2)}
.srch{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line);color:var(--mut);width:100%;transition:box-shadow .25s,border-color .25s}
.srch:hover{border-color:var(--sap-line);box-shadow:0 0 0 4px var(--sap-pale)}
.srch span{flex:1;text-align:left;font-size:15px}
.kbd{font:500 12.5px var(--f-text);padding:3px 7px;border-radius:7px;border:1px solid var(--line-2);color:var(--mut)}
.nav{flex:1;overflow:auto;padding:4px 12px 12px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.ni{position:relative;display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 12px;border-radius:16px;color:var(--ink-2);font-size:16px;font-weight:500;text-align:left;transition:background .25s var(--out),color .25s,transform .35s var(--spring)}
.ni:hover{background:var(--glass-2);color:var(--ink)}
.ni:active{transform:scale(.98)}
.ni svg.i{color:var(--mut)}
.ni.on{background:var(--glass-3);color:var(--ink);box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-edge);font-weight:600}
.ni.on svg.i{color:var(--sap)}
.ni .bd{margin-left:auto;min-width:26px;height:24px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--line);color:var(--ink-2)}
.ni .bd.hot{background:var(--bad);color:#fff}
.ni .bd.acc{background:var(--sap-pale);color:var(--sap)}
.sec{margin-top:10px}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border-radius:12px;color:var(--mut);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sec-h:hover{color:var(--ink)}
.sec-h svg{margin-left:auto;transition:transform .45s var(--spring)}
.sec.shut .sec-h svg{transform:rotate(-90deg)}
.sec-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--out),opacity .3s}
.sec.shut .sec-b{grid-template-rows:0fr;opacity:0}
.sec-b>div{overflow:hidden;display:flex;flex-direction:column;gap:2px}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.ask{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--sap-pale),transparent 70%),var(--glass-2);border:1px solid var(--sap-line);transition:transform .4s var(--spring),box-shadow .3s}
.ask:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.ask b{display:block;font-size:16px;font-weight:600}
.ask small{display:block;color:var(--mut);font-size:14px}
.ask .st{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--sap);color:var(--on-sap);flex:none}

/* Strass : éclat à quatre branches, en petite touche */
.strass{display:inline-block;width:16px;height:16px;flex:none;background:radial-gradient(circle,var(--strass-2) 0 18%,transparent 19%),conic-gradient(from 45deg,var(--strass-core),var(--strass),var(--strass-2),var(--strass),var(--strass-core),var(--strass),var(--strass-2),var(--strass),var(--strass-core));
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px var(--strass));animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.72) rotate(45deg);opacity:.75}}

/* Zone principale */
.main{min-width:0;min-height:0;overflow:auto;border-radius:var(--r-xl);scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 22px;margin-bottom:6px;border-radius:24px}
.top .when{font-size:15px;color:var(--mut)}
.top .when b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.ib{position:relative;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:var(--ink-2);background:var(--glass-2);border:1px solid var(--line);transition:transform .4s var(--spring),box-shadow .25s,background .25s}
.ib:hover{transform:translateY(-2px);box-shadow:var(--sh-1);background:var(--glass-3)}
.ib .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2.5px var(--glass-3)}
.me{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;height:46px;border-radius:23px;background:var(--glass-2);border:1px solid var(--line);font-weight:500;font-size:15px}
.page{padding:20px 22px 120px;display:flex;flex-direction:column;gap:18px}

/* Boutons et éléments */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:15px;font-weight:600;font-size:15px;white-space:nowrap;
  background:var(--glass-2);border:1px solid var(--line);color:var(--ink);transition:transform .4s var(--spring),box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh-1);background:var(--glass-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--sap-2),var(--sap));color:var(--on-sap);border-color:transparent;box-shadow:0 8px 22px -10px var(--sap),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.pri:hover{box-shadow:0 14px 30px -12px var(--sap),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.sm{height:40px;padding:0 14px;font-size:14.5px;border-radius:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--glass-2)}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:13.5px;font-weight:600;background:var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-pale);color:var(--ok)}.chip.warn{background:var(--warn-pale);color:var(--warn)}.chip.bad{background:var(--bad-pale);color:var(--bad)}.chip.acc{background:var(--sap-pale);color:var(--sap)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.card{border-radius:var(--r-l);padding:22px;min-width:0;display:flex;flex-direction:column;gap:16px;transition:transform .5s var(--spring),box-shadow .35s var(--out)}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ch h3{font-size:21px;line-height:1.2}
.ch .sp{flex:1}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.s{font-size:14.5px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:#fff;
  background:linear-gradient(145deg,hsl(var(--h) 75% 66%),hsl(calc(var(--h) + 30) 70% 46%));box-shadow:0 0 0 2px var(--glass-3)}
.av.l{width:44px;height:44px;font-size:15px}
.av.xs{width:26px;height:26px;font-size:10.5px}
.avs{display:flex}
.avs .av+.av{margin-left:-8px}
.avs .more{background:var(--glass-3);color:var(--ink-2);font-size:11.5px}

/* Entrées */
.rise>*{animation:rise .7s var(--out) both;animation-delay:calc(var(--k,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- Cockpit ---------- */
.hello{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:4px 2px 2px}
.hello h1{font-size:56px;line-height:1;letter-spacing:-.045em;font-weight:600}
.hello p{font-size:17px;color:var(--mut);margin-top:10px}
.hello .sp{flex:1}
.hello .acts{display:flex;gap:10px}
.g{display:grid;gap:16px}
.g-hero{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.brief{position:relative;overflow:hidden;padding:28px;gap:18px;background:linear-gradient(140deg,color-mix(in srgb,var(--sap) 13%,var(--glass-2)),var(--glass) 55%,color-mix(in srgb,var(--d-plat) 8%,var(--glass)))}
.brief .halo{position:absolute;right:-90px;top:-110px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--strass) 55%,transparent),transparent 65%);pointer-events:none;animation:halo 10s ease-in-out infinite alternate}
@keyframes halo{to{transform:translate(-40px,30px) scale(1.15)}}
.brief .ey{display:flex;align-items:center;gap:10px;color:var(--sap);font-weight:600;font-size:14.5px}
.brief .ey .strass{width:20px;height:20px}
.brief h2{font-size:32px;line-height:1.1;letter-spacing:-.03em;max-width:24ch;position:relative}
.pts{display:flex;flex-direction:column;gap:4px;position:relative}
.pt{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;margin:0 -12px;border-radius:16px;font-size:16px;color:var(--ink-2);transition:background .25s;animation:rise .6s var(--out) both;animation-delay:calc(var(--k)*90ms + 250ms)}
.pt:hover{background:var(--glass-2)}
.pt .pi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--glass-3);color:var(--c,var(--sap));box-shadow:var(--sh-1)}
.pt b{color:var(--ink);font-weight:600}
.pt span{padding-top:6px}
.brief .acts{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ok);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
.occ{display:flex;align-items:center;gap:18px}
.occ .big{font:600 44px/1 var(--f-display);letter-spacing:-.04em}
.occ .big small{font-size:22px;color:var(--mut)}
.where{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.where div{padding:12px;min-width:0;border-radius:18px;background:var(--glass-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.where span{font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap}
.where b{font:600 28px/1 var(--f-display);letter-spacing:-.03em}
.sens{display:flex;flex-direction:column;gap:2px}
.sen{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:15px;border-top:1px solid var(--line)}
.sen svg{color:var(--mut)}
.sen .v{margin-left:auto;font-weight:600}
.sen.warn svg,.sen.warn .v{color:var(--warn)}
.kpi{padding:20px;gap:10px}
.kpi .kh{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:15px}
.kpi .kh .ki{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--sap-pale);color:var(--sap)}
.kpi .kv{font:600 36px/1 var(--f-display);letter-spacing:-.04em}
.kpi .kf{display:flex;align-items:center;gap:8px;justify-content:space-between}
.kpi .kf small{color:var(--mut);font-size:14px;white-space:nowrap}
.spark{width:96px;height:34px;overflow:visible}
.spark path{fill:none;stroke:var(--sap);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{fill:var(--sap-pale);stroke:none}
.spark circle{fill:var(--sap);stroke:var(--glass-3);stroke-width:2}
.spark .ln{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.4s .3s var(--out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* fil de la journée */
.fil{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:14px;row-gap:8px;align-items:center;--x0:164px}
.fil .lb{font-size:14px;color:var(--mut);white-space:nowrap}
.fil .tr{position:relative;height:22px;border-radius:8px;background:var(--line)}
.fil .tr i{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--c);transform-origin:left;animation:grow .8s var(--out) both;animation-delay:calc(var(--k)*50ms + 300ms)}
.fil .tr i.past{opacity:.35}
@keyframes grow{from{transform:scaleX(0)}}
.fil .ax{grid-column:2;position:relative;height:18px;font-size:12.5px;color:var(--mut-2)}
.fil .ax span{position:absolute;transform:translateX(-50%)}
.fil .nowc{position:absolute;inset:0 0 0 var(--x0);pointer-events:none}
.fil .nowc b{position:absolute;top:-6px;bottom:22px;width:2px;margin-left:-1px;background:var(--bad);border-radius:2px}
.fil .nowc b::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
.les{display:flex;flex-direction:column}
.le{display:grid;grid-template-columns:70px 6px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 12px;margin:0 -12px;border-radius:18px;text-align:left;width:calc(100% + 24px);transition:background .25s,transform .45s var(--spring)}
.le:hover{background:var(--glass-2);transform:translateX(4px)}
.le .t{font:600 20px/1 var(--f-display);letter-spacing:-.02em}
.le .t small{display:block;font:500 13px var(--f-text);color:var(--mut);margin-top:5px;letter-spacing:0}
.le .bar{width:6px;height:40px;border-radius:3px;background:var(--c)}
.le .tt{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.le .ss{font-size:14.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.le.next{background:var(--sap-pale)}
.le.past{opacity:.55}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring .bg{stroke:var(--line-2)}
.ring .fg{stroke:var(--c,var(--sap));stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--out)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700}
/* à traiter */
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:14px;padding:10px 10px;margin:0 -10px;border-radius:16px;width:calc(100% + 20px);text-align:left;transition:background .25s}
.task:hover{background:var(--glass-2)}
.chk{position:relative;width:28px;height:28px;border-radius:10px;flex:none;border:2px solid var(--line-2);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .45s var(--spring)}
.chk svg{width:18px;height:18px;stroke:var(--on-sap);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .05s var(--out)}
.on>.chk,.chk.on{background:var(--sap);border-color:var(--sap);transform:scale(1.04)}
.on>.chk svg,.chk.on svg{stroke-dashoffset:0}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:500;font-size:16px;transition:color .3s}
.task .tx small{display:block;font-size:14px;color:var(--mut)}
.task.on .tx b{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--mut-2)}
.task .tm{font-size:14px;color:var(--mut);white-space:nowrap}
.task.urg .tm{color:var(--bad);font-weight:600}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:12px;height:12px;margin:-6px;background:var(--strass);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:burst .7s var(--out) forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1) rotate(90deg);opacity:0}}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sap),var(--sap-2));transition:width .7s var(--spring)}
.val{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);transition:opacity .4s,transform .5s var(--out)}
.val:first-child{border-top:0}
.val .vi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--c-pale,var(--sap-pale));color:var(--c,var(--sap))}
.val .tx{flex:1;min-width:0}
.val .tx b{display:block;font-weight:600;font-size:15.5px}
.val .tx small{display:block;color:var(--mut);font-size:14px}
.val.done{opacity:.5}
.val.done .btn{pointer-events:none}
.wx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wx div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:16px;font-size:14px}
.wx div.today{background:var(--glass-3);box-shadow:var(--sh-1)}
.wx b{font-size:16px}
.wx .r{color:var(--sap);font-weight:600}
.note{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--warn-pale);color:var(--ink-2);font-size:15px}
.note svg{color:var(--warn)}
.care{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.care:first-child{border-top:0}
.care .tm{width:62px;font:600 16px var(--f-display);flex:none}
.care .tx{flex:1;min-width:0}
.care b{display:block;font-weight:600;font-size:15.5px}
.care small{display:block;color:var(--mut);font-size:14px}
.hav{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(150deg,hsl(var(--h) 45% 88%),hsl(var(--h) 40% 74%));color:hsl(var(--h) 45% 26%)}
.hav svg{width:26px;height:26px}

/* ---------- Planning ---------- */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph h1{font-size:48px;line-height:1;letter-spacing:-.045em}
.ph .sp{flex:1}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:16px;background:var(--line);gap:2px}
.seg button{position:relative;z-index:1;height:38px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut);transition:color .3s}
.seg button.on{color:var(--ink)}
.seg .th{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:12px;background:var(--glass-3);box-shadow:var(--sh-1);transition:left .5s var(--spring),width .5s var(--spring)}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pbar .date{font:600 26px/1.1 var(--f-display);letter-spacing:-.03em;min-width:0}
.pbar .date small{display:block;font:500 15px var(--f-text);color:var(--mut);letter-spacing:0;margin-top:4px}
.pbar .sp{flex:1}
.coachs{display:flex;gap:8px;flex-wrap:wrap}
.cf{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 6px;border-radius:23px;background:var(--glass-2);border:1px solid var(--line);font-size:15px;font-weight:500;transition:transform .4s var(--spring),box-shadow .25s,opacity .3s,border-color .3s}
.cf:hover{transform:translateY(-2px);box-shadow:var(--sh-1)}
.cf small{color:var(--mut);font-size:13.5px}
.cf.on{border-color:var(--sap);box-shadow:0 0 0 3px var(--sap-pale)}
.cf.dim{opacity:.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.board{border-radius:var(--r-l);padding:0;overflow:hidden;gap:0}
.cols-h{display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.colh{padding:14px 14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--line);text-align:left;transition:background .25s}
.colh b{font:600 17px/1.15 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colh small{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colh .fl{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.colh .fl i{display:block;height:100%;background:var(--sap);border-radius:3px}
button.colh:hover{background:var(--glass-2)}
.colh.today b{color:var(--sap)}
.colh .dn{display:flex;align-items:baseline;gap:8px}
.colh .dn em{font-style:normal;font:600 24px/1 var(--f-display)}
.colh.today .dn em{color:var(--on-sap);background:var(--sap);border-radius:12px;padding:3px 8px}
.grid{position:relative;display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr))}
.hours{position:relative}
.hours span{position:absolute;right:10px;font-size:13px;color:var(--mut-2);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--H)}
.col.drop{background-color:var(--sap-pale)}
.bk{position:absolute;left:6px;right:6px;border-radius:16px;padding:9px 11px;overflow:hidden;cursor:grab;text-align:left;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 24%,var(--glass-3)),color-mix(in srgb,var(--c) 12%,var(--glass-2)));
  -webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);
  border:1px solid color-mix(in srgb,var(--c) 32%,transparent);box-shadow:0 1px 0 var(--glass-shade) inset,0 6px 16px -10px color-mix(in srgb,var(--c) 70%,transparent);
  transition:box-shadow .35s var(--out),transform .45s var(--spring),opacity .3s,filter .3s}
.bk::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.bk:hover{z-index:4;transform:translateY(-2px) scale(1.012);box-shadow:0 1px 0 var(--glass-shade) inset,0 18px 36px -14px color-mix(in srgb,var(--c) 75%,transparent)}
.bk.dim{opacity:.28;filter:saturate(.3)}
.bk.sel{box-shadow:0 0 0 2.5px var(--c),0 18px 36px -14px color-mix(in srgb,var(--c) 75%,transparent);z-index:5}
.bk.drag{cursor:grabbing;z-index:30;transition:none;box-shadow:0 30px 60px -16px color-mix(in srgb,var(--c) 80%,transparent),0 0 0 2px var(--c);scale:1.03}
.bk.past{opacity:.6}
.bk.flat{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,transparent) 0 8px,transparent 8px 16px),var(--glass);border-style:dashed}
.bk-in{display:flex;flex-direction:column;gap:3px;height:100%;min-width:0;padding-left:4px}
.bk-in>*{flex-shrink:0}
.bk .bl{display:flex;min-width:0;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--c) 70%,var(--ink));white-space:nowrap}
.bk .bt{font-variant-numeric:tabular-nums;font-weight:700;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.bk .bw{overflow:hidden;text-overflow:ellipsis}
.bk .bn .bt{font:700 13px var(--f-text);margin-right:4px}
.bk .b0{position:absolute;left:14px;right:12px;bottom:6px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--c) 16%,transparent);overflow:hidden}
.bk .b0 i{display:block;height:100%;background:var(--c);border-radius:2px}
.bk .bn{font:600 16px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .bm{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bf{margin-top:auto;display:flex;align-items:center;gap:8px}
.bk .bf .g{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 16%,transparent);overflow:hidden;display:block}
.bk .bf .g i{display:block;height:100%;border-radius:3px;background:var(--c)}
.bk .bf b{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.bk .full{color:var(--c)}
.bk.sm{padding:6px 9px;border-radius:12px}
.bk.sm .bn{font-size:14px}
.bk.sm .bl,.bk.sm .bn .bt{font-size:12px}
.bk.sm .bn{font-size:14px;line-height:1.2}
.bk.new{animation:pop .9s var(--spring) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
.bk .gl{position:absolute;right:8px;top:8px}
.pv{position:absolute;left:6px;right:6px;border-radius:16px;border:2px dashed var(--sap);background:var(--sap-pale);pointer-events:none;display:flex;align-items:flex-start;padding:8px 12px;font-size:14px;font-weight:600;color:var(--sap);transition:top .4s var(--spring),height .4s var(--spring)}
.pv.bad{border-color:var(--bad);background:var(--bad-pale);color:var(--bad)}
.nowl{position:absolute;left:64px;right:0;height:0;border-top:2px solid var(--bad);z-index:6;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-6px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--bad);animation:pulse 2s infinite}
.nowl b{position:absolute;left:-62px;top:-12px;font-size:12.5px;font-weight:700;color:var(--on-sap);background:var(--bad);padding:2px 7px;border-radius:8px}
.nowl.wk{left:var(--l);right:var(--r)}
.nowl.wk b{display:none}
.dz{transition:opacity .35s var(--out),transform .45s var(--out)}
.dz.out-l{opacity:0;transform:translateX(-26px)}
.dz.out-r{opacity:0;transform:translateX(26px)}
.hint{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--mut)}
/* semaine en téléphone */
.wl{display:flex;flex-direction:column;gap:12px}
.wd{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;text-align:left;width:100%;transition:transform .45s var(--spring),box-shadow .3s}
.wd:active{transform:scale(.98)}
.wd .wh{display:flex;align-items:center;gap:12px}
.wd .wh .dn{width:52px;height:52px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--glass-3);box-shadow:var(--sh-1);flex:none}
.wd .wh .dn small{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.wd .wh .dn b{font:600 22px/1 var(--f-display)}
.wd.today .wh .dn{background:var(--sap);color:var(--on-sap)}
.wd.today .wh .dn small{color:var(--on-sap);opacity:.8}
.wd .wh .tx{flex:1;min-width:0}
.wd .wh .tx b{display:block;font-weight:600;font-size:16.5px}
.wd .wh .tx small{display:block;color:var(--mut);font-size:14px}
.wd .strip{position:relative;height:30px;border-radius:10px;background:var(--line)}
.wd .strip i{position:absolute;top:4px;bottom:4px;border-radius:7px;background:var(--c)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.dp{flex:1 0 50px;height:66px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--glass-2);border:1px solid var(--line);scroll-snap-align:start;transition:background .3s,color .3s,transform .4s var(--spring)}
.dp small{font-size:12.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dp b{font:600 21px/1 var(--f-display)}
.dp.on{background:var(--sap);color:var(--on-sap);border-color:transparent;box-shadow:0 10px 22px -10px var(--sap)}
.dp.on small{color:var(--on-sap);opacity:.8}
.dp.today:not(.on) b{color:var(--sap)}
.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.pchips::-webkit-scrollbar{display:none}
.pc{height:40px;padding:0 15px;border-radius:20px;background:var(--glass-2);border:1px solid var(--line);font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--ink-2)}
.pc.on{background:var(--ink);color:var(--bg);border-color:transparent}

/* ---------- Panneau latéral ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:41;top:14px;right:14px;bottom:14px;width:470px;max-width:calc(100% - 28px);border-radius:var(--r-xl);display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass-2);-webkit-backdrop-filter:blur(34px) saturate(1.8);backdrop-filter:blur(34px) saturate(1.8);border:1px solid var(--glass-edge);box-shadow:var(--sh-3);
  transform:translateX(calc(100% + 40px));transition:transform .6s var(--spring)}
.sheet.on{transform:none}
.sh-h{padding:22px 22px 14px;display:flex;align-items:flex-start;gap:14px;position:relative}
.sh-h .tint{position:absolute;inset:0 0 auto;height:150px;background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--sap)) 20%,transparent),transparent);pointer-events:none}
.sh-h>*{position:relative}
.sh-h h3{font-size:26px;line-height:1.1;letter-spacing:-.03em}
.sh-h .sub{font-size:15px;color:var(--mut);margin-top:6px}
.sh-h .x{margin-left:auto}
.sh-b{flex:1;overflow:auto;padding:4px 22px 22px;display:flex;flex-direction:column;gap:18px}
.sh-b>*{flex-shrink:0}
.sh-f{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sh-f .btn{flex:1}
.grab{display:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{padding:12px;border-radius:16px;background:var(--glass-3);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.facts small{font-size:13px;color:var(--mut)}
.facts b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;background:var(--glass-3);border:1px solid var(--line)}
.gauge .ring{width:64px;height:64px}
.gauge .ring b{font-size:15px}
.gauge .tx b{display:block;font-weight:600;font-size:16px}
.gauge .tx small{display:block;color:var(--mut);font-size:14.5px}
.rl{display:flex;flex-direction:column}
