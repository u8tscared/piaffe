<title>Piaffe · Paddock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg-2:#f4f5f9; --surface:#ffffff; --surface-2:#f5f6fa; --surface-3:#eceef5;
  --line:#e8eaf1; --line-2:#d8dce7;
  --ink:#0a1636; --ink-2:#27314f; --mut:#5a637d; --mut-2:#8b92a8;
  --acc:#2448d8; --acc-2:#1834b0; --acc-bg:#e7ecff; --acc-ink:#1a3299; --on-acc:#ffffff;
  --navy:#0a1636; --on-navy:#ffffff; --strass:#6d8bff;
  --hz-bg:#dcf3e4; --hz-ink:#0d5532; --hz:#2aa86a;
  --rd-bg:#ece5ff; --rd-ink:#43249f; --rd:#8262f0;
  --mo-bg:#ffedcf; --mo-ink:#773f00; --mo:#ef9f2c;
  --tm-bg:#dbebff; --tm-ink:#0b448d; --tm:#3a86ef;
  --cr-bg:#ffe3de; --cr-ink:#972414; --cr:#ee5f48;
  --po-bg:#ffe2f0; --po-ink:#8a1a55; --po:#ec5ea2;
  --ex-bg:#e8f0d0; --ex-ink:#41520e; --ex:#8bb034;
  --hb-bg:#d3f1ee; --hb-ink:#0a5a56; --hb:#22ada2;
  --wk-bg:#eef0f5; --wk-ink:#4c556e; --wk:#9aa1b6;
  --coat:#c47d4b; --coat-2:#a5612f; --mane:#3a2418; --blaze:#fff4e6; --hay:#f3c75a; --hay-2:#d79c22; --twine:#b4562d;
  --sh-1:0 1px 2px rgba(10,22,54,.05),0 2px 10px -2px rgba(10,22,54,.06);
  --sh-2:0 2px 6px rgba(10,22,54,.06),0 18px 40px -12px rgba(10,22,54,.20);
  --sh-3:0 4px 12px rgba(10,22,54,.08),0 40px 90px -20px rgba(10,22,54,.35);
  --f-d:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-t:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1); --e-spring:cubic-bezier(.34,1.56,.64,1); --e-io:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e1c; --bg-2:#070a15; --surface:#111629; --surface-2:#171d34; --surface-3:#1e2541;
  --line:#232a46; --line-2:#2f3858;
  --ink:#eef1fb; --ink-2:#c9cfe4; --mut:#98a0bd; --mut-2:#6c7494;
  --acc:#7b93ff; --acc-2:#9aadff; --acc-bg:#1c2754; --acc-ink:#c4d0ff; --on-acc:#0a1636;
  --navy:#eef1fb; --on-navy:#0a1636; --strass:#a9bcff;
  --hz-bg:#12342a; --hz-ink:#a3eac3; --hz:#3cc787;
  --rd-bg:#2a2152; --rd-ink:#d3c6ff; --rd:#9b80ff;
  --mo-bg:#3a2a12; --mo-ink:#ffd59a; --mo:#f5ae45;
  --tm-bg:#132e52; --tm-ink:#b5d4ff; --tm:#5a9cf5;
  --cr-bg:#3d1c1d; --cr-ink:#ffbcb0; --cr:#ff7a63;
  --po-bg:#3b1a31; --po-ink:#ffbfe0; --po:#f477b4;
  --ex-bg:#28331a; --ex-ink:#d4e8a0; --ex:#a1c84a;
  --hb-bg:#0f3433; --hb-ink:#a6ece6; --hb:#35c3b7;
  --wk-bg:#1e2440; --wk-ink:#b6bdd6; --wk:#6f7898;
  --blaze:#f6e9d8;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 18px 40px -12px rgba(0,0,0,.6);
  --sh-3:0 40px 90px -20px rgba(0,0,0,.75);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e1c; --bg-2:#070a15; --surface:#111629; --surface-2:#171d34; --surface-3:#1e2541;
  --line:#232a46; --line-2:#2f3858;
  --ink:#eef1fb; --ink-2:#c9cfe4; --mut:#98a0bd; --mut-2:#6c7494;
  --acc:#7b93ff; --acc-2:#9aadff; --acc-bg:#1c2754; --acc-ink:#c4d0ff; --on-acc:#0a1636;
  --navy:#eef1fb; --on-navy:#0a1636; --strass:#a9bcff;
  --hz-bg:#12342a; --hz-ink:#a3eac3; --hz:#3cc787;
  --rd-bg:#2a2152; --rd-ink:#d3c6ff; --rd:#9b80ff;
  --mo-bg:#3a2a12; --mo-ink:#ffd59a; --mo:#f5ae45;
  --tm-bg:#132e52; --tm-ink:#b5d4ff; --tm:#5a9cf5;
  --cr-bg:#3d1c1d; --cr-ink:#ffbcb0; --cr:#ff7a63;
  --po-bg:#3b1a31; --po-ink:#ffbfe0; --po:#f477b4;
  --ex-bg:#28331a; --ex-ink:#d4e8a0; --ex:#a1c84a;
  --hb-bg:#0f3433; --hb-ink:#a6ece6; --hb:#35c3b7;
  --wk-bg:#1e2440; --wk-ink:#b6bdd6; --wk:#6f7898;
  --blaze:#f6e9d8;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 18px 40px -12px rgba(0,0,0,.6);
  --sh-3:0 40px 90px -20px rgba(0,0,0,.75);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font:400 16px/1.5 var(--f-t);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:18px;height:18px}
svg.ic.lg{width:24px;height:24px}
[hidden]{display:none!important}

/* ===== présentation (hors logiciel) ===== */
#pf{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.pres{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
.pres .brand{display:flex;align-items:center;gap:10px;font:800 20px/1 var(--f-d);letter-spacing:-.03em;color:var(--ink)}
.pres .dir{font-size:14px;color:var(--mut);font-weight:500;white-space:nowrap}
.pres .dir b{color:var(--ink);font-weight:600}
.pres .sp{flex:1}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);gap:2px;position:relative}
.seg button{height:36px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;color:var(--mut);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .knob{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--surface);box-shadow:var(--sh-1);transition:left .45s var(--e-spring),width .45s var(--e-spring)}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,transform .3s var(--e-spring)}
.ib:hover{background:var(--surface-2)}
.ib:active{transform:scale(.92)}

.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.device{width:100%;height:100%;position:relative}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);container:app/inline-size}
.island,.sbar,.homebar,.dbtn{display:none}
.stage.phone{background:radial-gradient(60% 50% at 20% 25%,var(--rd-bg),transparent 70%),radial-gradient(50% 45% at 82% 70%,var(--hz-bg),transparent 70%),radial-gradient(40% 40% at 70% 15%,var(--mo-bg),transparent 70%),var(--bg-2)}
.stage.phone .device{width:426px;height:898px;flex:none;padding:12px;border-radius:72px;background:#0b0d12;box-shadow:0 0 0 2px #2c313d,0 0 0 5px #11141b,var(--sh-3);transform:scale(var(--sc,1));transform-origin:center}
.stage.phone .screen{border-radius:60px;--st:54px;--sb:30px}
.stage.phone .island{display:block;position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60}
.stage.phone .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;align-items:center;justify-content:space-between;padding:4px 34px 0 46px;z-index:59;font:600 17px/1 var(--f-t);color:var(--ink);pointer-events:none}
.sbar .r{display:flex;gap:7px;align-items:center}
.stage.phone .homebar{display:block;position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:var(--ink);opacity:.85;z-index:60;pointer-events:none}
.stage.phone .dbtn{display:block;position:absolute;width:4px;border-radius:2px;background:#22262f}

/* ===== application ===== */
.app{position:relative;height:100%;display:grid;grid-template-columns:116px minmax(0,1fr);grid-template-rows:minmax(0,1fr);background:var(--bg);color:var(--ink)}
.rail{display:flex;flex-direction:column;gap:2px;padding:18px 10px 16px;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;background:var(--surface)}
.rail::-webkit-scrollbar{display:none}
.rail .logo{display:grid;place-items:center;height:52px;margin-bottom:8px;border-radius:18px;color:var(--navy)}
.rail .logo:hover svg{animation:nod .9s var(--e-spring)}
.ri{display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 0 7px;border-radius:18px;color:var(--mut);font:600 13.5px/1.15 var(--f-t);text-align:center;position:relative;transition:color .2s}
.ri .pl{width:60px;height:38px;border-radius:999px;display:grid;place-items:center;transition:background .25s,color .25s,transform .4s var(--e-spring)}
.ri:hover{color:var(--ink)}
.ri:hover .pl{background:var(--surface-2)}
.ri:active .pl{transform:scale(.9)}
.ri.on{color:var(--ink)}
.ri.on .pl{background:var(--c-bg,var(--acc-bg));color:var(--c-ink,var(--acc-ink))}
.ri.home.on .pl{background:var(--navy);color:var(--on-navy)}
.ri .bd{position:absolute;top:3px;left:calc(50% + 14px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--cr);color:#fff;font:700 12.5px/22px var(--f-t);border:2.5px solid var(--surface)}
.rail .sp{flex:1;min-height:12px}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 14px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-t);background:var(--a-bg,var(--acc-bg));color:var(--a-ink,var(--acc-ink));letter-spacing:.01em}
.av.lg{width:44px;height:44px;font-size:15px}
.av.sm{width:28px;height:28px;font-size:11.5px}
.av.xs{width:24px;height:24px;font-size:10.5px}

.mc{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{height:76px;flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,600px) minmax(0,1fr);align-items:center;gap:20px;padding:0 28px 0 32px}
.top .crumb{font:600 15px var(--f-t);color:var(--mut);display:flex;gap:8px;align-items:center;white-space:nowrap}
.top .crumb b{color:var(--ink)}
.cmdk{height:50px;width:100%;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;color:var(--mut);font-size:15.5px;transition:border-color .2s,box-shadow .3s,transform .3s var(--e-spring)}
.cmdk:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.cmdk:active{transform:scale(.985)}
.cmdk span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 13px/1 var(--f-t);padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--mut);box-shadow:0 1px 0 var(--line)}
.top .rt{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.now{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);font:600 14.5px var(--f-t);color:var(--ink-2);white-space:nowrap}
.now i{width:8px;height:8px;border-radius:50%;background:var(--hz);box-shadow:0 0 0 0 var(--hz);animation:pulse 2.4s infinite}
.dot-b{position:relative}
.dot-b::after{content:'';position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--cr);border:2px solid var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 32px 56px;scroll-behavior:smooth;overscroll-behavior:contain}
.page{max-width:1360px;margin:0 auto}

/* ===== en-têtes de page ===== */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:6px 0 22px;flex-wrap:wrap}
.eyebrow{font:600 15px var(--f-t);color:var(--mut);display:flex;align-items:center;gap:8px}
.ph h1{font:800 52px/1 var(--f-d);letter-spacing:-.035em;margin-top:6px}
.mhead{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:42px;padding:0 16px 0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font:600 15px var(--f-t);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .4s var(--e-spring)}
.chip:hover{border-color:var(--line-2)}
.chip:active{transform:scale(.94)}
.chip .dt{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mut-2))}
.chip[aria-pressed="true"]{background:var(--c-bg,var(--navy));color:var(--c-ink,var(--on-navy));border-color:transparent}
.chip[aria-pressed="true"] .dt{background:currentColor}
.chip.pop{animation:pop .45s var(--e-spring)}
.chip .av{width:26px;height:26px;font-size:11px}
.chip.noc{padding:0 16px}

.btn{height:44px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 15.5px var(--f-t);white-space:nowrap;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);transition:transform .35s var(--e-spring),background .2s,box-shadow .25s}
.btn:hover{box-shadow:var(--sh-1)}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.btn.pri:hover{background:var(--acc-2);box-shadow:0 8px 20px -8px var(--acc)}
.btn.dark{background:var(--navy);border-color:transparent;color:var(--on-navy)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14.5px}
.btn.tint{background:color-mix(in srgb,var(--t-ink,var(--ink)) 9%,transparent);border-color:transparent;color:var(--t-ink,var(--ink))}
.btn.tint:hover{background:color-mix(in srgb,var(--t-ink,var(--ink)) 15%,transparent);box-shadow:none}
.btn.done{background:var(--hz-bg);color:var(--hz-ink);border-color:transparent}

/* ===== bento ===== */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:152px;gap:16px;grid-auto-flow:dense}
.tile{grid-column:span var(--c);grid-row:span var(--r);border-radius:28px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;padding:22px 24px;display:flex;flex-direction:column;min-width:0;transition:opacity .45s,filter .45s,box-shadow .3s;will-change:transform}
.tile.pa{background:var(--t-bg);border-color:transparent;color:var(--t-ink)}
.tile.dim{opacity:.42;filter:saturate(.4)}
.tile.dim:hover{opacity:.8}
.th{display:flex;align-items:center;gap:10px;min-height:32px;margin-bottom:12px}
.th h3{font:700 19px/1.2 var(--f-d);letter-spacing:-.015em;flex:1;min-width:0}
.th .tic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--t-bg);color:var(--t-ink);flex:none}
.th .cnt-b{min-width:30px;height:30px;padding:0 10px;border-radius:15px;display:grid;place-items:center;font:700 14.5px var(--f-t);background:var(--t-bg);color:var(--t-ink)}
.lbl{font:600 15px/1.3 var(--f-t);opacity:.85}
.big{font:800 60px/1 var(--f-d);letter-spacing:-.045em;margin-top:auto;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.big small{font:700 24px var(--f-d);letter-spacing:-.02em;opacity:.7}
.sub{font:500 14.5px/1.35 var(--f-t);opacity:.8;margin-top:6px}
.kill{position:absolute;pointer-events:none}
.rise>*{animation:rise .7s var(--e-out) both;animation-delay:calc(var(--i,0) * 55ms)}

/* héros assistant */
.hero{background:linear-gradient(150deg,var(--acc-bg) 0%,color-mix(in srgb,var(--acc-bg) 35%,var(--surface)) 55%,var(--surface) 100%);border-color:color-mix(in srgb,var(--acc) 18%,var(--line))}
.hero .ast{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface);color:var(--acc-ink);font:600 14px var(--f-t);box-shadow:var(--sh-1);align-self:flex-start}
.hero .ast svg{color:var(--strass)}
.hero h2{font:800 31px/1.08 var(--f-d);letter-spacing:-.03em;margin:16px 0 0;max-width:60%;color:var(--ink)}
.hero .hz{position:absolute;right:-4px;top:-6px;width:216px;height:216px;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 96%);mask-image:linear-gradient(to bottom,#000 62%,transparent 96%)}
.pts{display:grid;gap:2px;margin-top:auto}
.pt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:8px 10px 8px 6px;border-radius:16px;font:400 15.5px/1.45 var(--f-t);color:var(--ink-2);transition:background .25s}
.pt b{color:var(--ink);font-weight:650}
.pt .pi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--t-bg);color:var(--t-ink)}
.pt.ok{color:var(--mut)}
.pt.ok .pi{background:var(--hz-bg);color:var(--hz-ink)}
.hero .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sparkle{position:absolute;color:var(--strass);pointer-events:none}
.sparkle svg{width:100%;height:100%;fill:currentColor}
.sparkle{animation:twinkle 3.2s ease-in-out infinite}

/* KPI */
.kpi .ill{position:absolute;right:-8px;top:-6px;width:118px;height:118px}
.kpi .lbl{max-width:62%}
.ring{--p:0;width:96px;height:96px;position:absolute;right:20px;top:20px}

/* reprises du jour */
.tl{display:flex;flex-direction:column;margin:0 -12px}
.tr{display:grid;grid-template-columns:58px 6px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:16px;text-align:left;width:100%;transition:background .2s,transform .35s var(--e-spring)}
.tr:hover{background:var(--surface-2)}
.tr:active{transform:scale(.985)}
.tr .tm{font:700 16px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.tr .tm small{display:block;font:500 13px var(--f-t);color:var(--mut);margin-top:3px}
.tr .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--d)}
.tr .tt{font:650 16px/1.25 var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tm2{font:400 14px/1.3 var(--f-t);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fillp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--d-bg);color:var(--d-ink);font:700 14px var(--f-t);font-variant-numeric:tabular-nums;white-space:nowrap}
.fillp.full::after{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.nowl{display:flex;align-items:center;gap:10px;margin:2px 12px;font:700 13px var(--f-t);color:var(--cr)}
.nowl::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--cr);animation:pulseC 2.2s infinite}
.nowl::after{content:'';flex:1;height:2px;background:var(--cr);border-radius:1px;opacity:.6}

/* écurie */
.live{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--hz-bg);color:var(--hz-ink);font:600 13.5px var(--f-t)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--hz);animation:pulse 2s infinite}
.est{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;margin-bottom:14px}
.est div{display:flex;flex-direction:column;gap:2px}
.est b{font:800 30px/1 var(--f-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.est span{font:500 12.5px/1.2 var(--f-t);color:var(--mut);display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.est span i{width:9px;height:9px;border-radius:3px;background:var(--k);flex:none}
.boxes{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:auto}
.bx{aspect-ratio:1;border-radius:8px;background:var(--k);position:relative;transition:transform .35s var(--e-spring);animation:bxin .5s var(--e-spring) both;animation-delay:calc(var(--i) * 12ms + 200ms)}
.bx:hover{transform:scale(1.25);z-index:2}
.bx.empty{background:transparent;border:2px dashed var(--line-2)}
.bx.soin::after{content:'';position:absolute;inset:30%;border-radius:50%;background:#fff;opacity:.9}

/* à traiter */
.todo{display:flex;flex-direction:column;gap:2px;margin:0 -10px}
.td{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border-radius:16px;text-align:left;width:100%;transition:background .2s,opacity .4s}
.td:hover{background:color-mix(in srgb,var(--cr) 10%,transparent)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--t-ink,var(--ink)) 35%,transparent);display:grid;place-items:center;color:transparent;transition:background .25s,border-color .25s,color .2s,transform .45s var(--e-spring)}
.ck svg{width:16px;height:16px;stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .05s var(--e-out)}
.on>.ck,.ck.on{background:var(--hz);border-color:var(--hz);color:#fff;transform:scale(1.08)}
.on>.ck svg,.ck.on svg{stroke-dashoffset:0}
.td .tx{font:600 15.5px/1.3 var(--f-t)}
.td .mt{font:400 14px/1.3 var(--f-t);opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td.on .tx{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.td.on .mt{opacity:.45}
.urg{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--cr);color:#fff;font:700 12px/20px var(--f-t);vertical-align:2px}

/* foin, météo, équipe */
.hayt{flex-direction:row;align-items:center;gap:18px;padding:18px 22px}
.hayt .hs{width:116px;height:96px;flex:none}
.hayt .big{font-size:48px;margin-top:4px}
.wx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:auto}
.wx div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;border-radius:12px;font:600 13px var(--f-t)}
.wx div.hl{background:color-mix(in srgb,var(--tm) 22%,transparent)}
.wx b{font:700 15px var(--f-t)}
.wx small{font:600 12px var(--f-t);opacity:.8}
.wxh{display:flex;align-items:center;gap:12px}
.wxh .big{font-size:40px;margin:0}
.team{display:flex;align-items:center;margin-top:auto}
.team .av{border:3px solid var(--surface);margin-left:-9px;width:40px;height:40px;font-size:13px;transition:transform .35s var(--e-spring)}
.team .av:first-child{margin-left:0}
.team .av:hover{transform:translateY(-4px)}

/* à valider */
.vl{display:flex;flex-direction:column;margin:0 -10px}
.vr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:16px}
.vr:hover{background:var(--surface-2)}
.vr .vi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--t-bg);color:var(--t-ink)}
.vr .tx{font:600 15.5px/1.25 var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr .mt{font:400 14px/1.3 var(--f-t);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty-ok{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:1;text-align:center;color:var(--mut);font:500 15px var(--f-t)}
.empty-ok svg{width:46px;height:46px;color:var(--hz)}

/* recettes */
.rev{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.rev .big{font-size:52px;margin:0}
.delta{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--hz-bg);color:var(--hz-ink);font:700 14px var(--f-t);margin-bottom:6px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;flex:1;min-height:0;margin-top:16px}
.bars>div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;position:relative}
.bars i{display:block;width:100%;max-width:40px;border-radius:10px 10px 6px 6px;background:color-mix(in srgb,var(--mo) 38%,transparent);height:var(--h);transform-origin:bottom;animation:grow .9s var(--e-out) both;animation-delay:calc(var(--i) * 40ms + 200ms);position:relative;transition:background .2s}
.bars>div:hover i{background:color-mix(in srgb,var(--mo) 65%,transparent)}
.bars>div.cur i{background:var(--mo)}
.bars i::after{content:'';position:absolute;left:-3px;right:-3px;bottom:var(--c);height:3px;border-radius:2px;background:var(--ink);opacity:.55}
.bars span{font:600 12.5px var(--f-t);color:var(--mut)}
.bars>div.cur span{color:var(--ink)}
.bars em{font-style:normal;position:absolute;bottom:calc(var(--h) + 30px);left:50%;transform:translate(-50%,6px);padding:5px 9px;border-radius:9px;background:var(--navy);color:var(--on-navy);font:700 13px var(--f-t);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--e-spring);z-index:3}
.bars>div:hover em{opacity:1;transform:translate(-50%,0)}
.lg{display:flex;gap:16px;font:500 13.5px var(--f-t);color:var(--mut);align-items:center}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--mo);margin-right:6px;vertical-align:-1px}
.lg i.c{height:3px;border-radius:2px;background:var(--ink);opacity:.55;vertical-align:3px}

/* ===== planning ===== */
.plh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wkn{display:flex;align-items:center;gap:4px}
.wkn .lab{font:700 22px/1 var(--f-d);letter-spacing:-.02em;padding:0 10px;white-space:nowrap}
.plh .sp{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.stt{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px 0 6px;border-radius:15px;background:var(--t-bg);color:var(--t-ink);font:500 14.5px var(--f-t)}
.stt b{font:800 21px/1 var(--f-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stt .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding:2px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.fbar::-webkit-scrollbar{display:none}
.fbar .sepv{width:1px;height:28px;background:var(--line-2);flex:none;margin:0 6px}
.cal{border:1px solid var(--line);border-radius:28px;background:var(--surface);position:relative;overflow:clip}
.calh{display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr));position:sticky;top:-4px;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.dh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px 12px;text-align:left;border-left:1px solid var(--line);transition:background .2s;min-width:0}
.dh:hover{background:var(--surface-2)}
.dh .dn{font:600 14px var(--f-t);color:var(--mut);text-transform:capitalize}
.dh .dd{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--f-d);letter-spacing:-.03em;height:34px}
.dh.today .dd b{background:var(--cr);color:#fff;border-radius:11px;padding:0 8px;height:34px;line-height:34px;margin-left:-2px}
.dh .dm{font:500 13px var(--f-t);color:var(--mut);white-space:nowrap}
.dh .fl{width:100%;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.dh .fl i{display:block;height:100%;border-radius:3px;background:var(--acc);width:var(--f);transform-origin:left;animation:growx .8s var(--e-out) both}
.arh{display:flex;align-items:center;gap:10px;padding:14px;border-left:1px solid var(--line);min-width:0}
.arh .ai{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.arh b{display:block;font:700 16px/1.2 var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arh span{font:500 13px var(--f-t);color:var(--mut)}
.calb{display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr));position:relative}
.hrs{position:relative}
.hrs span{position:absolute;right:10px;transform:translateY(-50%);font:600 13px var(--f-t);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);cursor:cell;touch-action:pan-y}
.col.today{background-color:color-mix(in srgb,var(--cr) 3.5%,transparent)}
.col.tgt{background-color:color-mix(in srgb,var(--acc) 7%,transparent)}
.col .lunch{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 70%,transparent) 8px 9px);pointer-events:none}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--cr);z-index:4;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--cr);animation:pulseC 2.2s infinite}
.nowtag{position:absolute;left:4px;transform:translateY(-50%);z-index:5;padding:3px 7px;border-radius:8px;background:var(--cr);color:#fff;font:700 12.5px/1.2 var(--f-t);pointer-events:none;font-variant-numeric:tabular-nums}

.ev{position:absolute;padding:3px 3px 0;cursor:grab;touch-action:none;z-index:2}
.ev .in{height:100%;border-radius:14px;background:var(--d-bg);color:var(--d-ink);padding:7px 10px 7px 13px;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:2px;transition:box-shadow .25s,transform .35s var(--e-spring);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--d) 22%,transparent)}
.ev .in::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(to top,var(--d) var(--f,100%),color-mix(in srgb,var(--d) 30%,transparent) var(--f,100%))}
.ev:hover .in{box-shadow:inset 0 0 0 1.5px var(--d),var(--sh-2);transform:translateY(-1px)}
.ev .t{font:700 14.5px/1.2 var(--f-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:baseline}
.ev .t em{font-style:normal;margin-left:auto;font:700 13px var(--f-t);font-variant-numeric:tabular-nums;opacity:.85;flex:none}
.ev .m{font:500 13px/1.3 var(--f-t);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ev .m .av{width:20px;height:20px;font-size:9.5px;background:var(--surface);color:var(--d-ink)}
.ev .hz{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;overflow:hidden;max-height:24px}
.ev .hz span{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 72%,transparent);font:600 12.5px var(--f-t);white-space:nowrap}
.ev .hz span svg{width:15px;height:15px}
.ev .fb{position:absolute;left:13px;right:10px;bottom:6px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--d) 22%,transparent);overflow:hidden}
.ev .fb i{display:block;height:100%;width:var(--f);background:var(--d);border-radius:2px}
.ev.past .in{opacity:.55;filter:saturate(.6)}
.ev.off{opacity:.12;pointer-events:none;filter:grayscale(1)}
.ev.work .in{background:repeating-linear-gradient(135deg,var(--wk-bg) 0 9px,color-mix(in srgb,var(--wk) 16%,var(--wk-bg)) 9px 18px)}
.ev.drag{z-index:30;cursor:grabbing;transition:none}
.ev.drag .in{box-shadow:inset 0 0 0 2px var(--d),0 24px 50px -12px rgba(10,22,54,.4);transform:rotate(-1.2deg) scale(1.03)}
.ev.bad .in{box-shadow:inset 0 0 0 2px var(--cr),0 0 0 4px color-mix(in srgb,var(--cr) 25%,transparent)}
.ev .tag{position:absolute;right:8px;top:-12px;padding:3px 9px;border-radius:9px;background:var(--navy);color:var(--on-navy);font:700 12.5px/1.3 var(--f-t);white-space:nowrap;z-index:3;box-shadow:var(--sh-2)}
.ev.new .in{animation:popin .6s var(--e-spring)}
.sel{position:absolute;left:4px;right:4px;border-radius:14px;background:color-mix(in srgb,var(--acc) 14%,transparent);border:2px dashed var(--acc);z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-start;padding:6px 10px;font:700 13.5px/1.3 var(--f-t);color:var(--acc-ink)}
.calf{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line);font:500 14.5px var(--f-t);color:var(--mut)}
.hpop{position:absolute;z-index:80;width:320px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-3);pointer-events:none;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .3s var(--e-spring)}
.hpop.on{opacity:1;transform:none}
.hpop h4{font:700 18px/1.2 var(--f-d);margin:0 0 4px;letter-spacing:-.01em}
.hpop .pm{font:500 14px var(--f-t);color:var(--mut)}
.hpop .hl{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.hc{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 5px;border-radius:999px;background:var(--hz-bg);color:var(--hz-ink);font:600 13.5px var(--f-t);white-space:nowrap}
.hc svg{width:18px;height:18px}
.hc.warn{background:var(--mo-bg);color:var(--mo-ink)}
.mbar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;background:var(--d,var(--acc));width:var(--f)}

/* agenda mobile */
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.ds{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:16px;background:var(--surface-2);font:600 13px var(--f-t);color:var(--mut);transition:background .25s,color .25s,transform .4s var(--e-spring)}
.ds b{font:800 20px/1 var(--f-d);color:var(--ink)}
.ds i{width:6px;height:6px;border-radius:50%;background:var(--acc);opacity:.7}
.ds[aria-pressed="true"]{background:var(--navy);color:color-mix(in srgb,var(--on-navy) 75%,transparent)}
.ds[aria-pressed="true"] b{color:var(--on-navy)}
.ds[aria-pressed="true"] i{background:var(--on-navy)}
.ds.today:not([aria-pressed="true"]) b{color:var(--cr)}
.ds:active{transform:scale(.92)}
.ag{display:flex;flex-direction:column;gap:18px}
.agd h3{font:700 20px var(--f-d);display:flex;align-items:baseline;gap:8px;margin:0 0 8px;text-transform:capitalize}
.agd h3 small{font:500 14px var(--f-t);color:var(--mut);text-transform:none}
.agc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;border-radius:20px;background:var(--d-bg);color:var(--d-ink);text-align:left;width:100%;margin-bottom:8px;position:relative;overflow:hidden;transition:transform .35s var(--e-spring)}
.agc:active{transform:scale(.97)}
.agc .tm{font:800 17px/1.05 var(--f-d)}
.agc .tm small{display:block;font:500 13px var(--f-t);opacity:.8;margin-top:3px}
.agc .tt{font:700 16px/1.2 var(--f-t)}
.agc .mm{font:500 14px/1.3 var(--f-t);opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc.past{opacity:.55}
.agc .fillp{background:color-mix(in srgb,var(--surface) 70%,transparent)}

/* ===== feuilles, palette, toasts ===== */
.scrim{position:absolute;inset:0;background:rgba(10,22,54,.28);z-index:90;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:absolute;top:12px;right:12px;bottom:12px;width:480px;max-width:calc(100% - 24px);z-index:91;background:var(--surface);border-radius:28px;box-shadow:var(--sh-3);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 24px));transition:transform .5s var(--e-out)}
.sheet.on{transform:none}
.shh{flex:none;padding:22px 24px 18px;position:relative;overflow:hidden;background:var(--s-bg,var(--surface));color:var(--s-ink,var(--ink))}
.shh .x{position:absolute;top:14px;right:14px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.shh h2{font:800 30px/1.08 var(--f-d);letter-spacing:-.03em;margin:6px 48px 0 0}
.shh .k{font:600 14.5px var(--f-t);opacity:.85;display:flex;align-items:center;gap:8px}
.shh .meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font:500 15px var(--f-t)}
.shh .meta span{display:inline-flex;align-items:center;gap:7px}
.shb{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.shf{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-bottom:calc(18px + var(--sb,0px))}
.grab{display:none}
.sec h4{font:700 16px var(--f-d);margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.sec h4 small{font:500 14px var(--f-t);color:var(--mut);margin-left:auto}
.rl{display:flex;flex-direction:column;gap:2px}
.rr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px 8px 6px;border-radius:14px;text-align:left;width:100%;transition:background .2s}
.rr:hover{background:var(--surface-2)}
.rr .nm{font:600 15.5px/1.25 var(--f-t)}
.rr .nm small{display:block;font:400 13.5px var(--f-t);color:var(--mut)}
.fg{display:flex;flex-direction:column;gap:8px}
.fg>label,.fg>span{font:600 14.5px var(--f-t);color:var(--ink-2)}
.inp{height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font:500 16px var(--f-t);width:100%;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts .chip{height:40px}
.opts .chip[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.step{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:14px;padding:3px}
.step button{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.step button:hover{background:var(--surface-2)}
.step b{min-width:40px;text-align:center;font:800 22px var(--f-d)}
.tg{width:52px;height:32px;border-radius:16px;background:var(--line-2);position:relative;transition:background .25s;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .4s var(--e-spring)}
.tg[aria-pressed="true"]{background:var(--hz)}
.tg[aria-pressed="true"]::after{transform:translateX(20px)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.note{padding:14px 16px;border-radius:16px;background:var(--surface-2);font:500 14.5px/1.45 var(--f-t);color:var(--ink-2);display:flex;gap:10px}
.note.w{background:var(--mo-bg);color:var(--mo-ink)}

.pal{position:absolute;left:50%;top:84px;width:640px;max-width:calc(100% - 24px);z-index:95;background:var(--surface);border-radius:26px;box-shadow:var(--sh-3);border:1px solid var(--line);overflow:hidden;transform:translate(-50%,-8px) scale(.97);opacity:0;transition:transform .4s var(--e-spring),opacity .2s}
.pal.on{transform:translate(-50%,0);opacity:1}

/* ---------- FLIP ---------- */
function flipFirst(root){var m={};$$('[data-flip]',root).forEach(function(e){m[e.getAttribute('data-flip')]=e.getBoundingClientRect()});return m}
function flipPlay(root,m,o){if(RM)return;o=o||{};$$('[data-flip]',root).forEach(function(e){var k=e.getAttribute('data-flip'),a=m[k],b=e.getBoundingClientRect();
  if(!a){if(o.enter!==false)e.animate([{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],{duration:520,easing:'cubic-bezier(.34,1.56,.64,1)',delay:o.delay||0,fill:'backwards'});return}
  var dx=(a.left-b.left)/SC,dy=(a.top-b.top)/SC,sx=a.width/(b.width||1),sy=a.height/(b.height||1);
  if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(sx-1)<.01&&Math.abs(sy-1)<.01)return;
  var tf=o.noScale?'translate('+dx+'px,'+dy+'px)':'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';
  e.animate([{transformOrigin:'0 0',transform:tf},{transformOrigin:'0 0',transform:'none'}],{duration:o.dur||620,easing:'cubic-bezier(.2,.9,.25,1.05)'})})}

  if(id){var h=HZ[id];t.innerHTML=esc(h.name)+'<small>Box '+h.box+' · '+W[h.w]+(h.al?' · '+esc(h.al):'')+'</small>'}else t.innerHTML='Box '+box+'<small>Libre, réservable pour une pension</small>';fr(t);
  var ar=app.getBoundingClientRect(),r=el.getBoundingClientRect();t.style.left=((r.left+r.width/2-ar.left)/SC)+'px';t.style.top=((r.top-ar.top)/SC)+'px';t.classList.add('on');
  var tr=t.getBoundingClientRect();if(tr.left<ar.left+8)t.style.left=(parseFloat(t.style.left)+(ar.left+8-tr.left)/SC)+'px';else if(tr.right>ar.right-8)t.style.left=(parseFloat(t.style.left)-(tr.right-ar.right+8)/SC)+'px'}

  else if(a==='focus'){var f=b.getAttribute('data-f');if(f===S.focus&&f!=='all')f='all';S.focus=f;render('flip');var nb=$('[data-act="focus"][data-f="'+f+'"]',scroll);if(nb&&!RM)nb.classList.add('pop')}
  else if(a==='hero-dr')moveDressage();
  else if(a==='hero-rel')sendReminders();
  else if(a==='ev')openEv(b.getAttribute('data-id'));
  else if(a==='todo'){var id=b.getAttribute('data-id');S.todo[id]=!S.todo[id];b.classList.toggle('on',S.todo[id]);b.setAttribute('aria-pressed',!!S.todo[id]);var t=TODO.filter(function(x){return x.id===id})[0];
    setTimeout(function(){render('flip')},RM?0:420);
    if(S.todo[id])toast('Fait : '+t.tx.charAt(0).toLowerCase()+t.tx.slice(1)+'.',{undo:function(){S.todo[id]=false;render('flip')}});
    if(TODO.every(function(x){return S.todo[x.id]}))setTimeout(function(){toast('Tout est traité pour ce matin. Bravo.')},700)}
  else if(a==='valid'){var id2=b.getAttribute('data-id'),v=VALID.filter(function(x){return x.id===id2})[0];S.val[id2]=1;render('flip');toast(v.b==='Valider'?v.tx.split(',')[0].replace(' arrive en pension','')+' validé. Sa fiche et son box sont prêts.':'Relance envoyée pour : '+v.tx.charAt(0).toLowerCase()+v.tx.slice(1)+'.',{undo:function(){delete S.val[id2];render('flip')}})}
  else if(a==='view'){var v2=b.getAttribute('data-v');if(v2===S.pv)return;S.pv=v2;render(S.m?'keep':'flip')}
  else if(a==='day'){S.pd=+b.getAttribute('data-d');S.pv='day';render('flip')}
  else if(a==='pd'){S.pd=+b.getAttribute('data-d');render(S.m?'keep':'flip')}
  else if(a==='prev'||a==='next'){var dir=a==='next'?1:-1;if(S.pv==='day'){S.pd+=dir;if(S.pd>6){S.pd=0;S.wk++}if(S.pd<0){S.pd=6;S.wk--}}else S.wk+=dir;slide(dir)}
  else if(a==='tod'){S.wk=0;S.pd=1;render('keep')}
  else if(a==='fd'){var k=b.getAttribute('data-k');if(S.fd[k])delete S.fd[k];else S.fd[k]=1;softFilter();b.setAttribute('aria-pressed',!!S.fd[k]);if(!RM)b.classList.remove('pop'),void b.offsetWidth,b.classList.add('pop')}
  else if(a==='fc'){var k2=b.getAttribute('data-k');if(S.fc[k2])delete S.fc[k2];else S.fc[k2]=1;softFilter();b.setAttribute('aria-pressed',!!S.fc[k2]);if(!RM)b.classList.remove('pop'),void b.offsetWidth,b.classList.add('pop')}
  else if(a==='new'){createSheet({d:S.pv==='day'?S.pd:2,s:14*60,dur:60})}
}
function softFilter(){if(S.m&&S.pv==='week'){render('flip');return}$$('.ev',scroll).forEach(function(el){var ev=EV.filter(function(x){return x.id===el.getAttribute('data-ev')})[0];el.classList.toggle('off',!visible(ev))})}

/* ---------- appareil : ordinateur / téléphone ---------- */
function setMode(m){var stage=$('.stage');function apply(){S.mode=m;stage.classList.toggle('phone',m==='phone');$$('.pres .seg [data-mode]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-mode')===m)});placeKnob($('.pres .seg'));fit();check(true)}
  closeSheet(true);if(document.startViewTransition&&!RM)document.startViewTransition(apply);else apply()}
function fit(){var stage=$('.stage');if(S.mode!=='phone'){SC=1;return}var W=stage.clientWidth-24,H=stage.clientHeight-28;SC=Math.min(1,W/426,H/898);$('.device').style.setProperty('--sc',SC)}
function check(force){var m=app.clientWidth<820;if(m!==S.m||force){var ch=m!==S.m;S.m=m;if(m&&ch&&S.page==='planning'&&S.pv==='week')S.pv='day';if(ch||force)render(force?'':'keep')}}

/* ---------- démarrage ---------- */
function boot(){var root=$('#pf');app=$('#app');
  $('.sbar .t').textContent='9:41';
  shell();navState();fr(root);fit();S.m=app.clientWidth<820;render('page');
  app.addEventListener('click',onClick);
  $('.pres').addEventListener('click',function(e){var b=e.target.closest('[data-mode]');if(b)setMode(b.getAttribute('data-mode'));if(e.target.closest('#thb'))setTheme(isDark()?'light':'dark')});
  placeKnob($('.pres .seg'));setTheme(S.theme);
  app.addEventListener('mouseover',function(e){var t=e.target.closest('[data-box]');if(t)showTip(t)});
  app.addEventListener('mouseout',function(e){if(e.target.closest('[data-box]'))hideTip()});
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}else if(e.key==='Escape'&&curSheet)closeSheet()});
  if(window.ResizeObserver)new ResizeObserver(function(){fit();check()}).observe(app);
  window.addEventListener('resize',function(){fit();check()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){$$('.seg').forEach(placeKnob)})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
