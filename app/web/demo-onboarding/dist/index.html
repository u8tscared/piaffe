/* =====================================================================
   PIAFFE · Design system « Paddock »
   Fond blanc, encre marine, saphir pour l'action, pastels profonds par
   domaine (chevaux, cavaliers, argent, équipe, soins), grandes cibles.
   Titres et grands chiffres : Bricolage Grotesque 800. Texte : Inter.
   ===================================================================== */
:root{
  /* surfaces et encres */
  --bg:#ffffff; --bg-2:#f2f4f8; --surface:#ffffff; --surface-2:#f5f6fa; --surface-3:#eceef5; --raise:#ffffff;
  --line:#e6e9f0; --line-2:#d6dbe6;
  --ink:#0a1636; --ink-2:#27314f; --mut:#59627c; --mut-2:#868da4;
  /* action */
  --acc:#2448d8; --acc-2:#1834b0; --acc-pale:#e7ecff; --acc-bg:#e7ecff; --acc-deep:#1a3299; --acc-ink:#ffffff; --on-acc:#ffffff; --acc-line:#c2cdfb;
  --navy:#0a1636; --navy-ink:#ffffff; --on-navy:#ffffff; --strass:#6d8bff; --hero:#0a1636; --hero-ink:#ffffff;
  /* états */
  --ok:#11864f; --ok-pale:#dcf3e4; --ok-line:#a9e2c0; --warn:#a85d00; --warn-pale:#ffedcf; --bad:#cc3a24; --bad-pale:#ffe3de; --info:#2448d8; --info-pale:#e7ecff;
  /* domaines : fond pastel, encre profonde, couleur pleine */
  --hz-bg:#dcf3e4; --hz-ink:#0d5532; --hz:#2aa86a;
  --rd-bg:#ece5ff; --rd-ink:#43249f; --rd:#8262f0;
  --mo-bg:#ffedcf; --mo-ink:#773f00; --mo:#ef9f2c;
  --tm-bg:#dbebff; --tm-ink:#0b448d; --tm:#3a86ef;
  --cr-bg:#ffe3de; --cr-ink:#972414; --cr:#ee5f48;
  --pf-bg:#eef0f5; --pf-ink:#3d4660; --pf:#8d95ad;
  --dom-chevaux:var(--hz); --dom-chevaux-bg:var(--hz-bg); --dom-chevaux-ink:var(--hz-ink);
  --dom-cavaliers:var(--rd); --dom-cavaliers-bg:var(--rd-bg); --dom-cavaliers-ink:var(--rd-ink);
  --dom-argent:var(--mo); --dom-argent-bg:var(--mo-bg); --dom-argent-ink:var(--mo-ink);
  --dom-equipe:var(--tm); --dom-equipe-bg:var(--tm-bg); --dom-equipe-ink:var(--tm-ink);
  --dom-soins:var(--cr); --dom-soins-bg:var(--cr-bg); --dom-soins-ink:var(--cr-ink);
  --dom-plateforme:var(--pf); --dom-plateforme-bg:var(--pf-bg); --dom-plateforme-ink:var(--pf-ink);
  /* disciplines */
  --po-bg:#ffe2f0; --po-ink:#8a1a55; --po:#ec5ea2;
  --ex-bg:#e8f0d0; --ex-ink:#41520e; --ex:#8bb034;
  --hb-bg:#d3f1ee; --hb-ink:#0a5a56; --hb:#22ada2;
  --wk-bg:#eef0f5; --wk-ink:#4c556e; --wk:#9aa1b6;
  --disc-init:var(--hz); --disc-perf:var(--tm); --disc-cso:var(--mo); --disc-dressage:var(--rd); --disc-poney:var(--po); --disc-exterieur:var(--ex); --disc-horseball:var(--hb); --disc-travail:var(--wk);
  /* graphiques */
  --c1:#2448d8; --c2:#0a1636; --c3:#22ada2; --c4:#ef9f2c; --c5:#8262f0; --c6:#ec5ea2; --c7:#2aa86a;
  /* illustrations */
  --coat:#c47d4b; --coat-2:#a5612f; --mane:#3a2418; --blaze:#fff4e6; --hay:#f3c75a; --hay-2:#d79c22; --twine:#b4562d; --steel:#9aa4bb; --steel-2:#6b7590; --leather:#8a4b2a; --leather-2:#5e2f18;
  /* ombres */
  --shadow-1:0 1px 2px rgba(10,22,54,.05),0 2px 10px -2px rgba(10,22,54,.06);
  --shadow-2:0 2px 6px rgba(10,22,54,.06),0 18px 40px -12px rgba(10,22,54,.20);
  --shadow-3:0 4px 12px rgba(10,22,54,.08),0 40px 90px -20px rgba(10,22,54,.35);
  --ring:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent);
  /* typographie */
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-text:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  /* rayons */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:28px; --r-pill:999px;
  /* mouvement */
  --e-out:cubic-bezier(.16,1,.3,1); --e-in-out:cubic-bezier(.65,0,.35,1); --e-spring:cubic-bezier(.34,1.56,.64,1);
  --t-1:120ms; --t-2:220ms; --t-3:360ms; --t-4:560ms;
  --sidebar:240px;
  color-scheme:light;
}

  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 18px 40px -12px rgba(0,0,0,.6); --shadow-3:0 40px 90px -20px rgba(0,0,0,.75);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e1c; --bg-2:#151a30; --surface:#111629; --surface-2:#171d34; --surface-3:#1e2541; --raise:#161c33;

  --navy:#eef1fb; --navy-ink:#0a1636; --on-navy:#0a1636; --strass:#a9bcff; --hero:#1a2350; --hero-ink:#ffffff;

  --mo-bg:#3a2a12; --mo-ink:#ffd59a; --mo:#f5ae45;

  --cr-bg:#3d1c1d; --cr-ink:#ffbcb0; --cr:#ff7a63;

  --po-bg:#3b1a31; --po-ink:#ffbfe0; --po:#f477b4;

/* ---------- Domaines : une classe pose --d, --d-bg, --d-ink ---------- */
.d-chevaux,.d-hz{--d:var(--hz);--d-bg:var(--hz-bg);--d-ink:var(--hz-ink)}
.d-cavaliers,.d-rd{--d:var(--rd);--d-bg:var(--rd-bg);--d-ink:var(--rd-ink)}
.d-argent,.d-mo{--d:var(--mo);--d-bg:var(--mo-bg);--d-ink:var(--mo-ink)}
.d-equipe,.d-tm{--d:var(--tm);--d-bg:var(--tm-bg);--d-ink:var(--tm-ink)}
.d-soins,.d-cr{--d:var(--cr);--d-bg:var(--cr-bg);--d-ink:var(--cr-ink)}
.d-plateforme,.d-pf{--d:var(--pf);--d-bg:var(--pf-bg);--d-ink:var(--pf-ink)}
.d-acc{--d:var(--acc);--d-bg:var(--acc-bg);--d-ink:var(--acc-deep)}
.d-poney,.d-po{--d:var(--po);--d-bg:var(--po-bg);--d-ink:var(--po-ink)}
.d-exterieur,.d-ex{--d:var(--ex);--d-bg:var(--ex-bg);--d-ink:var(--ex-ink)}
.d-horseball,.d-hb{--d:var(--hb);--d-bg:var(--hb-bg);--d-ink:var(--hb-ink)}
.d-travail,.d-wk{--d:var(--wk);--d-bg:var(--wk-bg);--d-ink:var(--wk-ink)}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-text);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:10px}
::selection{background:var(--acc-pale);color:var(--ink)}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance;font-weight:700;color:inherit}
p{margin:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i .f{fill:currentColor;stroke:none}
svg.i .a{stroke:var(--acc)} svg.i .af{fill:var(--strass);stroke:none}
.sm svg.i,svg.i.sm{width:19px;height:19px}
svg.i.lg{width:26px;height:26px}
svg.i.xl{width:32px;height:32px;stroke-width:1.7}

/* ---------- Mise en page ---------- */
.stack{display:flex;flex-direction:column;gap:var(--g,14px);min-width:0}
.hrow{display:flex;align-items:center;gap:var(--g,10px);min-width:0}
.hrow.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.g2,.g3,.g4,.g5{display:grid;gap:var(--g,16px);min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
@container main (max-width:1080px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (max-width:760px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}.hide-s{display:none!important}.g2,.g3,.g4,.g5{gap:var(--g,12px)}}
@container main (max-width:520px){.g3,.g4{grid-template-columns:minmax(0,1fr)}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (min-width:761px){.only-s{display:none!important}}
.mut{color:var(--mut)} .mut2{color:var(--mut-2)} .acc{color:var(--acc)} .okc{color:var(--ok)} .badc{color:var(--bad)} .warnc{color:var(--warn)}
.xs{font-size:13px}.s{font-size:14px}.m{font-size:15px}.l{font-size:17px}
.b{font-weight:600}.bb{font-weight:700}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.disp{font-family:var(--f-display);letter-spacing:-.03em}
.big{font:800 44px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13.5px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* écrans du gérant revus : un texte de liste passe sur deux lignes au lieu d'être coupé */
.page:is([data-screen="cockpit"],[data-screen="planning"],[data-screen="rapports"],[data-screen="adherents"],[data-screen="adherent"],[data-screen="pensions"],[data-screen="contrats"],[data-screen="boutique"],[data-screen="facturation"],[data-screen="compta"],[data-screen="equipe"]) :is(div,b,span.grow>span,span>b,div>span).ellip{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:break-word}
.hr{height:1px;background:var(--line);border:0;margin:6px 0}

/* ---------- En-tête de page ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:4px 0 26px}
.ph h1{font:800 44px/1.02 var(--f-display);letter-spacing:-.035em}
.ph .sub{color:var(--mut);margin-top:10px;font-size:16px;line-height:1.45}
.ph .acts{display:flex;gap:10px;flex-wrap:wrap}
@container main (max-width:760px){.ph h1{font-size:34px}}
@container main (max-width:520px){.ph h1{font-size:30px}.ph{margin-bottom:18px}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 16px;border-radius:14px;font:600 15px/1 var(--f-text);background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .35s var(--e-spring),background var(--t-2),box-shadow var(--t-2),color var(--t-2);white-space:nowrap;user-select:none;text-decoration:none}
.btn:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-1)}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--on-acc);box-shadow:none}
.btn.pri:hover{background:var(--acc-2);box-shadow:0 10px 22px -10px var(--acc)}
.btn.dark{background:var(--navy);color:var(--navy-ink);box-shadow:none}
.btn.dark:hover{background:color-mix(in srgb,var(--navy) 88%,var(--acc));box-shadow:var(--shadow-2)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none}
.btn.tint{background:var(--d-bg,var(--acc-bg));color:var(--d-ink,var(--acc-deep));box-shadow:none}
.btn.tint:hover{background:color-mix(in srgb,var(--d-bg,var(--acc-bg)) 80%,var(--d,var(--acc)))}
.btn.danger{color:var(--bad)}
.btn.sm{height:38px;padding:0 11px;font-size:14px;border-radius:12px;gap:6px}
.btn.sm svg.i{width:18px;height:18px}
.btn.lg{height:54px;padding:0 24px;font-size:16.5px;border-radius:16px}
.btn.icon{width:44px;padding:0}.btn.icon.sm{width:38px}.btn.icon.lg{width:54px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.kbd,kbd{font:600 12.5px/1 var(--f-text);padding:5px 7px;border-radius:8px;background:var(--surface);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--line);white-space:nowrap}

/* ---------- Pastilles ---------- */
.chip{display:inline-block;height:28px;padding:0 11px;border-radius:var(--r-pill);font:600 13px/28px var(--f-text);background:var(--bg-2);color:var(--ink-2);white-space:nowrap;vertical-align:middle;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9;display:var(--dot,none);margin-right:6px;vertical-align:1px}
.chip.dot{--dot:inline-block}
.chip svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.chip .strass{vertical-align:-1px;margin-right:5px}
.chip.ok{background:var(--ok-pale);color:var(--ok)} .chip.warn{background:var(--warn-pale);color:var(--warn)} .chip.bad{background:var(--bad-pale);color:var(--bad)}
.chip.acc{background:var(--acc-pale);color:var(--acc-deep)} .chip.navy{background:var(--navy);color:var(--navy-ink)} .chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--mut)}
.chip.d{background:var(--d-bg);color:var(--d-ink)}
.chip.lg{height:34px;line-height:34px;padding:0 14px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-pill);font:600 14.5px/1 var(--f-text);color:var(--ink-2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;white-space:nowrap;transition:background var(--t-2),color var(--t-2),box-shadow var(--t-2),transform .4s var(--e-spring)}
.tag:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.tag:active{transform:scale(.94)}
.tag[aria-pressed="true"]{background:var(--d-bg,var(--navy));color:var(--d-ink,var(--navy-ink));box-shadow:none}

/* ---------- Cartes ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);min-width:0;position:relative}
.card.pad{padding:22px}
.card.flat{box-shadow:inset 0 0 0 1px var(--line)}
.card.soft{background:var(--surface-2);box-shadow:none}
.card.tint{background:var(--d-bg,var(--acc-bg));color:var(--d-ink,var(--acc-deep));box-shadow:none}
.card.tint .mut{color:color-mix(in srgb,currentColor 72%,transparent)}
.card.lift{box-shadow:inset 0 0 0 1px var(--line),var(--shadow-1)}
.card.navy{--navy:var(--hero);--navy-ink:var(--hero-ink);--strass:#a9bcff;background:var(--navy);color:var(--navy-ink);box-shadow:var(--shadow-2)}
.card.navy .mut{color:color-mix(in srgb,var(--navy-ink) 66%,transparent)}
.card.hover{transition:transform .4s var(--e-spring),box-shadow var(--t-2);cursor:pointer}
.card.hover:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-2)}
.card.hover:active{transform:scale(.985)}
.ch{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;padding:20px 22px 0;min-height:52px}
.ch h3{font:700 19px/1.2 var(--f-display);letter-spacing:-.015em}
.ch .mut{font-size:14px}
.cb{padding:16px 22px 22px}
.cf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ico{width:40px;height:40px;border-radius:13px;display:inline-grid;place-items:center;flex:none;background:var(--d-bg,var(--acc-bg));color:var(--d-ink,var(--acc-deep))}
.ico.sm{width:32px;height:32px;border-radius:10px}.ico.sm svg.i{width:18px;height:18px}
.ico.lg{width:52px;height:52px;border-radius:16px}
@container main (max-width:520px){.ch{padding:18px 18px 0}.cb{padding:14px 18px 18px}.cf{padding:12px 18px}.card.pad{padding:18px}}

/* ---------- Indicateurs ---------- */
.kpi{padding:20px 22px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.kpi .lab{font:600 14.5px/1.3 var(--f-text);color:var(--mut);display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.kpi .lab svg.i{color:var(--d-ink,var(--acc))}
.kpi .val{font:800 40px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:4px;position:relative;z-index:1}
.kpi .val small{font:700 19px var(--f-display);color:var(--mut);letter-spacing:-.01em;margin-left:4px}
.kpi .del{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.kpi .del svg.i{width:17px;height:17px}
.kpi .del.up{color:var(--ok)} .kpi .del.down{color:var(--bad)}
.kpi svg.spark{width:100%;height:42px;margin-top:4px}
.kpi.tint .lab,.kpi.tint .val small{color:inherit;opacity:.8}
.kpi .illu{position:absolute;right:-6px;top:-6px;width:96px;height:96px;pointer-events:none}
.kpi.has-illu .lab{padding-right:70px}
.delta{font-size:14px;font-weight:600}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
@container main (max-width:520px){.kpi{padding:18px}.kpi .val{font-size:34px}.kpi .illu{width:72px;height:72px}}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 22px;min-height:60px;min-width:0;transition:background var(--t-1);position:relative}
.li+.li::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:var(--line)}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface-2)}
/* retour de clic : la ligne ou la carte cliquable s'enfonce légèrement */
.li.click:active,.tbl tbody tr.click:active{background:var(--surface-3);transition-duration:60ms}
button.card,a.card,.card[data-go]{transition:transform .35s var(--e-spring),box-shadow var(--t-2),background var(--t-2)}
button.card:active,a.card:active,.card[data-go]:active{transform:scale(.985);transition-duration:.1s}
.li .t{font-weight:600;font-size:15px}.li .s{font-size:14px;color:var(--mut)}
.li .r{margin-left:auto;text-align:right;flex:none;display:flex;align-items:center;gap:10px}
@container main (max-width:520px){.li{padding:12px 18px}.li+.li::before{left:18px;right:18px}}

/* ---------- Avatars ---------- */
.av{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font:700 13.5px/1 var(--f-text);letter-spacing:.01em;flex:none;color:#fff;background:var(--c,var(--acc));overflow:hidden;position:relative}
.av.sm{width:32px;height:32px;font-size:13px}.av.lg{width:48px;height:48px;font-size:16px}.av.xl{width:68px;height:68px;font-size:22px}
.av.sq{border-radius:13px}.av.sq.sm{border-radius:10px}.av.sq.lg{border-radius:16px}
.av svg.i{width:20px;height:20px}.av.sm svg.i{width:17px;height:17px}.av.lg svg.i{width:24px;height:24px}
.av.horse{background:color-mix(in srgb,var(--c,var(--coat)) 16%,var(--surface));box-shadow:none;color:var(--c,var(--ink))}
.av.horse svg{width:64%;height:64%}
.avs{display:flex}.avs .av{box-shadow:0 0 0 2.5px var(--surface)}.avs .av+.av{margin-left:-5px}

/* ---------- Tableaux ---------- */
.tw{overflow:auto;min-width:0;border-radius:var(--r-lg)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font:600 13px/1.2 var(--f-text);letter-spacing:.03em;text-transform:uppercase;color:var(--mut);padding:16px 16px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 16px;height:58px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:22px}.tbl th:last-child,.tbl td:last-child{padding-right:22px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--t-1)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Formulaires ---------- */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>span,.field>label{font-size:14.5px;font-weight:600;color:var(--ink-2)}
.in{height:46px;padding:0 14px;border-radius:14px;background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line-2);outline:none;transition:box-shadow var(--t-2);width:100%;min-width:0;font-size:15.5px;color:var(--ink)}
.in::placeholder{color:var(--mut-2)}
textarea.in{height:auto;padding:12px 14px;resize:vertical;min-height:96px;line-height:1.5}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--acc),var(--ring)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 13px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.search{position:relative;min-width:0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .in{padding-left:44px}
.tog{width:52px;height:32px;border-radius:16px;background:var(--line-2);position:relative;flex:none;transition:background var(--t-2) var(--e-out);cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(10,22,54,.3);transition:transform .4s var(--e-spring)}
.tog[aria-checked="true"]{background:var(--acc)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
.chk{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 1.8px var(--line-2);display:inline-grid;place-items:center;flex:none;cursor:pointer;transition:all var(--t-2) var(--e-out);background:var(--surface);position:relative}
.chk::after{content:"";position:absolute;inset:-9px}
.chk svg{width:15px;height:15px;stroke:var(--on-acc);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset var(--t-3) var(--e-out)}
.chk[aria-checked="true"]{background:var(--acc);box-shadow:none}
.chk[aria-checked="true"] svg{stroke-dashoffset:0}

/* ---------- Segments et onglets ---------- */
.seg{display:inline-flex;padding:4px;border-radius:15px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);gap:2px;position:relative;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 14px;border-radius:11px;font:600 14.5px/1 var(--f-text);color:var(--mut);transition:color var(--t-2),background var(--t-2),box-shadow var(--t-2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.seg button svg.i{width:19px;height:19px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.tabs a{min-height:46px;padding:0 14px;font:600 15px/1 var(--f-text);color:var(--mut);position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:color var(--t-2)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc);animation:tabin .4s var(--e-out)}
@keyframes tabin{from{transform:scaleX(.3);opacity:0}}

/* ---------- Progression ---------- */
.bar{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--acc));width:var(--v,0%);transition:width var(--t-4) var(--e-out);animation:growx .9s var(--e-out) both;transform-origin:left}
@keyframes growx{from{transform:scaleX(0)}}
.ring{--v:0;--s:52px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--c,var(--acc)) calc(var(--v)*1%),var(--bg-2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-l);width:calc(var(--s) - 12px);height:calc(var(--s) - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 13px var(--f-text);font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- Divers ---------- */
.empty{padding:40px 22px;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px}
.empty svg.i{width:34px;height:34px;color:var(--mut-2)}
.empty .illu{width:120px;height:120px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--acc-pale);color:var(--ink-2);font-size:14.5px;line-height:1.5;align-items:flex-start}
.note svg.i{color:var(--acc);margin-top:0;flex:none}
.note.warn{background:var(--warn-pale)}.note.warn svg.i{color:var(--warn)}
.note.bad{background:var(--bad-pale)}.note.bad svg.i{color:var(--bad)}
.note.ok{background:var(--ok-pale)}.note.ok svg.i{color:var(--ok)}
.tl{display:flex;flex-direction:column;position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--c,var(--acc))}
.strass{display:inline-block;width:12px;height:12px;background:var(--strass);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:scint 3.2s var(--e-in-out) infinite;flex:none}
@keyframes scint{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.7) rotate(45deg)}}
.skel{background:linear-gradient(90deg,var(--bg-2),var(--surface-2),var(--bg-2));background-size:200% 100%;animation:skel 1.2s linear infinite;border-radius:8px}
@keyframes skel{to{background-position:-200% 0}}
.skl{display:flex;flex-direction:column;gap:10px;padding:4px 0}.skl i{display:block;height:14px;max-width:100%}.skl i:first-child{height:18px}
.live{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--f-text);letter-spacing:.05em;color:#fff;background:#d6402a;padding:5px 9px;border-radius:8px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.scroll-x{overflow-x:auto;scrollbar-width:none;min-width:0}
.scroll-x::-webkit-scrollbar{display:none}

/* ---------- Mouvement d'entrée ---------- */
.rise>*{animation:rise .7s var(--e-out) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
.pop{animation:pop var(--t-3) var(--e-spring) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.fade{animation:fade var(--t-3) var(--e-out) both}
@keyframes fade{from{opacity:0}}

/* ---------- Graphiques (P.chart pose --cs pour garder un texte lisible) ---------- */
svg.chart{display:block;width:100%;overflow:visible}
svg.chart text{font:500 calc(13px * var(--cs,1)) var(--f-text);fill:var(--mut)}
svg.chart text.cv{font-weight:700;fill:var(--ink)}
svg.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
svg.chart .grid.base{stroke-dasharray:none}
svg.chart .area{opacity:.16}
svg.chart path.ln{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg.chart .draw{stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:draw 1.2s var(--e-out) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg.chart rect.cbar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--e-spring) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes grow{from{transform:scaleY(0)}}
svg.chart circle.dot{animation:popin .5s var(--e-spring) 1s both;transform-box:fill-box;transform-origin:center}
@keyframes popin{from{transform:scale(0)}}
svg.chart.spark{overflow:hidden}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;background:var(--c);flex:none}

/* ---------- Illustrations (window.ILLU) ---------- */
svg.i .sun-r{transform-box:fill-box;transform-origin:center;animation:ilspin 18s linear infinite reverse}
svg .sc{transform-box:fill-box;transform-origin:center;animation:iltw 3.2s ease-in-out infinite}
svg.illu{display:block;overflow:visible;flex:none}
.illu .il-sway{transform-box:fill-box;transform-origin:50% 100%;animation:ilsway 6s var(--e-in-out) infinite}
.illu .il-ear{transform-box:fill-box;transform-origin:50% 100%;animation:ilear 7s ease-in-out infinite}
.illu .il-blink{transform-box:fill-box;transform-origin:center;animation:ilblink 5s infinite}
.illu .il-swing{transform-box:view-box;transform-origin:50% 6%;animation:ilswing 2.4s var(--e-out) .2s both}
.illu .il-rock{transform-box:fill-box;transform-origin:50% 90%;animation:ilrock 1.4s var(--e-spring) .2s both}
.illu .il-flip{transform-box:fill-box;transform-origin:center;animation:ilflip 1.6s var(--e-out) .3s both}
.illu .il-drop{animation:ildrop 1.2s var(--e-spring) .5s both}
.illu .il-squash{transform-box:fill-box;transform-origin:50% 100%;animation:ilsquash 1.4s var(--e-spring) 1s both}
.illu .il-straw{animation:ilstraw 1.8s ease-in 1s both}
.illu .il-wave{transform-box:fill-box;transform-origin:center;animation:ilwave 2.6s ease-in-out infinite}
.illu .il-bob{animation:ilbob 3s var(--e-in-out) infinite}
.illu .il-roll{animation:ilroll 1.6s var(--e-out) .2s both}
.illu .il-wheel{transform-box:fill-box;transform-origin:center;animation:ilspin 1.6s var(--e-out) .2s both}
.illu .il-shine{animation:ilshine 3.4s ease-in-out 1s infinite}
.illu .il-tw{transform-box:fill-box;transform-origin:center;animation:iltw 3.2s ease-in-out infinite}
.illu .il-sign{stroke-dasharray:120;stroke-dashoffset:120;animation:ilsignw 1.4s var(--e-out) .6s forwards}
.illu .il-pop{transform-box:fill-box;transform-origin:center;animation:popin .6s var(--e-spring) 1.4s both}
.card:hover .illu .il-swing{animation:ilswing 2s var(--e-out) both}
.card:hover .illu .il-rock{animation:ilrock 1.2s var(--e-spring) both}
.card:hover .illu .il-flip{animation:ilflip 1.2s var(--e-out) both}
@keyframes ilsway{0%,14%,100%{transform:none}24%,42%{transform:rotate(-6deg) translate(-2px,2px)}54%,66%{transform:rotate(3deg)}76%{transform:none}}
@keyframes ilear{0%,30%,100%{transform:none}34%{transform:rotate(-16deg)}40%{transform:rotate(5deg)}46%{transform:none}}
@keyframes ilblink{0%,92%,100%{transform:none}95%{transform:scaleY(.08)}}
@keyframes ilswing{0%{transform:rotate(22deg)}25%{transform:rotate(-14deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes ilrock{0%{transform:translateY(-14px) rotate(-8deg);opacity:0}40%{transform:translateY(0) rotate(4deg);opacity:1}70%{transform:rotate(-2deg)}100%{transform:none}}
@keyframes ilflip{0%{transform:translateY(-30px) scaleX(1)}30%{transform:translateY(-36px) scaleX(-1)}60%{transform:translateY(-8px) scaleX(1)}80%{transform:translateY(2px)}100%{transform:none}}
@keyframes ildrop{0%{transform:translateY(-40px);opacity:0}50%{transform:none;opacity:1}70%{transform:translateY(-6px)}100%{transform:none;opacity:1}}
@keyframes ilsquash{30%{transform:scaleY(.92)}60%{transform:scaleY(1.03)}}
@keyframes ilstraw{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),50px) rotate(var(--r,90deg))}}
@keyframes ilwave{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scaleX(.97)}}
@keyframes ilbob{0%,100%{transform:none}50%{transform:translateY(-4px)}}
@keyframes ilroll{from{transform:translateX(-46px);opacity:0}to{transform:none;opacity:1}}
@keyframes ilspin{from{transform:rotate(-540deg)}}
@keyframes ilshine{0%,70%,100%{opacity:0}80%{opacity:.85}}
@keyframes iltw{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes ilsignw{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}}

/* ---------- Téléphone : cibles de 44 px, texte de 16 px dans les champs ---------- */
.app.mobile .btn{height:46px}
.app.mobile .btn.sm{height:42px;padding:0 13px;font-size:14.5px}
.app.mobile .btn{padding:0 15px}
.app.mobile .btn.icon{width:46px}.app.mobile .btn.icon.sm{width:42px}
.app.mobile .seg button{height:38px}
.app.mobile .in{height:48px;font-size:16px}
.app.mobile .chk{width:26px;height:26px}
.app.mobile .tag{min-height:42px}
.app.mobile .sheet .sf{flex-wrap:wrap}.app.mobile .sheet .sf .btn{min-width:0}.app.mobile .sheet .sf .btn.pri{flex:1 1 auto}
.card.tint .ico{background:color-mix(in srgb,var(--surface) 72%,transparent)}

/* =====================================================================
   PIAFFE · Coque « Paddock » : barre de démo, appareils, rail, en-tête
   ===================================================================== */
body{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#demo{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- Barre de démonstration ---------- */
.dbar{display:flex;align-items:center;gap:14px;height:64px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:30;min-width:0}
.dbar .brand{display:flex;align-items:center;gap:6px;font:800 24px/1 var(--f-display);letter-spacing:-.055em;color:var(--ink);white-space:nowrap}
.dbar .brand small{font:600 13px/1 var(--f-text);letter-spacing:0;color:var(--mut);padding:6px 9px;border-radius:9px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);margin-left:2px}
.dbar .roles{margin:0 auto;min-width:0}
.dbar .roles button svg.i{width:19px;height:19px}
.dbar .right{display:flex;gap:8px;align-items:center}
.dbar .btn.icon.sm{width:42px;height:42px}
@media (max-width:980px){.dbar .dev,.dbar .brand small,.dbar .tourb span{display:none}.dbar{gap:8px}.dbar .roles{margin:0;flex:1}.dbar .roles button{padding:0 10px}}
@media (max-width:600px){.dbar{height:58px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}.dbar .roles button .lbl{display:none}.dbar .roles button[aria-selected="true"] .lbl{display:inline}.dbar .brand span{display:none}.dbar .roles button{padding:0 9px}}

/* ---------- Scène et appareils ---------- */
.stage{position:relative;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:hidden}
.stage[data-dev="tablet"],.stage[data-dev="phone"]{padding:24px 16px;align-items:center;background:radial-gradient(60% 50% at 18% 25%,var(--rd-bg),transparent 70%),radial-gradient(50% 45% at 84% 72%,var(--hz-bg),transparent 70%),radial-gradient(40% 40% at 70% 12%,var(--mo-bg),transparent 70%),var(--bg-2)}
.frame{position:relative;width:100%;height:100%;min-width:0;background:var(--bg);transition:width var(--t-4) var(--e-out),height var(--t-4) var(--e-out)}
.frame .hw{display:none}
/* tablette */
.stage[data-dev="tablet"] .frame{width:min(1108px,100%);height:min(808px,100%);border-radius:44px;border:14px solid #0b0d12;box-shadow:0 0 0 2px #2c313d,var(--shadow-3);background:#0b0d12}
.stage[data-dev="tablet"] .frame .app{border-radius:30px;overflow:hidden}
.stage[data-dev="tablet"]:not(.full) .frame .hw.cam{display:block;position:absolute;top:-9px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#2a2f3a;z-index:61}
/* téléphone : iPhone */
.stage[data-dev="phone"] .frame{width:426px;max-width:100%;height:min(898px,100%);flex:none;border-radius:72px;border:12px solid #0b0d12;box-shadow:0 0 0 2px #2c313d,0 0 0 5px #11141b,var(--shadow-3);background:#0b0d12}
.stage[data-dev="phone"] .frame .app{border-radius:60px;overflow:hidden}
.stage[data-dev="phone"]:not(.full) .frame .hw{display:block}
.frame .island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:62;pointer-events:none}
.frame .sbar{position:absolute;top:0;left:0;right:0;height:54px;align-items:center;justify-content:space-between;padding:4px 34px 0 46px;z-index:61;font:600 17px/1 var(--f-text);color:var(--ink);pointer-events:none}
.stage[data-dev="phone"]:not(.full) .frame .sbar{display:flex}
.frame .sbar .r{display:flex;gap:7px;align-items:center}
.frame .homebar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:var(--ink);opacity:.8;z-index:62;pointer-events:none}
.frame .dbtn{position:absolute;width:4px;border-radius:2px;background:#22262f}
.stage.full .frame{border-radius:0!important;box-shadow:none!important;border:0!important;width:100%!important;height:100%!important;background:var(--bg)!important}
.stage.full .frame .app{border-radius:0!important}
.stage.full{padding:0!important;background:var(--bg)!important}

/* ---------- Application ---------- */
.app{position:absolute;inset:0;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);background:var(--bg);transition:grid-template-columns .32s var(--e-out)}
.app.mobile{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

/* ---------- Menu latéral ---------- */
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface);padding:14px 12px 12px;overflow:hidden}
.side .club{display:flex;align-items:center;gap:12px;width:100%;padding:8px;margin-bottom:10px;border-radius:16px;text-align:left;flex:none;transition:background var(--t-2)}
.side .club:hover{background:var(--surface-2)}
.side .club .lg{width:40px;height:40px;border-radius:13px;background:var(--navy);display:grid;place-items:center;color:var(--navy-ink);flex:none;transition:transform .5s var(--e-spring)}
.side .club:hover .lg{transform:rotate(-8deg) scale(1.05)}
.side .cn{display:flex;flex-direction:column;gap:2px;min-width:0}
.side .cn b{font:700 15px/1.2 var(--f-text);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .cn small{font:500 13px/1.2 var(--f-text);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side nav{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;display:flex;flex-direction:column;gap:6px;margin:0 -12px;padding:2px 12px 16px}
.side .grp{display:flex;flex-direction:column;min-width:0}
.side .gh{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 8px 0 12px;border-radius:10px;color:var(--mut);font:700 13px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;text-align:left;transition:color var(--t-2),background var(--t-2)}
.side .gh>span:first-child{flex:1}
.side .gh:hover{color:var(--ink);background:var(--surface-2)}
.side .gh svg.i{width:18px;height:18px;opacity:0;transition:opacity var(--t-2),transform .3s var(--e-out)}
.side .gh:hover svg.i,.side .grp.shut .gh svg.i{opacity:1}
.side .grp.shut .gh svg.i{transform:rotate(-90deg)}
.side .gh .bdg{margin-right:2px}
.side .gl{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding-top:2px}
.side .grp.shut .gl{display:none}
.side .grp:not(.shut) .gl{animation:subin .35s var(--e-out)}
@keyframes subin{from{opacity:0;transform:translateY(-4px)}}
.side .nv{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 10px 0 6px;border-radius:14px;color:var(--ink-2);font:550 15px/1.2 var(--f-text);text-decoration:none;position:relative;transition:background var(--t-2),color var(--t-2)}
.side .nv .pl{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--mut);transition:background var(--t-2),color var(--t-2),transform .45s var(--e-spring)}
.side .nv .pl svg.i{width:20px;height:20px}
.side .nv .lb{flex:1;min-width:0;padding:5px 0}
.side .nv:hover{background:var(--surface-2);color:var(--ink)}
.side .nv:hover .pl{color:var(--d)}
.side .nv:active .pl{transform:scale(.88)}
.side .nv[aria-current="page"]{background:var(--d-bg);color:var(--d-ink);font-weight:700}
.side .nv[aria-current="page"] .pl{background:var(--d);color:#fff}
.side .nv[aria-current="page"] .pl svg.i{animation:nvpop .5s var(--e-spring)}
@keyframes nvpop{40%{transform:scale(.8)}}
.side .bdg{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--surface-3);color:var(--ink-2);font:700 13px/24px var(--f-text);text-align:center;flex:none}
.side .bdg.hot{background:var(--cr);color:#fff}
.side .nv[aria-current="page"] .bdg:not(.hot){background:var(--surface);color:var(--d-ink)}
.side .me{display:flex;align-items:center;gap:12px;padding:12px 8px 0;border-top:1px solid var(--line);flex:none}
.side .me .av{flex:none}
@media (prefers-reduced-motion:reduce){.side .grp .gl,.side .nv .pl svg.i{animation:none!important}}

/* ---------- Zone principale ---------- */
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0;container:main/inline-size;position:relative}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,580px) minmax(max-content,1fr);align-items:center;gap:20px;height:76px;padding:0 28px 0 32px;position:relative;z-index:5;min-width:0;background:var(--bg)}
.top .lft{display:flex;align-items:center;gap:10px;min-width:0}
.top .crumb{display:flex;align-items:center;gap:9px;color:var(--mut);font:600 15px/1 var(--f-text);min-width:0;white-space:nowrap}
.top .crumb .dt{width:10px;height:10px;border-radius:50%;background:var(--d);flex:none}
.top .crumb span{overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.top .crumb svg.i{width:17px;height:17px;flex:none;color:var(--mut-2)}
.cmdk{height:50px;width:100%;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;color:var(--mut);font:500 15.5px/1 var(--f-text);transition:box-shadow var(--t-2),transform .35s var(--e-spring),background var(--t-2);min-width:0}
.cmdk:hover{box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-1);background:var(--surface)}
.cmdk:active{transform:scale(.985)}
.cmdk .q{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk kbd{padding:6px 8px}
.top .tools{justify-self:end;display:flex;align-items:center;gap:8px}
.top .tools .btn.icon{border-radius:14px}
.top .ai{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:var(--r-pill);background:var(--navy);color:var(--navy-ink);font:600 15px/1 var(--f-text);transition:transform .35s var(--e-spring),box-shadow var(--t-2)}
.top .ai:hover{box-shadow:var(--shadow-2)}
.top .ai:active{transform:scale(.94)}
.top .ai svg.i{width:20px;height:20px}
.top .ai svg.i .af{fill:var(--strass)}
.bellb{position:relative}
.bellb i{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--cr);box-shadow:0 0 0 2.5px var(--bg)}
.view{overflow-y:auto;overflow-x:hidden;min-height:0;padding:6px 32px 64px;scroll-behavior:smooth;position:relative;overscroll-behavior:contain}
.view>.page{max-width:1680px;margin:0 auto;min-width:0}
.view.enter>.page{animation:pageIn var(--t-4) var(--e-out) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.mt,.mback{display:none}
/* tablette et fenêtres moyennes */
@container main (max-width:1000px){.top{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:14px;padding:0 20px 0 24px}.top .ai .lbl{display:none}.top .ai{width:44px;padding:0;justify-content:center}.cmdk kbd{display:none}}
@container main (max-width:760px){.view{padding:6px 18px 44px}}

/* ---------- Téléphone ---------- */
.app.mobile .side{display:none}
.app.mobile .top{display:flex;flex-wrap:wrap;align-items:center;height:auto;padding:58px 16px 4px;gap:8px;background:var(--bg)}
.stage.full .app.mobile .top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.app.mobile .top .lft{flex:1;min-width:0}
.app.mobile .top .crumb,.app.mobile .cmdk{display:none}
.app.mobile .top .mt{display:block;order:3;flex:1 0 100%;font:800 34px/1.1 var(--f-display);letter-spacing:-.035em;color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0 2px}
.mlogo{display:none}
.app.mobile .mlogo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--navy);color:var(--navy-ink)}
.app.mobile .top .tools{gap:6px}
.app.mobile .top .tools .btn.icon{background:var(--surface-2);box-shadow:none;width:44px;height:44px}
.app.mobile .top .tools .hide-m{display:none}
.app.mobile .top .msearch{display:inline-flex}
.app.mobile .top .ai{width:44px;height:44px;padding:0;justify-content:center}
.app.mobile .top .ai .lbl{display:none}
.app.mobile .mback{display:inline-flex;margin-left:-6px}
.msearch{display:none!important}
.app.mobile .top .msearch{display:inline-flex!important}
/* la vue s'arrête au-dessus de la barre flottante : les éléments collants des écrans restent visibles */
.app.mobile .main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.stage:not(.full) .app.mobile .main{padding-bottom:104px}
.app.mobile .view{padding:6px 16px 28px}
.app.mobile .ph h1{display:none}
.app.mobile .ph{margin:0 0 16px;flex-direction:column;align-items:stretch;gap:12px}
.app.mobile .ph .sub{margin-top:0;font-size:15.5px}
.app.mobile .ph .acts{width:100%}
.app.mobile .ph .acts .btn{flex:1}
/* barre d'onglets flottante */
.tabbar{display:none}
.app.mobile .tabbar{display:flex;position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:72px;border-radius:28px;z-index:30;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line-2) 70%,transparent),0 20px 40px -14px rgba(10,22,54,.32);padding:6px;align-items:center;gap:2px}
.stage:not(.full) .app.mobile .tabbar{bottom:26px}
.tabbar button{flex:1;min-width:0;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:22px;font:600 12.5px/1 var(--f-text);color:var(--mut);position:relative;isolation:isolate;transition:color var(--t-2)}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tabbar button svg.i{width:24px;height:24px;transition:transform .45s var(--e-spring)}
.tabbar button::before{content:"";position:absolute;inset:3px 4px;border-radius:18px;background:var(--d-bg,var(--surface-3));z-index:-1;opacity:0;transform:scale(.6);transition:opacity var(--t-2),transform .45s var(--e-spring)}
.tabbar button[aria-current="page"]{color:var(--d-ink,var(--ink))}
.tabbar button[aria-current="page"]::before{opacity:1;transform:none}
.tabbar button[aria-current="page"] svg.i{transform:translateY(-1px) scale(1.08)}
.tabbar button:active svg.i{transform:scale(.86)}
.tabbar button.more{flex:none;width:56px;border-radius:22px;background:var(--navy);color:var(--navy-ink);margin-left:4px}
.tabbar button.more::before{display:none}
.tabbar button.more svg.i{width:24px;height:24px}
.tabbar .bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:21px;height:21px;border-radius:11px;background:var(--cr);color:#fff;font:700 13px/21px var(--f-text);padding:0 5px;box-shadow:0 0 0 2px var(--surface)}

/* ---------- Feuilles, panneaux, superpositions ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,22,54,.30);z-index:40;animation:fade var(--t-3) var(--e-out) both}
.sheet{position:absolute;z-index:41;background:var(--surface);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow-3);overflow:hidden}
.sheet.side-r{top:12px;right:12px;bottom:12px;width:min(540px,calc(100% - 24px));border-radius:var(--r-xl);animation:sheetR var(--t-4) var(--e-out) both}
.sheet.wide{width:min(800px,calc(100% - 24px))}
@keyframes sheetR{from{transform:translateX(calc(100% + 24px))}}
.sheet.bottom{left:0;right:0;bottom:0;max-height:90%;border-radius:30px 30px 0 0;animation:sheetB var(--t-4) var(--e-out) both}
.sheet.bottom::before{content:"";position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent);z-index:2}
@keyframes sheetB{from{transform:translateY(100%)}}
.sheet .sh{display:flex;align-items:center;gap:14px;padding:20px 20px 16px 24px;border-bottom:1px solid var(--line);flex:none}
.sheet.bottom .sh{padding:26px 16px 14px 20px}
.sheet .sh h2{font:800 25px/1.12 var(--f-display);letter-spacing:-.03em;flex:1;min-width:0}
.sheet .sh .btn.icon{background:var(--surface-2);box-shadow:none;border-radius:50%}
.sheet .sb{container:main/inline-size;overflow-y:auto;padding:22px 24px;min-height:0;flex:1;overscroll-behavior:contain}
.sheet.bottom .sb{padding:18px 18px 22px}
.sheet .sf{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex:none}
.stage:not(.full) .sheet.bottom .sf{padding-bottom:30px}
.sheet.closing{animation:none;transition:transform var(--t-3) var(--e-in-out),opacity var(--t-3);opacity:0}
.sheet.side-r.closing{transform:translateX(30px)}.sheet.bottom.closing{transform:translateY(40px)}
.toasts{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.app.mobile .toasts{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.stage:not(.full) .app.mobile .toasts{bottom:112px}
.toast{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 10px 8px 16px;border-radius:18px;background:var(--navy);color:var(--navy-ink);box-shadow:var(--shadow-3);font:600 15px/1.35 var(--f-text);animation:toastIn var(--t-4) var(--e-spring) both;pointer-events:auto;max-width:100%}
.toast svg.i{color:var(--hz);flex:none}
.toast span{padding-right:6px}
.toast button{height:36px;padding:0 12px;border-radius:11px;background:color-mix(in srgb,var(--navy-ink) 14%,transparent);font:700 14px/1 var(--f-text);color:inherit;flex:none}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.92)}}
.toast.out{transition:all var(--t-3) var(--e-in-out);opacity:0;transform:translateY(10px) scale(.96)}

/* ---------- Palette de commandes ⌘K ---------- */
.pal{position:absolute;z-index:61;left:50%;top:84px;transform:translateX(-50%);width:min(660px,calc(100% - 24px));background:var(--raise);border-radius:26px;box-shadow:var(--shadow-3),inset 0 0 0 1px var(--line);overflow:hidden;animation:palIn .4s var(--e-spring) both}
@keyframes palIn{from{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.97)}}
.pal .pin{display:flex;align-items:center;gap:12px;padding:0 18px;height:66px;border-bottom:1px solid var(--line)}
.pal .pin svg.i{color:var(--mut)}
.pal .pin input{flex:1;border:0;outline:0;background:none;font:500 18px var(--f-text);min-width:0;color:var(--ink)}
.pal .pin input::placeholder{color:var(--mut-2)}
.pal .pres{max-height:min(460px,58vh);overflow-y:auto;padding:8px}
.pal .pg{font:600 13px var(--f-text);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:12px 12px 6px}
.pal .po{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:15px;cursor:pointer;font:500 16px var(--f-text)}
.pal .po .ico{width:36px;height:36px;border-radius:11px}
.pal .po .ico svg.i{width:20px;height:20px}
.pal .po>span:not(.ico){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .po .s{color:var(--mut);font-size:14px;margin-left:auto;flex:none;max-width:45%}
.pal .po[aria-selected="true"]{background:var(--surface-2)}
.pal .pfoot{display:flex;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.app.mobile .pal{top:auto;bottom:0;left:0;right:0;width:auto;transform:none;border-radius:28px 28px 0 0;animation:sheetB var(--t-4) var(--e-out) both;padding-bottom:env(safe-area-inset-bottom,0px)}
.stage:not(.full) .app.mobile .pal{padding-bottom:22px}
.app.mobile .pal .pfoot{display:none}
.app.mobile .pal .pres{max-height:52vh}

/* ---------- Popover ---------- */
.pop-o{position:absolute;z-index:45;background:var(--raise);border-radius:var(--r-lg);box-shadow:var(--shadow-3),inset 0 0 0 1px var(--line);animation:pop var(--t-3) var(--e-spring) both;overflow:hidden;max-height:calc(100% - 100px);overflow-y:auto}

/* ---------- Assistant flottant ---------- */
.aip{position:absolute;z-index:50;right:16px;bottom:16px;width:min(440px,calc(100% - 32px));height:min(660px,calc(100% - 32px));background:var(--raise);border-radius:var(--r-xl);box-shadow:var(--shadow-3),inset 0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;animation:aiIn var(--t-4) var(--e-out) both;transform-origin:bottom right}
@keyframes aiIn{from{opacity:0;transform:scale(.92) translateY(10px)}}
.app.mobile .aip{right:0;left:0;bottom:0;width:auto;height:90%;border-radius:30px 30px 0 0;transform-origin:bottom center}
.aip .aih{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(150deg,var(--acc-bg),color-mix(in srgb,var(--acc-bg) 30%,var(--raise)) 70%)}
.app.mobile .aip .aih{padding-top:24px}
.aip .aih b{font:700 17px/1.2 var(--f-display);letter-spacing:-.01em}
.aip .aih .btn.icon{background:var(--surface);box-shadow:none;border-radius:50%}
.aip .aih .orb{width:40px;height:40px;border-radius:14px;background:var(--navy);display:grid;place-items:center;flex:none}
.aip .aib{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.msg{max-width:88%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.5;animation:rise var(--t-4) var(--e-out) both}
.msg.u{align-self:flex-end;background:var(--acc);color:var(--on-acc);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg .act{margin-top:10px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.typing{display:inline-flex;gap:5px;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mut-2);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{30%{transform:translateY(-4px);background:var(--acc)}}
.aip .aif{padding:12px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.stage:not(.full) .app.mobile .aip .aif{padding-bottom:30px}
.aip .sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.aip .sugg::-webkit-scrollbar{display:none}
.aip .sugg button{flex:none;font:600 14px/1 var(--f-text);height:38px;padding:0 14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;color:var(--ink-2)}
.aip .sugg button:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.aip .comp{display:flex;gap:8px;align-items:center;padding:4px 4px 4px 16px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface)}
.aip .comp:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc),var(--ring)}
.aip .comp input{flex:1;border:0;outline:0;background:none;min-width:0;height:44px;font-size:16px}

/* ---------- Visite guidée ---------- */
.tour{position:fixed;z-index:90;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(580px,calc(100% - 28px));background:var(--navy);color:var(--navy-ink);border-radius:var(--r-xl);box-shadow:var(--shadow-3);padding:20px 22px 18px;display:flex;flex-direction:column;gap:10px;animation:toastIn var(--t-4) var(--e-spring) both}

.tour .tn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.tour .tn .dots{display:flex;gap:5px;margin-right:auto}
.tour .tn .dots i{width:8px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--navy-ink) 25%,transparent);transition:width var(--t-3) var(--e-out)}

.tour .btn{box-shadow:none}
.tour .btn.ghost{color:var(--navy-ink)}
.tour .btn.ghost:hover{background:color-mix(in srgb,var(--navy-ink) 10%,transparent)}

/* ---------- Points chauds de la vue 3D ---------- */
.h3d{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:0;margin:-11px 0 0 -11px;transition:opacity var(--t-2);z-index:2;pointer-events:auto}
.h3d i{width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);display:grid;place-items:center;flex:none;animation:hotp 2.4s infinite}
.h3d i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.h3d span{font:600 13.5px/1 var(--f-text);background:var(--raise);padding:7px 10px;border-radius:10px;box-shadow:var(--shadow-2);white-space:nowrap;opacity:0;transform:translateX(-4px);transition:all var(--t-2) var(--e-out)}
.h3d:hover span,.h3d:focus-visible span,.h3d.show span{opacity:1;transform:none}
@keyframes hotp{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 10%,transparent)}}

/* ---------- Dispositions du menu (comparateur) ---------- */
.app.nav-colonnes{--sidebar:320px}.app.nav-accordeon{--sidebar:244px}.app.nav-survol,.app.nav-onglets{--sidebar:232px}
.app.mobile .stw,.app.mobile .navfly{display:none}
/* ligne de section commune : accordéon, survol, onglets */
.side .sec{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 10px 0 6px;border-radius:14px;color:var(--ink);font:650 15.5px/1.2 var(--f-text);text-align:left;position:relative;transition:background var(--t-2),color var(--t-2)}
.side .sec .pl{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--d-bg);color:var(--d-ink);transition:transform .45s var(--e-spring),background var(--t-2),color var(--t-2)}

.side .sec .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sec>svg.i{width:18px;height:18px;color:var(--mut);flex:none;transition:transform .3s var(--e-out)}
.side .sec:hover,.side .sec.hov{background:var(--surface-2)}
.side .sec:active .pl{transform:scale(.9)}
.side .sec.on{background:var(--d-bg);color:var(--d-ink)}
.side .sec.on .pl{background:var(--d);color:#fff}

.app.nav-survol .side nav,.app.nav-onglets .side nav,.app.nav-accordeon .side nav{gap:4px}
/* accordéon */
.side .acc-g{display:flex;flex-direction:column;min-width:0}
.side .acc-g.open>.sec>svg.i{transform:rotate(180deg)}
.side .acc-g .gl{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:4px 0 8px 12px;padding-left:4px;border-left:2px solid var(--d-bg);animation:accin .4s var(--e-out)}
@keyframes accin{from{opacity:0;transform:translateY(-8px)}}
.side .acc-g .nv .pl{width:28px;height:28px}
/* deux colonnes */
.app.nav-colonnes .side{padding:16px 0 12px 12px}
.app.nav-colonnes .side nav{flex-direction:row;gap:0;margin:0;padding:0;overflow:hidden}
.side .c1{width:84px;flex:none;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none;padding:2px 0 10px}
.side .c1b{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px 8px;border-radius:16px;color:var(--mut);font:600 13px/1.15 var(--f-text);text-align:center;transition:color var(--t-2),background var(--t-2)}
.side .c1b .pl{width:52px;height:44px;border-radius:15px;display:grid;place-items:center;position:relative;transition:background var(--t-2),color var(--t-2),transform .45s var(--e-spring)}
.side .c1b .pl svg.i{width:22px;height:22px}
.side .c1b .dot{position:absolute;top:5px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--mut-2);box-shadow:0 0 0 2.5px var(--surface)}
.side .c1b .dot.hot{background:var(--cr)}
.side .c1b:hover{color:var(--ink)}.side .c1b:hover .pl{background:var(--surface-2)}
.side .c1b:active .pl{transform:scale(.9)}
.side .c1b.on{color:var(--ink)}.side .c1b.on .pl{background:var(--d);color:#fff}
.side .c2{flex:1;min-width:0;margin-left:10px;padding:6px 12px 10px;border-left:1px solid var(--line);overflow-y:auto;scrollbar-width:thin;animation:c2in .35s var(--e-out)}
@keyframes c2in{from{opacity:0;transform:translateX(-8px)}}
.side .c2h{font:800 24px/1.1 var(--f-display);letter-spacing:-.03em;color:var(--d-ink);padding:4px 8px 0}
.side .c2s{font:500 13px/1.3 var(--f-text);color:var(--mut);padding:4px 8px 12px}
.side .c2 .gl{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.app.nav-colonnes .side .club .cn small{display:block}
/* menu flottant */
.navfly{position:absolute;z-index:40;width:290px;padding:14px 10px 10px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line),var(--shadow-3);opacity:0;transform:translateX(-10px) scale(.98);transform-origin:left top;pointer-events:none;transition:opacity .18s var(--e-out),transform .3s var(--e-spring)}
.navfly.show{opacity:1;transform:none;pointer-events:auto}
.navfly .fh{display:flex;align-items:center;gap:12px;padding:0 6px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.navfly .fh b{display:block;font:800 19px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.navfly .fh small{font:500 13px/1.3 var(--f-text);color:var(--mut)}
.navfly .gl{display:grid;gap:2px}
.navfly .nv{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px 0 6px;border-radius:14px;color:var(--ink-2);font:550 15px/1.2 var(--f-text);text-decoration:none;transition:background var(--t-2)}
.navfly .nv .pl{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--mut)}

.navfly .nv .lb{flex:1;min-width:0}
.navfly .nv:hover{background:var(--surface-2);color:var(--ink)}.navfly .nv:hover .pl{color:var(--d)}
.navfly .nv[aria-current="page"]{background:var(--d-bg);color:var(--d-ink);font-weight:700}
.navfly .nv[aria-current="page"] .pl{background:var(--d);color:#fff}
.navfly .bdg{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--surface-3);color:var(--ink-2);font:700 13px/24px var(--f-text);text-align:center}
.navfly .bdg.hot{background:var(--cr);color:#fff}
/* onglets de section */
.stw:empty{display:none}
.sectabs{display:flex;gap:6px;padding:0 32px 10px;overflow-x:auto;scrollbar-width:none;animation:c2in .35s var(--e-out)}
.sectabs .st{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:999px;color:var(--ink-2);font:600 15px/1 var(--f-text);text-decoration:none;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);transition:background var(--t-2),color var(--t-2),box-shadow var(--t-2)}
.sectabs .st svg.i{width:19px;height:19px;color:var(--mut)}
.sectabs .st:hover{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.sectabs .st[aria-current="page"]{background:var(--d);color:#fff;box-shadow:none}
.sectabs .st[aria-current="page"] svg.i{color:#fff}
.sectabs .bdg{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--surface-3);color:var(--ink-2);font:700 13px/22px var(--f-text);text-align:center}
.sectabs .bdg.hot{background:var(--cr);color:#fff}
.sectabs .st[aria-current="page"] .bdg{background:rgba(255,255,255,.25);color:#fff}
@container main (max-width:760px){.sectabs{padding:0 18px 10px}}
/* sélecteur de menus (page de comparaison) */
#demo.has-navsw .stage:not(.full){padding-bottom:120px}
#demo.has-navsw .view{padding-bottom:150px}
.navsw{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:16px;max-width:calc(100% - 24px);padding:10px 10px 10px 20px;border-radius:24px;background:var(--navy);color:var(--navy-ink);box-shadow:var(--shadow-3);animation:nswin .6s var(--e-spring) both}
@keyframes nswin{from{opacity:0;transform:translate(-50%,24px)}}
.navsw .nsh{display:flex;flex-direction:column;gap:3px;flex:1 1 260px;min-width:200px;max-width:320px}
.navsw .nsh b{font:800 16px/1.1 var(--f-display);letter-spacing:-.01em}
.navsw .nsh span{font:500 13px/1.35 var(--f-text);opacity:.78}
.navsw .nsb{display:flex;gap:6px;flex-wrap:nowrap}
.navsw .nsb button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 8px;border-radius:15px;color:inherit;font:600 14px/1 var(--f-text);background:color-mix(in srgb,var(--navy-ink) 9%,transparent);transition:background var(--t-2),transform .35s var(--e-spring)}
.navsw .nsb button i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--navy-ink) 15%,transparent);font:800 14px/1 var(--f-display)}
.navsw .nsb button:hover{background:color-mix(in srgb,var(--navy-ink) 17%,transparent)}
.navsw .nsb button:active{transform:scale(.95)}
.navsw .nsb button[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy)}
.navsw .nsb button[aria-pressed="true"] i{background:var(--navy);color:var(--navy-ink)}
@media (max-width:1300px){.navsw{flex-direction:column;align-items:stretch;gap:10px;padding:14px;bottom:10px}.navsw .nsh{flex:none;max-width:none;min-width:0}.navsw .nsb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.navsw .nsb button{flex:none}}
@media (prefers-reduced-motion:reduce){.side .acc-g .gl,.side .c2,.sectabs,.navsw{animation:none!important}.navfly{transition:none}}
#demo:has(.app.mobile) .navsw{display:none}

/* ---------- Menu réduit (icônes + pastilles) et bouton réduire/agrandir ---------- */
.navtog{position:absolute;z-index:35;top:32px;left:calc(var(--sidebar) - 14px);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--mut);box-shadow:0 0 0 1px var(--line-2),var(--shadow-1,0 1px 3px rgba(10,22,54,.12));transition:left .32s var(--e-out),color var(--t-2),background var(--t-2),transform .35s var(--e-spring)}
.navtog svg.i{width:16px;height:16px;transition:transform .32s var(--e-out)}

.app.mobile .navtog{display:none}
.app.app.mini{--sidebar:76px}
.app.app.mini .side{padding:14px 10px 12px}
.app.mini .side .club{justify-content:center;padding:8px 0}
.app.mini .side .cn{display:none}

.app.mini .side .sec .pl{width:40px;height:40px}
.app.mini .side .sec .lb,.app.mini .side .sec>svg.i{display:none}
.app.mini .side .sec .bdg{position:absolute;top:1px;right:3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font:700 12.5px/20px var(--f-text);box-shadow:0 0 0 2px var(--surface)}
.app.mini .side .sec.on .bdg,.app.mini .side .sec.hov .bdg{box-shadow:0 0 0 2px var(--d-bg)}
.app.mini .side .me{justify-content:center;padding:12px 0 0}
@media (prefers-reduced-motion:reduce){.app,.navtog,.navtog svg.i{transition:none}}

/* =====================================================================
   Manche 4 : marque, lanceur, assistant sobre, motion de la coque
   ===================================================================== */
/* bouton de l'assistant : un bouton d'outil, pas une pastille « magique » */
.top .ai{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);padding:0 16px 0 6px;gap:10px}
.top .ai:hover{box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-1);background:var(--surface-2)}
.top .ai .aim{width:32px;height:32px;border-radius:var(--r-pill);background:var(--navy);display:grid;place-items:center;flex:none;transition:transform .5s var(--e-spring)}
.top .ai:hover .aim{transform:rotate(-8deg) scale(1.06)}
.app.mobile .top .ai{background:transparent;box-shadow:none}
.app.mobile .top .ai .aim{width:40px;height:40px}
@container main (max-width:1000px){.top .ai{padding:0;background:transparent;box-shadow:none}.top .ai .aim{width:40px;height:40px}}
.aip .aih{background:var(--surface)}

/* écran de lancement */
.splash{position:absolute;inset:0;z-index:90;display:grid;place-items:center;background:var(--hero);color:var(--hero-ink);border-radius:inherit;pointer-events:none;transition:opacity .45s var(--e-out),transform .45s var(--e-out)}
.stage[data-dev="phone"] .splash{border-radius:60px}.stage[data-dev="tablet"] .splash{border-radius:30px}.stage.full .splash{border-radius:0}
.splash.out{opacity:0;transform:scale(1.04)}
.splash .spc{display:flex;flex-direction:column;align-items:center;gap:14px}
.splash .spl{display:block;animation:splLogo .8s var(--e-spring) both}
.splash .spl .lg-b{stroke-dasharray:320;stroke-dashoffset:320;fill-opacity:0;animation:splDraw .7s .05s var(--e-out) forwards}
.splash b{font:800 40px/1 var(--f-display);letter-spacing:-.04em;animation:splUp .6s .25s var(--e-out) both}
.splash small{font:500 15px/1 var(--f-text);opacity:.7;animation:splUp .6s .38s var(--e-out) both}
.splash .spbar{display:block;width:72px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--hero-ink) 18%,transparent);overflow:hidden;margin-top:12px;animation:splUp .5s .45s var(--e-out) both}
.splash .spbar i{display:block;height:100%;width:100%;background:var(--strass);border-radius:3px;transform-origin:left;animation:splBar .75s .5s var(--e-out) both}
@keyframes splLogo{from{opacity:0;transform:translateY(14px) scale(.8)}}
@keyframes splDraw{60%{fill-opacity:0}to{stroke-dashoffset:0;fill-opacity:1}}
@keyframes splUp{from{opacity:0;transform:translateY(10px)}}
@keyframes splBar{from{transform:scaleX(0)}}

/* lanceur « Tous les écrans » : de vraies icônes d'app */
.lnch section{margin-bottom:22px}
.lnch .eyebrow{margin:2px 4px 12px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:18px 6px}
.lapp{display:flex;flex-direction:column;align-items:center;gap:9px;padding:4px 0;border-radius:18px;color:var(--ink);animation:lappIn .5s calc(var(--i,0)*28ms) var(--e-spring) both;-webkit-tap-highlight-color:transparent}
.lapp b{font:600 13px/1.2 var(--f-text);letter-spacing:-.015em;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lapp .aic{position:relative;width:62px;height:62px;border-radius:19px;display:grid;place-items:center;color:#fff;
  background:radial-gradient(120% 90% at 30% 0%,color-mix(in srgb,#fff 28%,var(--d,var(--acc))) 0%,transparent 60%),linear-gradient(165deg,var(--d,var(--acc)),color-mix(in srgb,var(--d,var(--acc)) 72%,#0a1636));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(10,22,54,.18),0 8px 18px -10px color-mix(in srgb,var(--d,var(--acc)) 80%,transparent);
  transition:transform .4s var(--e-spring),box-shadow var(--t-2)}
.lapp .aic svg.i{width:30px;height:30px;stroke-width:2;filter:drop-shadow(0 1px 1px rgba(10,22,54,.2))}
.lapp .aic svg.i .f{fill:#fff}
.lapp .aic em{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--cr);color:#fff;font:700 12.5px/22px var(--f-text);font-style:normal;box-shadow:0 0 0 2.5px var(--raise,var(--surface));animation:lappBdg .5s calc(var(--i,0)*28ms + .25s) var(--e-spring) both}
.lapp:hover .aic{transform:translateY(-3px) rotate(-3deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(10,22,54,.18),0 14px 24px -12px color-mix(in srgb,var(--d,var(--acc)) 90%,transparent)}
.lapp:active .aic{transform:scale(.88);transition-duration:.12s}
.lapp[aria-current="page"] b,.lapp.cur b{color:var(--d-ink)}
@keyframes lappIn{from{opacity:0;transform:translateY(14px) scale(.7)}}
@keyframes lappBdg{from{opacity:0;transform:scale(0)}}

/* pastille qui glisse */
.seg>button,.tabs>button,.tabs>a,.tabbar>button{position:relative;z-index:1}
.tabs{position:relative}
.glide{position:absolute;left:0;top:0;z-index:0;pointer-events:none;will-change:transform,width}

.seg>button.gl-hide[aria-selected="true"]{background:transparent;box-shadow:none}

.dbar .seg>button.gl-hide[aria-selected="true"]{background:transparent;box-shadow:none}

/* transitions de page selon le sens : onglet (fondu), détail (glisse de la droite), retour (de la gauche) */
.view.enter[data-dir="tab"]>.page{animation:pageTab .34s var(--e-out) both}
.view.enter[data-dir="fwd"]>.page{animation:pageFwd .38s var(--e-out) both}
.view.enter[data-dir="back"]>.page{animation:pageBack .38s var(--e-out) both}
@keyframes pageTab{from{opacity:0;transform:translateY(8px) scale(.996)}}
@keyframes pageFwd{from{opacity:0;transform:translateX(28px)}}
@keyframes pageBack{from{opacity:0;transform:translateX(-28px)}}

/* fil d'Ariane et titre téléphone : le nouveau titre glisse en place */
.crumb b,.app.mobile .mt{animation:crumbIn .35s var(--e-out) both}
@keyframes crumbIn{from{opacity:0;transform:translateY(5px)}}

@media (prefers-reduced-motion:reduce){.splash *,.lapp,.lapp .aic em,.crumb b,.app.mobile .mt,.view.enter>.page{animation:none!important}}

.splash .spl{filter:drop-shadow(0 10px 30px rgba(109,139,255,.25))}
.app.mobile .lgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 4px}

.side .nv .lb{white-space:normal;hyphens:none;-webkit-hyphens:none;overflow-wrap:normal;word-break:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.15;letter-spacing:-.01em}

.side .nv{gap:10px}
.side .acc-g .nv{gap:8px;padding-right:6px}
/* cibles tactiles : petits boutons, onglets segmentés et étiquettes cliquables gardent leur dessin mais reçoivent une zone de 44 px (téléphone, tablette tactile) */
:where(.app.mobile, .app.rail) :where(.btn.sm, .seg>button, button.tag, a.tag){position:relative}
:where(.app.mobile, .app.rail) :where(.btn.sm, .seg>button, button.tag, a.tag)::before{content:"";position:absolute;left:0;right:0;top:50%;height:44px;min-height:100%;transform:translateY(-50%)}

/* ---------- Échelle d'affichage et barre de démo repliable ---------- */
.app:not(.mobile){zoom:var(--z,1)}

.updb{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100vw - 24px);padding:10px 10px 10px 12px;border-radius:18px;background:var(--raise);box-shadow:var(--shadow-3),inset 0 0 0 1px var(--line);animation:updin .45s var(--e-spring) both;font-family:var(--f-text)}
.updb.out{opacity:0;transform:translate(-50%,-12px);transition:opacity .3s,transform .3s}

@keyframes updin{from{opacity:0;transform:translate(-50%,-16px)}}
/* icônes Phosphor (duotone) : pleines, la couche claire prend 22 % de la couleur */

/* illustrations v2 : disque clair, grande icône deux tons couleur du domaine */

@keyframes il2f{50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes il2r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.illu.il2 *{animation:none!important}}
/* lanceur « Tous les écrans » v2 : lignes claires, pastille pastel et icône deux tons */
.lgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lapp{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:9px 12px 9px 9px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:background var(--t-2),box-shadow var(--t-2),transform .35s var(--e-spring);animation-name:lappIn2}
.lapp:hover{background:var(--d-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--d) 30%,transparent)}
.lapp:active{transform:scale(.97)}

.lapp .aic,.app.mobile .lapp .aic{width:40px;height:40px;border-radius:12px;background:var(--d-bg);color:var(--d-ink);box-shadow:none;flex:none}

.lapp:hover .aic{transform:none;box-shadow:none;background:var(--surface)}
.lapp .aic em{top:-5px;right:-5px;min-width:20px;height:20px;font-size:12px;line-height:20px;padding:0 5px}
.lapp[aria-current="page"],.lapp.cur{background:var(--d-bg)}
.lnch .eyebrow{display:flex;align-items:center;gap:8px}
@keyframes lappIn2{from{opacity:0;transform:translateY(8px)}}
.app.mobile .lgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.app.mobile .lapp{gap:9px;padding:8px 9px 8px 8px}
.app.mobile .lapp b{font-size:13.5px}
.app.mobile .lapp .aic{width:36px;height:36px;border-radius:11px}
/* lanceur : une seule couleur, celle de Stabl (marine et saphir), plus d'arc-en-ciel */
.lapp .aic,.app.mobile .lapp .aic{background:var(--acc-bg);color:var(--acc)}
.lapp:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.lapp:hover .aic{background:var(--acc);color:var(--on-acc)}
.lapp[aria-current="page"],.lapp.cur{background:var(--acc-bg);box-shadow:inset 0 0 0 1px var(--acc-line)}
.lapp[aria-current="page"] b,.lapp.cur b{color:var(--acc-deep)}
.lapp .aic em{background:var(--cr)}
.lapp{position:relative}
.lapp .aic,.app.mobile .lapp .aic{position:static}
.lapp .aic em{top:50%;right:10px;transform:translateY(-50%);box-shadow:none;animation:none}
.lapp:has(em) b{padding-right:34px}
/* lanceur = mêmes pastilles colorées que le menu de l'ordinateur (couleur du domaine) */
.lapp .aic,.app.mobile .lapp .aic{width:40px;height:40px;border-radius:12px;background:var(--d-bg);color:var(--d-ink)}
.lapp .aic svg.i{width:21px;height:21px}
.lapp:hover{background:var(--d-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--d) 30%,transparent)}
.lapp:hover .aic,.lapp[aria-current="page"] .aic,.lapp.cur .aic{background:var(--d);color:#fff}
.lapp[aria-current="page"],.lapp.cur{background:var(--d-bg);box-shadow:none}
.lapp[aria-current="page"] b,.lapp.cur b{color:var(--d-ink)}

/* =====================================================================
   PIAFFE LIVE · Styles de la couche live (préfixe .lv-)
   Uniquement les jetons de demo/core/tokens.css : clair et sombre automatiques.
   ===================================================================== */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);margin:0}
/* l'application vendue : pas de barre de démo, plein écran */
#demo{grid-template-rows:minmax(0,1fr)!important}
#demo>.dbar,#demo>.navsw{display:none!important}
.tour{display:none!important}
body.lv-booting #demo{display:none}
#lv-root:empty{display:none}

/* ---------- Écran de chargement ---------- */
.lv-load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;transition:opacity .4s var(--e-out)}
.lv-load.out{opacity:0;pointer-events:none}

.lv-dots{display:flex;gap:6px}.lv-dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);opacity:.25;animation:lvDot 1.1s infinite var(--e-out)}
.lv-dots i:nth-child(2){animation-delay:.15s}.lv-dots i:nth-child(3){animation-delay:.3s}
@keyframes lvDot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* ---------- Écrans d'authentification ---------- */
.lv-auth{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);overflow:auto}
.lv-hero{position:relative;overflow:hidden;background:var(--navy);color:var(--on-navy);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;min-height:100%}

.lv-hero>*{position:relative}
.lv-brand{display:flex;align-items:center;gap:12px;font:800 26px/1 var(--f-display);letter-spacing:-.04em;color:var(--on-navy)}

.lv-brand svg{width:34px;height:34px}
.lv-hero h1{font:800 clamp(34px,4.2vw,56px)/1.02 var(--f-display);letter-spacing:-.045em;max-width:13ch;margin:0}
.lv-hero p{font-size:17px;line-height:1.55;opacity:.82;max-width:42ch;margin:18px 0 0}
.lv-hero .lv-illu{position:absolute;right:-30px;bottom:90px;width:min(46%,380px);opacity:.95;pointer-events:none}
.lv-hero .lv-illu svg{width:100%;height:auto}
.lv-proof{display:flex;flex-wrap:wrap;gap:10px}
.lv-proof span{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--on-navy) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on-navy) 16%,transparent);font-size:14px;font-weight:500}

.lv-side{display:flex;align-items:center;justify-content:center;padding:40px 24px;min-height:100%}

.lv-f{display:flex;flex-direction:column;gap:14px}

.lv-google{width:100%;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;font:600 15.5px var(--f-text);background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .35s var(--e-spring),box-shadow var(--t-2),background var(--t-2)}

.lv-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14.5px;margin-top:4px}
