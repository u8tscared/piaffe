@keyframes lvShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.lv-btn-main{width:100%;height:52px;font-size:16px;border-radius:15px}
.lv-btn-main .lv-spin{display:none}
.lv-btn-main.busy .lv-spin{display:inline-block}
.lv-btn-main.busy .lv-bt{opacity:.75}
.lv-spin{width:18px;height:18px;border-radius:50%;border:2.4px solid currentColor;border-right-color:transparent;animation:lvRot .7s linear infinite}
@keyframes lvRot{to{transform:rotate(360deg)}}
.lv-view{animation:lvIn .5s var(--e-out) both}
@keyframes lvIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lv-big-ico{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--acc-pale);color:var(--acc-deep);margin-bottom:22px;animation:lvPop .6s var(--e-spring) both}

/* ---------- Onboarding ---------- */
.lv-ob{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.lv-ob-top{display:flex;align-items:center;gap:16px;padding:18px max(20px,env(safe-area-inset-left)) 12px;padding-top:calc(18px + env(safe-area-inset-top,0px))}

.lv-prog i{display:block;height:100%;width:var(--v,0%);border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--strass));transition:width .6s var(--e-out)}

@keyframes lvQin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes lvQback{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

.lv-q h1{font:800 clamp(28px,4vw,44px)/1.06 var(--f-display);letter-spacing:-.045em;margin:0 0 12px}
.lv-q .lv-sub{color:var(--mut);font-size:17px;line-height:1.5;margin:0 0 28px;max-width:60ch}
.lv-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.lv-num label{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.lv-num label svg.i{color:var(--acc)}
.lv-step{display:flex;align-items:center;gap:8px}

.lv-step button{width:46px;height:52px;border-radius:14px;flex:none;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--ink);transition:transform .3s var(--e-spring)}

.lv-ob-foot{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px max(20px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.lv-ob-foot .grow{flex:1}

.lv-sirets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lv-siret{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow var(--t-2),background var(--t-2)}

.lv-build{display:flex;flex-direction:column;gap:12px;max-width:520px}

@media (max-width:700px){
  .lv-ob-top{padding-left:16px;padding-right:16px}
  .lv-ob-top .lv-brand span{display:none}
  .lv-ob-body{padding:18px 16px 30px}

}

/* ---------- Coque live : compte, état de synchro ---------- */

.lv-clubs{display:flex;flex-direction:column;gap:8px}

/* ---------- États vides ---------- */

.lv-cal{display:flex;flex-direction:column;gap:12px}
.lv-calrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}

.lv-url{font:500 13px var(--f-mono);color:var(--mut);overflow-wrap:anywhere;margin-top:4px;display:block}

.lv-role{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 20px;border-radius:var(--r-lg);border:2px dashed var(--line-2);text-align:center;color:var(--mut);transition:border-color var(--t-2),background var(--t-2);cursor:pointer}

@media (prefers-reduced-motion:reduce){.lv-view,.lv-q,.lv-opt,.lv-num,.lv-recap .card,.lv-empty-illu,.lv-big-ico,.lv-hero::before{animation:none!important}}
/* ---------- Outils : remplacer ou connecter, passerelle de migration ---------- */
.lv-tools .lv-opt.row{min-height:58px}
.lv-logo{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;overflow:hidden;object-fit:contain}

.lv-tp{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);animation:lvIn .45s var(--e-out) both;animation-delay:calc(var(--i,0)*50ms);flex-wrap:wrap}
.lv-tp>.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);flex:none}

.lv-seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--bg-2);gap:2px;flex-wrap:wrap}
.lv-seg>button{border:0;background:transparent;color:var(--mut);font:600 14px var(--f-text);height:38px;padding:0 14px;border-radius:var(--r-pill);cursor:pointer;transition:background var(--t-2),color var(--t-2)}

html.lv-noscroll,html.lv-noscroll body{overflow:hidden}
.lv-migframe{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:var(--bg);animation:lvIn .3s var(--e-out) both}
.lv-migframe.out{opacity:0;transition:opacity .25s}
.lv-migbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.lv-migbar .grow{display:flex;flex-direction:column;min-width:0}
.lv-migbar small{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:640px){.lv-tp .lv-seg{width:100%}.lv-tp .lv-seg>button{flex:1;padding:0 8px;font-size:13px}.lv-migbar .lv-brand{display:none}}
.lv-tp-only{font:600 14px var(--f-text);color:var(--ink-2);padding:9px 14px;border-radius:var(--r-pill);background:var(--bg-2)}
.lv-tp-fx{flex-basis:100%;color:var(--mut);font-size:13.5px;line-height:1.45;padding-left:54px}

.lv-logo{background:#fff;padding:2px;box-sizing:border-box}

  width:min(560px,calc(100vw - 24px));padding:10px 10px 10px 14px;border-radius:16px;background:var(--surface);color:var(--ink);font-size:14.5px;line-height:1.4;

   Chargé après lv.css. Aperçu en direct à droite, motion douce, clair et sombre.
   ===================================================================== */

/* ---------- Coque de l'onboarding : question à gauche, aperçu à droite ---------- */
.lv-ob.v2{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
@media (min-width:1100px){
  .lv-ob.v2{grid-template-columns:minmax(0,1fr) minmax(420px,44%);grid-template-rows:auto minmax(0,1fr) auto}
  .lv-ob.v2>.lv-ob-top,.lv-ob.v2>.lv-ob-body,.lv-ob.v2>.lv-ob-foot{grid-column:1}
  .lv-ob.v2>.ob-live{grid-column:2;grid-row:1 / span 3}
}
.lv-ob.v2 .lv-ob-top{gap:18px}
.lv-ob.v2 .lv-ob-body{padding:28px clamp(20px,5vw,72px) 40px}

.ob-rail i{flex:1;height:6px;border-radius:99px;background:var(--bg-2);position:relative;overflow:hidden}
.ob-rail i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--strass));transform:scaleX(0);transform-origin:left;transition:transform .7s var(--e-out)}
.ob-rail i.done::after{transform:scaleX(1)}
.ob-rail i.cur::after{transform:scaleX(.45)}

/* ---------- Aperçu en direct (colonne marine) ---------- */
.ob-live{position:relative;overflow:hidden;background:#0a1636;color:#fff;display:none;flex-direction:column;justify-content:center;padding:48px clamp(28px,4vw,64px)}
@media (min-width:1100px){.ob-live{display:flex}}
.ob-live::before{content:"";position:absolute;inset:-25%;background:radial-gradient(36% 30% at 18% 18%,rgba(109,139,255,.42),transparent 70%),radial-gradient(30% 28% at 88% 86%,rgba(36,72,216,.55),transparent 70%),radial-gradient(22% 20% at 70% 30%,rgba(169,188,255,.18),transparent 70%);animation:lvDrift 18s var(--e-in-out) infinite alternate;pointer-events:none}
.ob-live>*{position:relative}
.ob-live-lab{display:flex;align-items:center;gap:10px;font:700 12.5px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-bottom:18px}

@keyframes obPulse{0%{box-shadow:0 0 0 0 rgba(79,211,148,.55)}70%{box-shadow:0 0 0 10px rgba(79,211,148,0)}100%{box-shadow:0 0 0 0 rgba(79,211,148,0)}}

.ob-win-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#eceef5;border-bottom:1px solid #e1e4ee}

.ob-club .av{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2448d8,#6d8bff);color:#fff;display:grid;place-items:center;font:800 14px/1 var(--f-display);flex:none;transition:transform .5s var(--e-spring)}

.ob-club b{display:block;font:700 12.5px/1.2 var(--f-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}

.ob-win-main{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}

.ob-kpi small{font-size:10.5px;color:#868da4}
.ob-card{background:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 0 0 1px #eceef5;font-size:11.5px;color:#27314f}
.ob-card h5{margin:0 0 7px;font:700 11.5px/1 var(--f-text);display:flex;align-items:center;gap:6px;color:#0a1636}
.ob-card h5 svg.i{width:14px;height:14px;color:#2448d8}
.ob-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ob-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;background:#f2f4f8;font:600 10.5px/1 var(--f-text);color:#27314f;animation:lvIn .45s var(--e-out) both}
.ob-chip.ok{background:#dcf3e4;color:#11864f}
.ob-chip.acc{background:#e7ecff;color:#1834b0}
.ob-arrow{width:34px;height:2px;background:repeating-linear-gradient(90deg,#2448d8 0 4px,transparent 4px 8px);background-size:16px 2px;animation:obDash .8s linear infinite;border-radius:2px}
@keyframes obDash{to{background-position:16px 0}}
.ob-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
.ob-tg{width:26px;height:15px;border-radius:99px;background:#d6dbe6;position:relative;transition:background .3s;flex:none}
.ob-tg::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .35s var(--e-spring)}
.ob-tg.on{background:#2448d8}.ob-tg.on::after{transform:translateX(11px)}
.ob-empty{color:#a3abc2;font-style:italic}

/* ---------- Écran d'accueil de l'onboarding ---------- */
.ob-hello{display:flex;flex-direction:column;align-items:flex-start}
.ob-mark{width:78px;height:78px;border-radius:24px;background:linear-gradient(140deg,#2448d8,#6d8bff);display:grid;place-items:center;color:#fff;margin-bottom:26px;box-shadow:0 18px 40px -14px rgba(36,72,216,.7);animation:obMark 1s var(--e-spring) both}
.ob-mark svg{width:50px;height:50px}
@keyframes obMark{from{opacity:0;transform:scale(.4) rotate(-18deg)}}
.ob-promise{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 28px;width:100%}
.ob-promise div{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface-2);font-size:14px;line-height:1.4;color:var(--ink-2);animation:lvIn .55s var(--e-out) both;animation-delay:calc(.25s + var(--i,0)*90ms)}
.ob-promise svg.i{color:var(--acc);flex:none;margin-top:1px}
.ob-promise b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
@media (max-width:720px){.ob-promise{grid-template-columns:1fr}}

/* ---------- Blocs regroupés sur un même écran ---------- */
.ob-sec{margin-top:26px}
.ob-sec:first-of-type{margin-top:0}
.ob-sec>h3{font:700 16px/1.3 var(--f-text);margin:0 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:0}
.ob-sec>h3 svg.i{color:var(--acc)}
.ob-sec>h3 .lv-hint{font-weight:500}
.ob-blocks{display:flex;flex-direction:column;gap:14px}
.ob-block{padding:18px 20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);animation:lvIn .5s var(--e-out) both;animation-delay:calc(var(--i,0)*70ms)}
.ob-block>h3{font:700 16.5px/1.3 var(--f-text);margin:0 0 4px;display:flex;align-items:center;gap:9px;letter-spacing:0}
.ob-block>h3 svg.i{color:var(--acc)}
.ob-block>p{margin:0 0 14px;color:var(--mut);font-size:14.5px;line-height:1.45}
.ob-pills{display:flex;flex-wrap:wrap;gap:8px}
.ob-pill{height:44px;padding:0 16px;border-radius:14px;font:600 14.5px/1 var(--f-text);background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);display:inline-flex;align-items:center;gap:8px;transition:transform .3s var(--e-spring),background .2s,box-shadow .2s}
.ob-pill:hover{transform:translateY(-1px)}
.ob-pill[aria-pressed="true"]{background:var(--acc-pale);color:var(--acc-2);box-shadow:inset 0 0 0 2px var(--acc)}
.ob-pill .rec{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:var(--ok-pale);padding:3px 7px;border-radius:99px}
.ob-pill.sm{height:38px;font-size:14px;padding:0 13px}
.ob-reveal{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s var(--e-out),opacity .4s,margin .4s;margin-top:0}
.ob-reveal.on{max-height:240px;opacity:1;margin-top:14px}

/* ---------- Outils : tuile « je pars de zéro » ---------- */
.ob-zero{grid-column:1 / -1}
.lv-opt.ob-zero{min-height:64px;background:linear-gradient(120deg,var(--surface),var(--acc-pale))}

/* ---------- Récupération : flux animé ancien logiciel → Stabl ---------- */
.ob-move{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:22px;border-radius:var(--r-lg);background:var(--surface-2);margin-bottom:18px;animation:lvIn .5s var(--e-out) both}
.ob-move .src{display:flex;flex-direction:column;gap:8px}
.ob-move .src span{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;background:var(--surface);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow-1)}
.ob-move .src .lv-logo,.ob-move .src svg{width:22px;height:22px}
.ob-pipe{position:relative;height:56px}
.ob-pipe::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--acc-line) 0 6px,transparent 6px 12px)}
.ob-pipe i{position:absolute;top:50%;width:30px;height:22px;margin-top:-11px;border-radius:7px;background:var(--surface);box-shadow:var(--shadow-1),inset 0 0 0 1.5px var(--acc-line);display:grid;place-items:center;animation:obPipe 3.2s var(--e-in-out) infinite;opacity:0}
.ob-pipe i svg.i{width:13px;height:13px;color:var(--acc)}
.ob-pipe i:nth-child(2){animation-delay:.8s}.ob-pipe i:nth-child(3){animation-delay:1.6s}.ob-pipe i:nth-child(4){animation-delay:2.4s}
@keyframes obPipe{0%{left:0;opacity:0;transform:scale(.7)}12%{opacity:1;transform:none}85%{opacity:1}100%{left:calc(100% - 30px);opacity:0;transform:scale(.7)}}
.ob-move .dst{width:64px;height:64px;border-radius:20px;background:#0a1636;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(10,22,54,.6)}
.ob-move .dst svg{width:38px;height:38px}
.ob-what{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px}
.ob-what span{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);animation:lvIn .45s var(--e-out) both;animation-delay:calc(.2s + var(--i,0)*60ms)}
.ob-what svg.i{color:var(--ok)}
@media (max-width:640px){.ob-move{grid-template-columns:1fr;justify-items:center;text-align:center}.ob-pipe{width:2px;height:60px}.ob-pipe::before{left:0;right:auto;top:0;bottom:0;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--acc-line) 0 6px,transparent 6px 12px)}.ob-pipe i{display:none}}

/* ---------- Construction finale ---------- */
.ob-build{position:fixed;inset:0;z-index:20;background:#0a1636;color:#fff;display:grid;place-items:center;padding:24px;overflow:hidden}
.ob-build::before{content:"";position:absolute;inset:-20%;background:radial-gradient(34% 30% at 30% 25%,rgba(109,139,255,.35),transparent 70%),radial-gradient(30% 30% at 75% 80%,rgba(36,72,216,.5),transparent 70%);animation:lvDrift 14s var(--e-in-out) infinite alternate}
.ob-build>div{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:520px;width:100%}
.ob-ring{position:relative;width:148px;height:148px;margin-bottom:28px}
.ob-ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ob-ring circle{fill:none;stroke-width:5}
.ob-ring .bg{stroke:rgba(255,255,255,.1)}
.ob-ring .fg{stroke:url(#obg);stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset .6s var(--e-out)}
.ob-ring .h{position:absolute;inset:30px;display:grid;place-items:center}
.ob-ring .h svg{width:100%;height:100%}
.ob-ring .h path{fill:transparent;stroke:#fff;stroke-width:1.2;stroke-dasharray:420;stroke-dashoffset:420;animation:obDraw 2.2s var(--e-in-out) forwards,obFill .8s 1.9s var(--e-out) forwards}
@keyframes obDraw{to{stroke-dashoffset:0}}
@keyframes obFill{to{fill:#fff;stroke-width:0}}
.ob-build h1{font:800 clamp(28px,4vw,40px)/1.08 var(--f-display);letter-spacing:-.045em;margin:0 0 10px}
.ob-build p{color:rgba(255,255,255,.72);margin:0 0 26px;font-size:16px}
.ob-steps{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;text-align:left}
.ob-steps .li{display:flex;align-items:center;gap:12px;font-size:15px;color:rgba(255,255,255,.4);transition:color .4s}
.ob-steps .li .c{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2);transition:background .4s,box-shadow .4s}
.ob-steps .li .c svg{width:14px;height:14px;fill:none;stroke:#0a1636;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .4s var(--e-spring)}
.ob-steps .li.on{color:#fff}
.ob-steps .li.on .c{box-shadow:inset 0 0 0 2px #6d8bff;animation:obSpin 1s linear infinite;border-top:2px solid transparent}
.ob-steps .li.done .c{background:#4fd394;box-shadow:none;animation:none}
.ob-steps .li.done .c svg{transform:scale(1)}
@keyframes obSpin{50%{box-shadow:inset 0 0 0 2px #a9bcff}}
.ob-spark{position:absolute;width:8px;height:8px;pointer-events:none;background:#a9bcff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:obSpark 1.4s var(--e-out) forwards}
@keyframes obSpark{from{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(180deg)}}

/* ---------- Accueil adhérent ---------- */
.ad-ob{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.ad-ob .lv-ob-body{display:flex;justify-content:center;padding:24px 20px 40px;overflow:auto}
.ad-ob .lv-q{max-width:560px}
.ad-hero{position:relative;border-radius:28px;overflow:hidden;background:#0a1636;color:#fff;padding:28px 26px 24px;margin-bottom:22px;animation:lvIn .6s var(--e-out) both}
.ad-hero::before{content:"";position:absolute;inset:-30%;background:radial-gradient(40% 40% at 85% 10%,rgba(109,139,255,.5),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(36,72,216,.55),transparent 70%);animation:lvDrift 16s var(--e-in-out) infinite alternate}
.ad-hero>*{position:relative}
.ad-hero .club{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.ad-hero .club .av{width:48px;height:48px;border-radius:15px;background:#fff;color:#0a1636;display:grid;place-items:center;font:800 21px/1 var(--f-display)}
.ad-hero .club b{display:block;font-size:17px}.ad-hero .club small{color:rgba(255,255,255,.7);font-size:13.5px}
.ad-hero h1{font:800 clamp(28px,6vw,38px)/1.05 var(--f-display);letter-spacing:-.045em;margin:0 0 8px}
.ad-hero p{margin:0;color:rgba(255,255,255,.78);font-size:15.5px;line-height:1.5}
.ad-hero .ad-horse{position:absolute;right:-18px;bottom:-26px;width:150px;height:150px;opacity:.13}
.ad-hero .ad-horse svg{width:100%;height:100%}
.ad-list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.ad-list div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:15px;animation:lvIn .5s var(--e-out) both;animation-delay:calc(.2s + var(--i,0)*80ms)}
.ad-list .ico{flex:none}
.ad-tog{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);margin-bottom:10px;cursor:pointer;animation:lvIn .5s var(--e-out) both;animation-delay:calc(var(--i,0)*70ms)}
.ad-tog .grow b{display:block;font-size:15.5px;margin-bottom:3px}
.ad-tog .grow small{color:var(--mut);font-size:14px;line-height:1.4}
.ad-tog[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--acc);background:var(--acc-pale)}
.ad-sw{width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .3s;margin-top:2px}
.ad-sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .4s var(--e-spring)}
[aria-checked="true"]>.ad-sw{background:var(--acc)}
[aria-checked="true"]>.ad-sw::after{transform:translateX(18px)}
.ad-horses{display:grid;gap:12px}
.ad-hc{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);animation:lvIn .5s var(--e-out) both}
.ad-hc .ph{width:72px;height:72px;border-radius:18px;background:linear-gradient(140deg,#e7ecff,#c2cdfb);display:grid;place-items:center;color:#2448d8;flex:none;overflow:hidden;position:relative}
.ad-hc .ph img{width:100%;height:100%;object-fit:cover}
.ad-hc .ph svg{width:40px;height:40px}
.ad-hc b{display:block;font:800 19px/1.1 var(--f-display);letter-spacing:-.03em}
.ad-hc small{color:var(--mut);font-size:13.5px}
.ad-go{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.ad-go button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;font:700 15px/1.25 var(--f-text);color:var(--ink);transition:transform .35s var(--e-spring),box-shadow .2s;animation:lvIn .5s var(--e-out) both;animation-delay:calc(.3s + var(--i,0)*90ms)}
.ad-go button:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 2px var(--acc),var(--shadow-2)}
.ad-go button small{font-weight:500;color:var(--mut);font-size:13px}
@media (max-width:560px){.ad-go{grid-template-columns:1fr}.ad-go button{flex-direction:row;align-items:center}}
.ad-done{width:88px;height:88px;border-radius:50%;background:var(--ok-pale);color:var(--ok);display:grid;place-items:center;margin:0 0 20px;animation:lvPop .6s var(--e-spring) both}
.ad-done svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:obDraw .6s .35s var(--e-out) forwards}

/* ---------- Inscription : qui êtes-vous ? ---------- */
.lv-who{display:grid;gap:12px;margin-bottom:6px}
.lv-who button{display:flex;gap:16px;align-items:center;text-align:left;padding:18px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .35s var(--e-spring),box-shadow .2s,background .2s;animation:lvIn .5s var(--e-out) both;animation-delay:calc(var(--i,0)*80ms)}
.lv-who button:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--acc),var(--shadow-2)}
.lv-who .ico{width:52px;height:52px;border-radius:16px;flex:none}
.lv-who b{display:block;font-size:16.5px;margin-bottom:3px}
.lv-who small{color:var(--mut);font-size:14px;line-height:1.4}
.lv-who .arr{margin-left:auto;color:var(--mut);transition:transform .3s var(--e-spring)}
.lv-who button:hover .arr{transform:translateX(4px);color:var(--acc)}
.lv-back{display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--f-text);color:var(--mut);margin-bottom:18px;background:none;padding:6px 0}
.lv-back:hover{color:var(--ink)}
.lv-yn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 20px}
.lv-yn button{height:48px;border-radius:14px;font:600 15px/1 var(--f-text);background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.lv-yn button[aria-pressed="true"]{background:var(--acc-pale);color:var(--acc-2);box-shadow:inset 0 0 0 2px var(--acc)}
.lv-panel{padding:18px;border-radius:18px;background:var(--surface-2);animation:lvIn .45s var(--e-out) both;margin-bottom:16px}
.lv-panel p{margin:0 0 10px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.lv-panel p:last-child{margin-bottom:0}
.lv-panel ol{margin:0;padding-left:20px;font-size:15px;line-height:1.6;color:var(--ink-2)}

/* ---------- Héros de la connexion : silhouette et cartes flottantes ---------- */
.lv-hero .lv-illu.v2{right:auto;left:50%;bottom:120px;width:min(70%,420px);transform:translateX(-30%);opacity:1}
.lv-float{position:absolute;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 20px 40px -18px rgba(0,0,0,.5);color:#fff;font-size:13.5px;line-height:1.3;animation:obFloat 7s var(--e-in-out) infinite alternate;white-space:nowrap}
.lv-float b{display:block;font-size:14px}
.lv-float small{color:rgba(255,255,255,.7)}
.lv-float .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#fff;color:#2448d8;flex:none}
.lv-float .ic svg.i{width:18px;height:18px}
.lv-float.f2{animation-delay:-2.4s;animation-duration:8s}.lv-float.f3{animation-delay:-4.8s;animation-duration:9s}
@keyframes obFloat{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.lv-hmark{position:absolute;right:-60px;bottom:-40px;width:min(62%,460px);opacity:.09;pointer-events:none}
.lv-hmark svg{width:100%;height:auto}
.lv-floats{position:relative;height:250px;margin:10px 0}
.lv-floats .f1{left:0;top:10px}.lv-floats .f2{left:34%;top:96px}.lv-floats .f3{left:8%;top:180px}
@media (max-width:900px){.lv-floats,.lv-hmark{display:none}}

@media (prefers-reduced-motion:reduce){
  .ob-win,.ob-mark,.ob-promise div,.ob-block,.ob-mi.new,.ob-pipe i,.ob-arrow,.ob-live::before,.ob-build::before,.ob-ring .h path,.ad-hero,.ad-hero::before,.ad-list div,.ad-tog,.ad-hc,.ad-go button,.lv-who button,.lv-float,.ob-what span,.ob-move{animation:none!important}
  .ob-ring .h path{fill:#fff;stroke-width:0}
}
.ob-steps .li{border:0!important;padding:0!important;min-height:0!important;background:none!important}

/* Démo des parcours d'inscription : écrans propres à la démo (choix du parcours, boîte e-mail, fin) */
.dm-hub{position:fixed;inset:0;overflow:auto;background:#0a1636;color:#fff}
.dm-hub::before{content:"";position:fixed;inset:-20%;background:radial-gradient(34% 30% at 15% 15%,rgba(109,139,255,.4),transparent 70%),radial-gradient(30% 30% at 90% 85%,rgba(36,72,216,.55),transparent 70%);animation:lvDrift 18s var(--e-in-out) infinite alternate;pointer-events:none}
.dm-in{position:relative;max-width:1120px;margin:0 auto;padding:28px 24px 48px}
.dm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(36px,8vh,90px)}
.dm-top .lv-brand{color:#fff;font-size:24px}
.dm-mails{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.dm-mails:hover{background:rgba(255,255,255,.16)}
.dm-hub h1{font:800 clamp(38px,6vw,72px)/1 var(--f-display);letter-spacing:-.05em;margin:10px 0 16px;max-width:14ch}
.dm-hub>.dm-in>p:not(.dm-foot){font-size:18px;line-height:1.55;color:rgba(255,255,255,.75);max-width:58ch;margin:0 0 40px}
.dm-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.dm-cards{grid-template-columns:1fr}}
.dm-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px;border-radius:26px;background:#fff;color:#0a1636;text-decoration:none;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);transition:transform .45s var(--e-spring),box-shadow .3s;animation:lvIn .6s var(--e-out) both;animation-delay:calc(.15s + var(--i,0)*100ms);min-height:250px}
.dm-card:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 40px 70px -30px rgba(0,0,0,.7),0 0 0 3px #6d8bff}
.dm-card .tag{font:700 11.5px/1 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:#2448d8;background:#e7ecff;padding:6px 9px;border-radius:99px}
.dm-card .ico{width:52px;height:52px;border-radius:16px}
.dm-card b{font:800 23px/1.1 var(--f-display);letter-spacing:-.035em}
.dm-card small{font-size:15px;line-height:1.5;color:#59627c}
.dm-card .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#2448d8}
.dm-card:hover .go svg{transform:translateX(4px)}.dm-card .go svg{transition:transform .3s var(--e-spring)}
.dm-foot{margin-top:36px;font-size:14px;color:rgba(255,255,255,.6)}
.dm-foot a{color:#fff}
.dm-ribbon{position:fixed;z-index:90;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:99px;background:#0a1636;color:#fff;text-decoration:none;font-size:13px;box-shadow:0 14px 34px -12px rgba(10,22,54,.6),inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}
.dm-ribbon b{background:#fff;color:#0a1636;padding:6px 11px;border-radius:99px;font-size:12.5px}
.dm-ribbon span{opacity:.8}
@media (max-width:600px){.dm-ribbon span{display:none}.dm-ribbon{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
.dm-inbox{position:fixed;inset:0;overflow:auto;background:#eef0f6;padding:28px 16px 140px;display:flex;justify-content:center}
.dm-mail{width:100%;max-width:720px;background:#fff;border-radius:20px;box-shadow:0 24px 60px -30px rgba(10,22,54,.4);overflow:hidden;animation:lvIn .6s var(--e-out) both;align-self:flex-start}
.dm-mh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #eceef5}
.dm-mh .av{width:40px;height:40px;border-radius:50%;background:#0a1636;display:grid;place-items:center;flex:none}
.dm-mh b{display:block;font-size:15px;color:#0a1636}.dm-mh small{color:#868da4;font-size:13px}
.dm-subj{padding:16px 20px 6px;font:800 22px/1.2 var(--f-display);letter-spacing:-.03em;color:#0a1636}
.dm-frame{width:100%;height:900px;border:0;display:block}
.dm-cta{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-top:1px solid #eceef5;font-size:14px;color:#59627c}
.dm-cta span{display:flex;align-items:center;gap:8px}
.dm-appbg{position:fixed;inset:0;background:var(--bg)}
.dm-end>div{max-width:620px}
.dm-links{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;margin:0 auto 24px}
.dm-links a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:14.5px;text-align:left}
.dm-links a:hover{background:rgba(255,255,255,.14)}
.dm-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dm-ghost{background:rgba(255,255,255,.1)!important;color:#fff!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)!important}
.dm-mig-src{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.dm-mig-src span{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#fff;color:#0a1636;font-weight:600;font-size:14px}
.dm-mig-src svg,.dm-mig-src .lv-logo{width:20px;height:20px}
.dm-mig{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px;margin:0 auto}
.dm-mig .li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);transition:all .4s;text-align:left}
.dm-mig .li.on{color:#fff;background:rgba(255,255,255,.1)}
.dm-mig .li.done .ic{background:#4fd394;color:#0a1636}
.dm-mig .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:background .4s}
.dm-mig b{font:800 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.dm-note{font-size:12.5px!important;opacity:.6;margin-top:14px!important}
.dm-bilan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.dm-bilan div{padding:14px;border-radius:16px;background:var(--surface-2)}
.dm-bilan b{display:block;font:800 26px/1 var(--f-display);letter-spacing:-.03em}
.dm-bilan span{font-size:13.5px;color:var(--mut)}
@media (min-width:1100px){.dm-ribbon{left:auto;right:24px;bottom:24px;transform:none}}
</style></head>

  var b=el.querySelector('.lv-ob-body');b.innerHTML='<div class="lv-q '+dir+'" data-ad="'+s.id+'">'+s.render()+'</div>';b.scrollTop=0;var q=b.firstChild;if(s.bind)s.bind(q);
  var f=el.querySelector('.lv-ob-foot');f.style.display=s.noFoot?'none':'';f.querySelector('.lv-bt').textContent=s.cta||'Continuer';f.querySelector('[data-back]').style.visibility=idx>0?'visible':'hidden';
  el.querySelector('[data-later]').style.visibility=s.id==='end'?'hidden':'visible';
  if(s.id==='end'){save();sparkleDone(q)}}
function sparkleDone(q){var d=q.querySelector('.ad-done');if(d&&PL.obSparkle){d.style.position='relative';setTimeout(function(){PL.obSparkle(d)},300)}}
function next(){var v=visible();if(idx<v.length-1){idx++;dir='fwd';draw()}}
function back(){if(idx>0){idx--;dir='back';draw()}}
/* enregistrement : fiche de l'adhérent (synchro), préférences d'e-mail, téléphone du compte */
var saved=false;
function save(){if(saved)return Promise.resolve();saved=true;setDone();var m=me(),jobs=[];
  if(m){if(A.phone!=null)m.phone=A.phone;if(A.emergency!=null)m.emergency=A.emergency;if(A.emergencyPhone!=null)m.emergencyPhone=A.emergencyPhone;if(A.allergies!=null)m.allergies=A.allergies;
    if(A.consents)m.consents=A.consents;m.onboarded=new Date().toISOString();
    if(PL.sync&&PL.sync.flush)jobs.push(PL.sync.flush().catch(function(){}))}
  if(A.mail&&Object.keys(A.mail).length)jobs.push(PL.put('/api/mail/preferences',{categories:A.mail}).catch(function(){}));
  if(A.phone&&PL.user&&A.phone!==PL.user.phone)jobs.push(PL.patch('/api/me',{phone:A.phone}).then(function(r){if(r&&r.user)PL.user=r.user}).catch(function(){}));
  return Promise.all(jobs)}
var onClose=null;
function close(go){var o=el;if(!o)return;save();if(onClose){var f=onClose;onClose=null;setTimeout(function(){f(go)},360)}o.style.transition='opacity .35s,transform .35s';o.style.opacity='0';o.style.transform='scale(.98)';setTimeout(function(){o.remove();el=null;if(go&&P.mods[go])P.go(go)},360)}

  open:function(o){o=o||{};A={};idx=0;dir='fwd';saved=!!o.dry;onClose=o.onClose||null;

      '<footer class="lv-ob-foot"><button class="btn ghost" data-back>'+ICON('back','sm')+'Retour</button><span class="grow"></span><button class="btn pri" data-next><span class="lv-bt">Continuer</span></button></footer>';
    document.body.appendChild(w);el=w;
    w.querySelector('[data-next]').onclick=next;w.querySelector('[data-back]').onclick=back;

    w.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&!e.target.closest('button,[data-sw]')){e.preventDefault();next()}});
    draw()}
};

/* =====================================================================
   STABL · Démo des parcours d'inscription (stablapp.fr/onboarding/)
   Le VRAI code de l'onboarding (live/50-auth.js, 60-onboarding.js, 62-bienvenue.js), branché sur un
   faux serveur en mémoire : rien n'est enregistré, aucun e-mail n'est envoyé.
   Parcours : #ecurie (création du compte d'un club), #adherent (invitation reçue par e-mail),
   #cavalier (cavalier dont l'écurie n'est pas encore sur Stabl). Sans ancre : le choix du parcours.
   ===================================================================== */
(function(){
var P=window.P,PL=window.PL,D=window.DATA,esc=P.fmt.esc;
var S={user:null,club:null,member:false,done:null};
var CLUB='Écurie du Moulin';
PL.demoOnboarding=true;

/* l'adresse reste /onboarding/#… : les écrans d'authentification ne changent pas le chemin */
var keepPath=function(f){return function(st,t,u){try{var x=new URL(String(u||''),location.href);return f.call(history,st,t,location.pathname+(x.hash||location.hash))}catch(e){return f.call(history,st,t,u)}}};
history.pushState=keepPath(history.pushState);history.replaceState=keepPath(history.replaceState);

/* ---------- Faux serveur ---------- */
function json(b,st){return Promise.resolve(new Response(JSON.stringify(b),{status:st||200,headers:{'content-type':'application/json'}}))}
function wait(ms,v){return new Promise(function(r){setTimeout(function(){r(v)},ms)})}
function body(i){try{return i&&i.body?JSON.parse(i.body):{}}catch(e){return {}}}
var realFetch=window.fetch.bind(window);
window.fetch=function(u,init){var url=new URL(String(u),location.href),p=url.pathname,m=((init&&init.method)||'GET').toUpperCase(),b=body(init);
  if(!/^\/(api|auth)\//.test(p)||url.origin!==location.origin)return realFetch(u,init);
  var r=route(m,p,url,b);return wait(r.ms==null?380:r.ms).then(function(){return json(r.b,r.st)})};
function route(m,p,url,b){
  if(p==='/api/me')return S.user?{b:{user:S.user,clubs:S.club?[{id:'c1',name:S.club,role:S.member?'member':'owner'}]:[],current_club_id:S.club?'c1':null,role:S.member?'member':'owner',features:{google:false,mail:true,payments:true}},ms:120}:{b:{user:null},ms:120};
  if(p==='/auth/signup'){S.user={id:'u1',first:b.first,last:b.last,email:b.email,email_verified:false};return {b:{user:S.user},ms:650}}
  if(p==='/auth/login'){S.user=S.user||{id:'u1',first:'Claire',last:'Martin',email:b.email,email_verified:true};return {b:{user:S.user}}}
  if(/^\/auth\/(magic|password\/forgot|verify\/resend|logout)$/.test(p))return {b:{ok:true}};
  if(p==='/api/onboarding/siret'){var q=(url.searchParams.get('q')||'').trim(),nm=/\d{9}/.test(q.replace(/\s/g,''))?CLUB:q.replace(/(^|\s)\S/g,function(x){return x.toUpperCase()});
    return {b:{results:[{name:nm,siret:'12345678900012',siren:'123456789',legal_form:'sas',naf:'93.12Z',active:true,address:{line1:'12 chemin des Prés',zip:'69380',city:'Lozanne',country:'FR'}},
      {name:nm+' (ancien établissement)',siret:'12345678900020',siren:'123456789',legal_form:'sas',naf:'93.12Z',active:false,address:{line1:'4 route de Lyon',zip:'69380',city:'Lozanne',country:'FR'}}]},ms:700}}
  if(p==='/api/clubs'&&m==='POST'){S.club=b.name||CLUB;return {b:{club:{id:'c1',name:S.club}}}}
  if(p==='/api/onboarding/complete'){S.done='ecurie';return {b:{ok:true},ms:2600}}
  if(p==='/auth/invitations/demo'&&m==='GET')return {b:{invitation:{status:'pending',club:{name:CLUB},role:'member',email:'lea.durand@exemple.fr',first:'Léa',last:'Durand',inviter_name:'Claire Martin',account_exists:false}},ms:500};
  if(p==='/auth/invitations/demo/accept'){S.user={id:'u2',first:b.first||'Léa',last:b.last||'Durand',email:'lea.durand@exemple.fr',email_verified:true};S.club=CLUB;S.member=true;return {b:{club_id:'c1'},ms:700}}
  if(p==='/api/public/recommander')return {b:{ok:true},ms:800};
  if(p==='/api/mail/preferences')return {b:{email:(S.user||{}).email,categories:[{key:'bookings',label:'Confirmations de réservation',enabled:true},{key:'reminders',label:'Rappels de cours et de soins',enabled:true},{key:'waitlist',label:'Places libérées',enabled:false}]}};
  if(p==='/api/me'&&m==='PATCH')return {b:{user:S.user}};
  return {b:{ok:true},ms:200};
}

/* ---------- Récupération des données : simulation visible ---------- */
var BILAN=[['members','Adhérents',182],['family','Familles',64],['horse','Chevaux',31],['tag','Forfaits et cartes',12],['invoice','Factures',1240],['planning','Reprises au planning',46]];

    '<div class="dm-mig">'+BILAN.map(function(x,i){return '<div class="li" data-i="'+i+'"><span class="ic">'+ICON(x[0],'sm')+'</span><span class="grow">'+x[1]+'</span><b data-n="'+x[2]+'">0</b></div>'}).join('')+'</div><p class="dm-note">Démo : chiffres d’exemple</p></div>';
  document.body.appendChild(ov);var rows=ov.querySelectorAll('.dm-mig .li'),k=0;
  (function step(){if(k>=rows.length){ov.querySelector('h1').textContent='Données récupérées.';ov.querySelector('p').textContent='Tout a été vérifié à blanc : rien ne manque.';if(PL.obSparkle)PL.obSparkle(ov.querySelector('.dm-mig'));setTimeout(function(){ov.style.transition='opacity .4s';ov.style.opacity='0';setTimeout(function(){ov.remove();res({etat:'termine',job_id:'demo'})},420)},1500);return}
    var r=rows[k],b=r.querySelector('b'),n=+b.getAttribute('data-n'),t0=performance.now();r.classList.add('on');
    (function count(t){var x=Math.min(1,(t-t0)/650);b.textContent=Math.round(n*(1-Math.pow(1-x,3))).toLocaleString('fr-FR');if(x<1)requestAnimationFrame(count);else{r.classList.add('done');k++;setTimeout(step,120)}})(t0)})()})};

PL.mig.bilanHTML=function(){return '<div class="dm-bilan">'+BILAN.map(function(x){return '<div><b>'+x[2].toLocaleString('fr-FR')+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div><p class="lv-note">Démo : chiffres d’exemple. Dans le vrai logiciel, le bilan détaille chaque fiche reprise.</p>'};
PL.createSandbox=function(){location.href='../demo/';return new Promise(function(){})};

/* ---------- Données de l'adhérente de démo (pour l'accueil adhérent) ---------- */
function memberData(){D.members=[{id:'m1',first:'Léa',last:'Durand',fam:'fam1',minor:false,galop:4,email:'lea.durand@exemple.fr'}];
  D.horses=[{id:'h1',name:'Tornade',owner:'m1',breed:'Selle Français',box:'B03',born:2014}];D.club={name:CLUB};PL.personRef='m1';PL.personIds=['m1'];PL.clubId=null;PL.view='adherent'}

/* ---------- Écrans propres à la démo ---------- */
function root(){var r=document.getElementById('lv-root');r.innerHTML='';document.body.classList.add('lv-booting');return r}
function ribbon(){if(document.querySelector('.dm-ribbon'))return;var d=document.createElement('a');d.className='dm-ribbon';d.href='#';d.innerHTML=ICON('eye','sm')+'<span>Démo des parcours · rien n’est enregistré</span><b>Changer de parcours</b>';document.body.appendChild(d)}
function hub(){S={user:null,club:null,member:false,done:null};var r=root();document.title='Créer son compte · Stabl';
  var C=[['ecurie','stable','d-acc','Je crée le compte de mon écurie','Inscription, questions, récupération des données Kavalog, puis l’espace prêt. Deux minutes.','Parcours écurie'],
    ['adherent','mail','d-mo','Mon écurie m’invite','L’e-mail reçu, la création de l’accès, puis l’accueil : coordonnées, autorisations, cheval. Une minute.','Parcours adhérent'],
    ['cavalier','horse','d-tm','Mon écurie n’est pas sur Stabl','Le cavalier recommande Stabl à son écurie en un e-mail.','Parcours cavalier']];
  r.innerHTML='<div class="dm-hub"><div class="dm-in"><div class="dm-top">'+PL.brandHTML(30,'#fff')+'<a class="dm-mails" href="mails/">'+ICON('mail','sm')+'Voir les e-mails</a></div>'+
    '<div class="eyebrow" style="color:#a9bcff">Démo interactive</div><h1>Créer son compte sur Stabl</h1><p>Le vrai écran d’inscription et d’accueil du logiciel, branché sur un faux serveur : cliquez, remplissez, rien n’est enregistré et aucun e-mail ne part.</p>'+
    '<div class="dm-cards">'+C.map(function(c,i){return '<a class="dm-card" href="#'+c[0]+'" style="--i:'+i+'"><span class="tag">'+c[5]+'</span><span class="ico '+c[2]+'">'+ICON(c[1])+'</span><b>'+c[3]+'</b><small>'+c[4]+'</small><span class="go">Commencer '+ICON('right','sm')+'</span></a>'}).join('')+'</div>'+
    '<p class="dm-foot"><a href="mails/">Les e-mails envoyés à chaque étape</a> · <a href="../demo/">La démo complète du logiciel</a> · <a href="../">stablapp.fr</a></p></div></div>'}
function inbox(){var r=root();document.title='Votre boîte e-mail · démo Stabl';ribbon();
  r.innerHTML='<div class="dm-inbox"><div class="dm-mail"><div class="dm-mh"><span class="av">'+PL.brandLogo(22,'#fff')+'</span><div class="grow"><b>'+esc(CLUB)+' via Stabl</b><small>à lea.durand@exemple.fr · à l’instant</small></div><span class="chip">Boîte de réception</span></div>'+
    '<div class="dm-subj">Bienvenue chez '+esc(CLUB)+' : activez votre espace</div><iframe class="dm-frame" title="E-mail reçu" src="mails/m/welcome_member.html"></iframe>'+
    '<div class="dm-cta"><span>'+ICON('info','sm')+'Dans la vraie vie, Léa clique sur le bouton du mail.</span><button class="btn pri" data-open>'+ICON('right','sm')+'Cliquer sur « Activer mon espace »</button></div></div></div>';
  var f=r.querySelector('iframe');f.onload=function(){try{var d=f.contentDocument;d.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();openInvite()})});f.style.height=Math.min(1400,d.documentElement.scrollHeight+4)+'px'}catch(e){}};
  r.querySelector('[data-open]').onclick=openInvite}
function openInvite(){history.replaceState(null,'','#adherent-invitation');PL.auth('invite',{token:'demo'});ribbon()}
function endScreen(kind){var r=root();ribbon();var E={
  ecurie:['L’espace de '+esc(S.club||CLUB)+' est prêt.','Dans le vrai logiciel, Claire arrive sur son tableau de bord avec sa liste de démarrage : inviter ses cavaliers, activer le paiement en ligne, vérifier les données reprises.',[['mails/m/welcome_owner.html','E-mail de bienvenue reçu par le gérant'],['mails/m/verify_email.html','E-mail de confirmation d’adresse'],['mails/m/welcome_member.html','E-mail que recevront ses cavaliers']]],
  adherent:['Léa est prête.','Dans le vrai logiciel, elle arrive sur son espace : réserver une reprise, payer ses factures, suivre Tornade. Le club voit son contact d’urgence et ses autorisations sur sa fiche.',[['mails/m/booking_confirmed.html','E-mail à chaque réservation'],['mails/m/invoice_issued.html','E-mail de facture'],['mails/m/payment_receipt.html','Reçu de paiement']]]}[kind];
  r.innerHTML='<div class="ob-build dm-end"><div><div class="ad-done" style="background:rgba(79,211,148,.16);color:#4fd394;margin:0 auto 22px"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>'+E[0]+'</h1><p>'+E[1]+'</p>'+

    '<div class="dm-btns"><a class="btn pri lg" href="../demo/">'+ICON('eye','sm')+'Ouvrir la démo complète</a><a class="btn lg dm-ghost" href="#">'+ICON('refresh','sm')+'Essayer un autre parcours</a></div></div></div>';

/* ---------- Démarrage (remplace celui du logiciel) ---------- */
var started=false;
PL.afterAuth=function(){PL.start()};
PL.start=function(){var h=location.hash.replace('#','');PL.user=S.user;
  if(!started){started=true;if(h==='ecurie'){PL.auth('signup',{});ribbon();return}if(h==='cavalier'){PL.auth('signup',{as:'rider'});ribbon();return}if(h==='adherent'){inbox();return}if(h==='adherent-invitation'){openInvite();return}hub();return}
  if(S.member){memberData();document.getElementById('lv-root').innerHTML='';document.body.classList.remove('lv-booting');var bg=document.createElement('div');bg.className='dm-appbg';document.getElementById('lv-root').appendChild(bg);
    PL.bienvenue.open({dry:true,onClose:function(){endScreen('adherent')}});return}
  if(S.user&&S.done==='ecurie'){endScreen('ecurie');return}
  if(S.user&&!S.member&&S.user.email_verified===false&&!S.verifySeen){S.verifySeen=true;PL.auth('verify',{});ribbon();return}
  if(S.user&&!S.club){PL.onboarding({});ribbon();return}
  hub()};
window.addEventListener('hashchange',function(){started=false;var o=document.querySelector('.ad-ob');if(o)o.remove();var b=document.querySelectorAll('.ob-build');b.forEach(function(x){x.remove()});try{localStorage.removeItem('piaffe:live:onb')}catch(e){}PL.start()});
try{localStorage.removeItem('piaffe:live:onb')}catch(e){}
