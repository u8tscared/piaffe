<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Piaffe</title>
<style>
:root{--ink:#0a1636;--mut:#59627c;--line:#e6e9f0;--bg:#f2f4f8;--card:#fff;--acc:#2448d8;--acc-pale:#e7ecff;--ok:#11864f;--ok-pale:#dcf3e4;--warn:#a85d00;--warn-pale:#ffedcf;--strass:#6d8bff;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root{--ink:#eef1fa;--mut:#a3abc4;--line:#2a3352;--bg:#0b1020;--card:#141a2e;--acc:#7d97ff;--acc-pale:#1d2750;--ok-pale:#123524;--warn-pale:#3d2a0c}}
*{box-sizing:border-box}body{margin:0;width:380px;min-height:300px;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#0a1636;color:#fff;padding:14px 16px 16px;display:flex;gap:10px;align-items:center}
header i{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}header i::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--strass);box-shadow:0 0 10px var(--strass)}
header b{font-size:15px}header small{display:block;color:#c9d1ea;font-size:12px}
main{padding:12px}
.carte{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px;animation:mont .35s var(--ease) both}
@keyframes mont{from{opacity:0;transform:translateY(6px)}}
.site{display:flex;gap:10px;align-items:center}.site .ini{width:34px;height:34px;border-radius:10px;background:var(--acc-pale);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.site small{display:block;color:var(--mut);word-break:break-all}
.alerte{background:var(--warn-pale);color:var(--warn);border-radius:12px;padding:8px 10px;margin-top:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 12px;width:100%;cursor:pointer;background:var(--acc);color:#fff;margin:0 0 8px;display:flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s var(--ease),filter .2s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}button.second{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}button.discret{background:none;color:var(--mut);padding:6px;margin:0;width:auto;font-weight:500}
button:disabled{opacity:.5;cursor:default}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;width:40%;background:var(--acc);border-radius:99px;animation:va 1.2s ease-in-out infinite}
@keyframes va{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#tables{list-style:none;margin:0;padding:0}#tables li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}#tables li:last-child{border:0}
#tables b{font-variant-numeric:tabular-nums;color:var(--ok)}
.total{display:flex;gap:8px}.total div{flex:1;background:var(--ok-pale);color:var(--ok);border-radius:12px;padding:8px;text-align:center}.total strong{display:block;font-size:20px}
#journal{font-size:12px;color:var(--mut);max-height:90px;overflow:auto;white-space:pre-line}
label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px;margin:0 0 8px}
input[type=url]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);margin:0 0 8px}
h2{font-size:13px;margin:0 0 6px;color:var(--mut);font-weight:600;text-transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><i></i><div><b>Changer de logiciel</b><small>Vos données restent sur cet ordinateur</small></div></header>
<main>
  <div class="carte"><div class="site"><span class="ini" id="ini">?</span><div><b id="nom">Ce site</b><small id="origine"></small></div></div><div id="alerte" class="alerte" hidden></div></div>
  <div class="carte" id="actions">
    <button id="explorer">Tout récupérer automatiquement</button>
    <button id="rejouer" class="second" hidden>Rejouer le chemin connu (plus rapide)</button>
    <button id="copier" class="second">Copier seulement cette liste</button>
    <label><input type="checkbox" id="fiches" checked> Ouvrir aussi les fiches détaillées (plus long)</label>
    <div id="encours" hidden><div class="prog"><i></i></div><small id="progtexte"></small><button id="arreter" class="discret">Arrêter</button></div>
  </div>
  <div class="carte" id="resultat" hidden>
    <div class="total"><div><strong id="nbl">0</strong>lignes</div><div><strong id="nbt">0</strong>listes</div><div><strong id="nbf">0</strong>fiches</div></div>
    <ul id="tables"></ul>
    <button id="telecharger" style="margin-top:10px">Télécharger pour la passerelle Piaffe</button>
    <button id="vider" class="discret">Tout effacer</button>
  </div>
  <div class="carte"><h2>Ouvrir un autre logiciel</h2><input type="url" id="adresse" placeholder="https://adresse-de-votre-logiciel…"><button id="ouvrir" class="second">Ouvrir et me connecter</button></div>
  <div class="carte"><h2>Journal</h2><div id="journal"></div></div>
</main>
<script type="module" src="popup.js"></script>
</body></html>
